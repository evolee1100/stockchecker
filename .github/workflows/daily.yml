name: 每日更新股價

on:
  schedule:
    # 一天三次，時間都是馬來西亞時間（UTC+8）。馬股 9:00 開盤、17:00 收盤。
    - cron: '30 1 * * 1-5'    # 09:30 開盤後，看隔夜消息與開盤反應
    - cron: '0 5 * * 1-5'     # 13:00 午盤休息
    - cron: '30 10 * * 1-5'   # 18:30 收盤後，當日結算
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按一下就跑

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取股價、基本面與新聞
        run: python3 -u fetch.py     # -u 讓進度即時顯示在 Actions 的 log

      - name: 把每日快照存回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "資料更新 $(date -u +'%Y-%m-%d')"
          git push || echo "沒有變更可推送"

      - name: 組出網站檔案
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          # 把建置時間戳進 data.js 的網址。固定網址會被瀏覽器快取住，
          # 從主畫面開啟的 App 尤其頑固——加了版本號才會真的去拿新資料。
          V=$(date -u +%Y%m%d%H%M%S)
          sed -i "s#src=\"data/data.js\"#src=\"data/data.js?v=$V\"#" _site/index.html
          grep -o 'data/data.js?v=[0-9]*' _site/index.html
          cp icon.svg icon-192.png icon-512.png apple-touch-icon.png \
             favicon-32.png favicon-16.png _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
