name: 每日更新股價

on:
  schedule:
    # 每 3 小時一次（cron 用 UTC，註解是馬來西亞時間 UTC+8）。
    # 全天候跑是有意義的：馬股 9:00-17:00，但美股在 21:30-04:00 MYT 交易，
    # 「AI 美股」和「國際」那兩個分頁的行情都在你睡覺時發生。
    - cron: '30 1 * * *'    # 09:30 馬股開盤後
    - cron: '30 4 * * *'    # 12:30 午盤
    - cron: '30 7 * * *'    # 15:30 尾盤
    - cron: '30 10 * * *'   # 18:30 馬股收盤後
    - cron: '30 13 * * *'   # 21:30 美股開盤
    - cron: '30 16 * * *'   # 00:30
    - cron: '30 19 * * *'   # 03:30 美股收盤前
    - cron: '30 22 * * *'   # 06:30
  workflow_dispatch:        # 也可以在 GitHub 網頁上手動按一下就跑

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取股價、基本面與新聞
        run: python3 -u fetch.py     # -u 讓進度即時顯示在 Actions 的 log

      - name: 把每日快照存回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "資料更新 $(date -u +'%Y-%m-%d')"
          git push || echo "沒有變更可推送"

      - name: 組出網站檔案
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          # 這裡以前會把建置時間戳進 <script src="data/data.js"> 的網址來破快取。
          # 現在頁面改用 fetch(..., {cache:'no-store'}) 載入資料，不再有那個標籤，
          # 原本的 sed/grep 找不到東西會讓整個步驟失敗，所以移除。
          cp icon.svg icon-192.png icon-512.png apple-touch-icon.png \
             favicon-32.png favicon-16.png _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
