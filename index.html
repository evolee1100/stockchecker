<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>馬股每日追蹤</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="馬股追蹤">
<style>
/* 淺色 · 極簡：一個表格搞定，只用髮絲線分隔，不用卡片和陰影 */
:root{
  --bg:#fff;
  --line:#e8eaee;
  --hair:#f1f3f5;
  --ink:#16191d;
  --ink-2:#6b737e;
  --ink-3:#98a0ab;   /* 只用於標籤、單位這類不需要細讀的字 */
  --read:#5a626d;    /* 說明文字專用：白底對比 6.2:1，遠高於 AA 的 4.5:1 */
  --up:#0a7a45;
  --down:#c2261f;
  --flat:#a3aab4;
  --tint:#f7f8fa;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:34px 22px 70px}

/* 報頭：中文標題走襯線，跟下面全是無襯線的數據拉開層次。
   用系統內建的宋體/明體（iOS 有 Songti TC、macOS 有 Songti SC），
   不下載網頁字型——CJK 字型檔動輒好幾 MB，手機讀取會拖很久。 */
header{display:flex;align-items:center;gap:11px;
       padding-bottom:15px;margin-bottom:0;border-bottom:1px solid var(--ink)}
.logo{border-radius:7px;flex:none}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.02em;line-height:1.15;
   font-family:"Songti TC","Songti SC","Noto Serif TC","Source Han Serif TC",
               "PingFang TC",serif}
.stamp{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right;
       font-variant-numeric:tabular-nums}
.reload{display:inline-flex;align-items:center;gap:8px;flex:none;cursor:pointer;
        font:inherit;font-size:17px;font-weight:500;line-height:1;
        color:var(--ink-2);background:#fff;border:1px solid var(--line);
        border-radius:4px;padding:11px 17px}      /* 長方形，不是膠囊 */
.reload svg{width:22px;height:22px;flex:none}
.reload:hover{color:var(--ink);border-color:#c9d1da;background:var(--tint)}
.reload:active{transform:translateY(1px)}
.reload.busy svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 市場脈搏：進來第一眼就看到的四個數字。
   不用卡片，用垂直細線分隔，像報紙的行情欄。 */
.pulse{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
       border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.pulse::-webkit-scrollbar{display:none}
.pu{flex:1;min-width:88px;padding:13px 14px 14px;border-left:1px solid var(--hair);cursor:pointer}
.pu:first-child{border-left:none;padding-left:0}
.pu:hover{background:var(--tint)}
.pu .k{font-size:10.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.02em}
.pu .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;
       letter-spacing:-.02em;line-height:1.2;margin-top:5px}
.pu .c{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
@media(max-width:700px){
  .pulse{margin:0 -15px 20px;padding:0 15px}
  .pu{min-width:104px;padding:14px 15px 15px}
  .pu:first-child{padding-left:0}
  .pu .k{font-size:12px}
  .pu .v{font-size:22px}
  .pu .c{font-size:13px}
}

/* 分頁：46 檔擠一頁太長，依用途切開 */
.tabs{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      margin:0 0 20px;padding-bottom:3px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:13px;font-weight:500;line-height:1.6;
     color:var(--ink-2);background:#fff;border:1px solid var(--line);
     border-radius:4px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);border-color:#c9d1da;background:var(--tint)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.tab .n{opacity:.55;margin-left:5px;font-size:11.5px;font-variant-numeric:tabular-nums}
.tab.on .n{opacity:.6}
@media(max-width:700px){
  .tabs{margin:0 -15px 20px;padding:0 15px 4px}
  .tab{font-size:15px;padding:9px 17px}
  .tab .n{font-size:13px}
}

/* 更新完成的通知：5 秒後自己消失 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
       display:flex;align-items:center;gap:11px;white-space:nowrap;
       max-width:calc(100vw - 28px);
       background:var(--ink);color:#fff;border-radius:9px;padding:12px 18px;
       box-shadow:0 8px 26px rgba(16,24,40,.26);
       opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:19px;height:19px;flex:none}
.toast .tt{font-size:14px;font-weight:600;line-height:1.3}
.toast .ts{font-size:12px;line-height:1.3;color:rgba(255,255,255,.7);
           font-variant-numeric:tabular-nums;margin-top:2px}
@media(max-width:700px){
  .toast{padding:14px 20px;bottom:22px;gap:12px}
  .toast svg{width:22px;height:22px}
  .toast .tt{font-size:16px}
  .toast .ts{font-size:13.5px}
}

/* 今日重點 */
.brief{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:26px}
.brief-h{display:flex;align-items:baseline;gap:9px;padding:11px 14px 10px;
         background:var(--tint);border-bottom:1px solid var(--line)}
.brief-h b{font-size:15px;font-weight:600;letter-spacing:.06em;
           font-family:"Songti TC","Songti SC","Noto Serif TC","PingFang TC",serif}
.brief-h span{font-size:11px;color:var(--ink-3)}
.brief-h .tog{margin-left:auto;font:inherit;font-size:11px;color:var(--ink-3);
              background:none;border:none;cursor:pointer;padding:0}
.brief-h .tog:hover{color:var(--ink)}
.bi{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--hair);cursor:pointer}
.bi:last-child{border-bottom:none}
.bi:hover{background:var(--tint)}
.bi .bar{width:3px;border-radius:2px;flex:none;background:var(--ink-3)}
.bi.critical .bar{background:var(--down)}
.bi.warn .bar{background:#d99100}
.bi.good .bar{background:var(--up)}
.bi.info .bar{background:#7aa7e8}
.bi .bt{flex:1;min-width:0}
.bi .bw{font-size:13.5px;line-height:1.5}
.bi .bw b{font-weight:600}
.bi .by{font-size:12.5px;color:var(--read);line-height:1.6;margin-top:4px}
.bi .bn{font-size:11px;color:var(--ink-3);white-space:nowrap;margin-left:auto;padding-left:8px}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
thead th{
  font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.07em;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;padding-bottom:9px;
}
thead th:hover{color:var(--ink)}
th .a{opacity:.35;font-size:8.5px;margin-left:2px}
td{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* 分類標題列 */
tr.group td{
  padding:26px 0 8px;border-bottom:1px solid var(--ink);
  font-size:11.5px;font-weight:650;color:var(--ink);
  letter-spacing:.14em;text-align:left;
}
tr.group:first-child td{padding-top:8px}

tr.row{cursor:pointer}
tr.row:hover td{background:var(--tint)}
tr.row.on td{background:var(--tint)}
/* 最愛 */
.star{background:none;border:none;padding:4px;margin:-4px;cursor:pointer;
      line-height:0;display:inline-flex;color:var(--ink-3);
      -webkit-tap-highlight-color:transparent}
.star svg{width:15px;height:15px;display:block}
.star:hover{color:#c99700}
.star.on{color:#e8a80c}
tr.row td.c-fav{width:1px;padding-left:0;padding-right:6px}
thead th.c-fav{padding-left:0;padding-right:6px;cursor:default}
.name{font-weight:550;letter-spacing:-.005em}
.sym{color:var(--ink-3);font-size:10.5px;font-weight:400;margin-left:7px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.spark{display:block;width:74px;height:22px;margin-left:auto}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:7px;vertical-align:middle}
.dot.bad{background:var(--down)} .dot.warn{background:#d99100}

/* 展開列 */
tr.detail td{padding:0;background:var(--tint);border-bottom:1px solid var(--line);
             white-space:normal;text-align:left}
.dbox{padding:16px 0 20px}
.dnote{font-size:12px;color:var(--read);margin:0 0 12px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.chip{font-size:10.5px;padding:2.5px 9px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.chip.bad{color:var(--down);border-color:#f2cfcd}
.chip.good{color:var(--up);border-color:#c9e6d8}
.chip.warn{color:#8a5c00;border-color:#eeddb6}
.bigchart{display:block;width:100%;height:130px}
/* 有刻度的價格圖 */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart .gl{stroke:var(--hair);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.chart .last{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
/* 跟著游標的價格標籤 */
.tip{position:absolute;pointer-events:none;z-index:3;
     transform:translate(-50%,calc(-100% - 9px));
     background:var(--ink);color:#fff;font-size:11px;line-height:1.35;
     padding:4px 8px;border-radius:6px;white-space:nowrap;
     font-variant-numeric:tabular-nums;opacity:0;transition:opacity .09s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;
           border:4px solid transparent;border-top-color:var(--ink)}

/* 月價試算 */
.calc{margin-top:18px;padding:14px 15px;background:#fff;
      border:1px solid var(--line);border-radius:9px}
.calc h4{margin:0 0 3px;font-size:12px;font-weight:600;color:var(--ink)}
.calc .cnote{font-size:11.5px;color:var(--read);margin:0 0 11px;line-height:1.7}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:14px}
.crow .op{color:var(--ink-3)}
.ci{width:96px;padding:6px 9px;font:inherit;font-size:13.5px;
    font-variant-numeric:tabular-nums;text-align:right;
    border:1px solid var(--line);border-radius:6px;background:var(--tint);color:var(--ink)}
.ci:focus{outline:none;border-color:var(--ink);background:#fff}
.cout{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clab{font-size:10.5px;color:var(--ink-3);width:100%;display:flex;gap:7px}
.clab span{width:96px;text-align:right}
.clab span.w-s{width:66px}
.clab span:last-child{width:auto}
.ci-s{width:66px}
.cunit{font-size:12px;font-weight:500;color:var(--ink-3)}
.cbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.cb{font:inherit;font-size:11px;color:var(--ink-2);background:var(--tint);cursor:pointer;
    border:1px solid var(--line);border-radius:99px;padding:3px 11px;line-height:1.6}
.cb:hover{color:var(--ink);border-color:#d4d9e0;background:#fff}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;
         font-size:11.5px;font-variant-numeric:tabular-nums;margin:5px 0 14px}
.readout .pt{color:var(--ink);font-weight:600}
.readout .rg{color:var(--read)}
/* 圖表區間切換 */
.ranges{display:flex;gap:4px;margin:2px 0 10px}
.rng{font-size:11px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);
     background:#fff;color:var(--ink-2);cursor:pointer;line-height:1.5}
.rng:hover{color:var(--ink);border-color:#d4d9e0}
.rng.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.rmeta{font-size:11px;color:var(--ink-3);margin:0 0 14px;font-variant-numeric:tabular-nums}

/* 重點報導 */
.dg{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 4px}
.dg-h{padding:9px 13px 8px;background:var(--tint);border-bottom:1px solid var(--line);
      font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.dg-r{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--hair)}
.dg-r:last-child{border-bottom:none}
.dg-k{flex:none;width:34px;font-size:11px;color:var(--ink-3);padding-top:1px}
.dg-v{flex:1;min-width:0;font-size:12.5px;line-height:1.7;color:var(--read)}

/* 新聞 */
.news{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){ .news{grid-template-columns:1fr;gap:18px} }
.news h4{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;
         letter-spacing:.09em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
/* 資料來源語言：兩顆按鈕，看得出目前在哪個模式 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{font:inherit;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;
            color:var(--ink-3);background:#fff;border:none;padding:2px 10px;cursor:pointer;
            line-height:1.6}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink);background:var(--tint)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on:hover{background:var(--ink);color:#fff}
.item{padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.it{display:block;font-size:12.5px;line-height:1.45;color:inherit;text-decoration:none}
.it:hover{color:#0b57d0;text-decoration:underline}
.im{font-size:11px;color:var(--read);margin-top:4px;display:flex;align-items:center;gap:7px}
.orig{font:inherit;font-size:10px;color:var(--ink-3);background:#fff;cursor:pointer;
      border:1px solid var(--line);border-radius:99px;padding:1px 7px;line-height:1.5}
.orig:hover{color:var(--ink);border-color:#d4d9e0}

/* 原文彈出視窗 */
.ovl{position:fixed;inset:0;z-index:60;display:none;padding:20px;
     align-items:center;justify-content:center;background:rgba(14,18,23,.42)}
.ovl.on{display:flex}
.dlg{background:#fff;border-radius:13px;width:100%;max-width:580px;max-height:82vh;
     overflow:auto;padding:20px 22px 18px;box-shadow:0 16px 48px rgba(16,24,40,.24)}
.dlg h5{margin:0 0 14px;font-size:10.5px;font-weight:600;color:var(--ink-3);
        text-transform:uppercase;letter-spacing:.09em;
        display:flex;align-items:center;justify-content:space-between}
.dlg .x{font-size:20px;line-height:1;color:var(--ink-3);background:none;border:none;
        cursor:pointer;padding:0 2px}
.dlg .x:hover{color:var(--ink)}
.dsec{margin-bottom:15px}
.dsec .k{font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px}
.dsec .en{font-size:15px;line-height:1.5;color:var(--ink)}
.dsec .zh{font-size:13.5px;line-height:1.7;color:var(--ink)}
.tload{color:var(--read)}
.tload:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tfail{color:var(--down)}
.dfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
       border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--ink-3)}
.dfoot a{color:#0b57d0;text-decoration:none;font-weight:500}
.dfoot a:hover{text-decoration:underline}
@media(max-width:700px){
  .ovl{padding:0;align-items:flex-end}
  .dlg{max-width:none;border-radius:14px 14px 0 0;max-height:88vh;padding:18px 18px 22px}
}

/* ---------- 手機版的個股面板 ----------
   手機上把詳細資料塞在列表中間，會把下面的股票推到很遠，看完要捲很久才找得回原位。
   改成從底部滑上來的全螢幕面板，關掉就回到原本的位置。 */
.sheet{position:fixed;inset:0;z-index:55;display:none;background:rgba(14,18,23,.4)}
.sheet.on{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;top:34px;background:#fff;
          border-radius:15px 15px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
          box-shadow:0 -6px 30px rgba(16,24,40,.2)}
.sheet-bar{position:sticky;top:0;z-index:2;background:#fff;
           border-bottom:1px solid var(--line);padding:13px 16px 11px;
           display:flex;align-items:flex-start;gap:12px}
.sheet-bar .t{flex:1;min-width:0}
.sheet-bar .star{margin-top:2px}
.sheet-bar .nm{font-size:15px;font-weight:600;line-height:1.3}
.sheet-bar .sy{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.sheet-bar .pr{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.sheet-bar .ch{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sheet-bar .x{font-size:24px;line-height:.8;color:var(--ink-3);background:none;
              border:none;cursor:pointer;padding:2px 0 2px 6px}
.sheet-body{padding:0 16px 40px}
.sheet-body .dbox{padding:14px 0 0}
.none{font-size:12px;color:var(--read);padding:7px 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 18px}
.dgrid .k{font-size:10.5px;color:var(--ink-3)}
.dgrid .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
       color:var(--ink-3);font-size:11px;line-height:1.9}
code{color:var(--ink-2)}
/* meta 欄只給手機用 */
.c-meta{display:none}

/* ---------- 手機版：不捲表格，改成兩行式列表 ----------
   name  ┊ 走勢 ┊ 股價
   P/B·ROE·息 ┊    ┊ 今日%                                        */
@media(max-width:700px){
  .wrap{padding:22px 15px 56px}
  .scroll{overflow:visible}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tr.group{display:block}
  tr.group td{display:block;padding:24px 0 7px;font-size:11px}

  tr.row{
    display:grid;
    grid-template-columns:26px minmax(0,1fr) 54px auto;
    grid-template-areas:"fv nm tr pr" "fv mt tr ch";
    align-items:center;
    column-gap:9px;row-gap:3px;
    padding:14px 0;                      /* 點擊區至少 56px 高，手指按得準 */
    border-bottom:1px solid var(--hair);
    -webkit-tap-highlight-color:rgba(6,112,63,.07);
  }
  tr.row:active td{opacity:.55}
  tr.row td{display:block;border:none;padding:0;background:none !important}
  /* 注意：這些一定要用 tr.row 開頭，否則權重輸給上面的 `tr.row td`，display:none 不會生效 */
  tr.row td.c-fav  {grid-area:fv;align-self:center}
  tr.row td.c-name {grid-area:nm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  tr.row td.c-meta {grid-area:mt;display:block;font-size:11px;color:var(--ink-3);
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.row td.c-trend{grid-area:tr;align-self:center}
  tr.row td.c-trend .spark{width:54px;height:26px}
  /* 手指的點擊區至少 44px 高，視覺上還是那顆小星星 */
  .star{padding:13px 9px 13px 0;margin:-13px -9px -13px 0}
  .star svg{width:17px;height:17px}
  tr.row td.c-price{grid-area:pr;text-align:right;font-size:16px;font-weight:650}
  tr.row td.c-d1   {grid-area:ch;text-align:right;font-size:12.5px;font-weight:600}
  tr.row td.c-m1,
  tr.row td.c-pb,
  tr.row td.c-roe,
  tr.row td.c-yld  {display:none}

  tr.detail{display:block}
  tr.detail td{display:block}
  .dbox{padding:12px 0 18px}
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:13px 15px}
  .bigchart{height:150px}
  .chips{gap:5px}

  /* ---------- 手機字級整體放大 20% ----------
     版面本身用固定 px（表格欄寬要精準），所以不是改根字級，
     而是把手機上看得到的每一處字級各自 x1.2。集中在這裡方便日後再調。 */
  /* 字放大後標題和時間戳擠在同一行會折行，讓時間戳自己佔一行 */
  header{flex-wrap:wrap;padding-bottom:13px}
  h1{font-size:28px;white-space:nowrap}
  .stamp{font-size:13px;order:3;flex-basis:100%;margin-left:0;text-align:left;margin-top:9px}
  /* 手機上這顆要夠大才按得準，也才不會跟旁邊的字級不協調 */
  .reload{order:2;margin-left:auto;font-size:19px;padding:14px 22px;gap:10px;border-radius:5px}
  .reload svg{width:27px;height:27px}
  tr.group td{font-size:13px}
  tr.row td.c-name{font-size:17.5px}
  /* 字變大後名稱會提早截斷，把股票代碼藏起來換回寬度——展開面板裡還是看得到 */
  tr.row td.c-name .sym{display:none}
  tr.row td.c-name .dot{margin-left:5px}
  tr.row td.c-meta{font-size:13px}
  tr.row td.c-price{font-size:19px}
  tr.row td.c-d1{font-size:15px}
  .sym{font-size:12.5px}

  .sheet-bar .nm{font-size:18px}
  .sheet-bar .sy{font-size:12.5px}
  .sheet-bar .pr{font-size:23px}
  .sheet-bar .ch{font-size:14.5px}

  .dnote{font-size:14px}
  .chip{font-size:12.5px;padding:3px 9px}
  .rng{font-size:13px;padding:4px 13px}
  .rmeta{font-size:13px}
  .dgrid .k{font-size:12.5px}
  .dgrid .v{font-size:16px}
  .chart .axis{font-size:12px}
  .chart .last{font-size:12.5px}
  .tip{font-size:13px}

  .brief-h b{font-size:17.5px}
  .brief-h span,.brief-h .tog{font-size:13px}
  .bi .bw{font-size:16px;line-height:1.5}
  .bi .by{font-size:14.5px;line-height:1.65}
  .bi .bn{font-size:13px}
  .dg-h{font-size:13px}

  .calc h4{font-size:14.5px}
  .calc .cnote{font-size:13px}

  .ci{font-size:16px;width:112px}
  .ci-s{width:78px}
  .clab{font-size:12.5px}
  .clab span{width:112px}
  .clab span.w-s{width:78px}

<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon.svg" alt="" width="26" height="26">
    <h1 id="title">馬股每日追蹤</h1>
    <span class="stamp" id="updated"></span>
    <button class="reload" type="button" id="reload" title="重新載入最新資料">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/>
      </svg><span>更新</span></button>
  </header>

  <div class="pulse" id="pulse"></div>
  <div class="tabs" id="tabs"></div>
  <div id="brief"></div>

  <div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>

  <footer>
    每天更新 <code>python3 fetch.py</code> · 自動化 <code>./install_daily.sh</code> · 改追蹤清單 <code>watchlist.json</code><br>
    收盤價，非即時報價。僅為資訊整理，不構成投資建議。
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sheet-bar">
      <button class="star" type="button" id="sh-star" aria-label="加入最愛"></button>
      <div class="t"><div class="nm" id="sh-name"></div><div class="sy" id="sh-sym"></div></div>
      <div><div class="pr" id="sh-price"></div><div class="ch" id="sh-chg"></div></div>
      <button class="x" type="button" id="sh-x" aria-label="關閉">&times;</button>
    </div>
    <div class="sheet-body" id="sh-body"></div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="dlg" role="dialog" aria-modal="true" aria-label="原文">
    <h5>原文 <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">${failed ? 'ENGLISH（這則翻譯失敗，下次更新會再試）' : 'ENGLISH 原文'}</div><div class="en" id="ovl-en"></div></div>
    <div class="dsec"><div class="k">中譯（機器翻譯）</div><div class="zh" id="ovl-zh"></div></div>
    <div class="dfoot"><span id="ovl-src"></span>
      <a id="ovl-url" href="#" target="_blank" rel="noopener">開啟原文網頁 →</a></div>
  </div>
</div>

<script>
let D = window.STOCK_DATA || null;   // snapshot.html 會把資料直接內嵌，那就不用再抓
const $ = s => document.querySelector(s);

const num = v => { if(v==null) return null;
  const n = parseFloat(String(v).replace(/[%,]/g,'')); return isNaN(n)?null:n; };
const cls = v => v==null ? 'flat' : v>0 ? 'up' : v<0 ? 'down' : 'flat';
const pc  = v => v==null ? '—' : (v>0?'+':'') + v.toFixed(2) + '%';
const px  = (v,i) => v==null ? '—'
  : Math.abs(v) >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:0})
  : i ? v.toLocaleString(undefined,{maximumFractionDigits:2})
  : v.toFixed(Math.abs(v) < 1 ? 3 : 2);

function spark(series, w, h, big){
  const p = series.map(x=>x.close);
  if(p.length<2) return '';
  const lo=Math.min(...p), hi=Math.max(...p), span=(hi-lo)||1;
  const d = p.map((v,i)=>`${i?'L':'M'}${(i/(p.length-1)*w).toFixed(1)} ${(h-(v-lo)/span*(h-3)-1.5).toFixed(1)}`).join(' ');
  const col = p[p.length-1] >= p[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="${big?'bigchart':'spark'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="${big?1.6:1.3}"
          stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}



/* ---------- 鮮果串（FFB / TBS）收購價試算 ----------
   小園主拿到的鮮果串價 = 毛棕櫚油（CPO）價 x 收購商給的出油率（OER）。
   CPO 價用 MPOB 官方牌價，出油率由使用者自己填（收購商會給）。 */
const OER_KEY = 'palm_oer';

function calculator(s){
  const saved = (() => { try { return localStorage.getItem(OER_KEY); } catch(e) { return null; } })();
  return `<div class="calc" data-calc data-avg="${s.avg30}" data-today="${s.price}">
    <h4>鮮果串（FFB）收購價試算</h4>
    <p class="cnote">鮮果串價 = 毛棕櫚油價 × 出油率。CPO 價預設帶入
       <b>${s.avg30_days} 日均價 RM ${Number(s.avg30).toLocaleString()}</b>
       （MPOB 官方牌價每日加總 ÷ ${s.avg30_days}）。</p>
    <div class="crow">
      <input class="ci" data-k="cpo" value="${s.avg30}" inputmode="decimal">
      <span class="op">×</span>
      <input class="ci ci-s" data-k="oer" value="${saved || '18.75'}" inputmode="decimal">
      <span class="op">%</span>
      <span class="op">=</span>
      <span class="cout"></span>
    </div>
    <div class="clab"><span>CPO 價 RM/噸</span><span></span><span class="w-s">出油率</span></div>
    <div class="cbtns">
      <button class="cb" type="button" data-use="avg">用 ${s.avg30_days} 日均價</button>
      <button class="cb" type="button" data-use="today">用當日價 ${Number(s.price).toLocaleString()}</button>
    </div>
  </div>`;
}

function wireCalculator(root){
  const box = root.querySelector('[data-calc]');
  if(!box) return;
  const cpo = box.querySelector('[data-k="cpo"]');
  const oer = box.querySelector('[data-k="oer"]');
  const out = box.querySelector('.cout');

  const run = () => {
    const a = parseFloat(cpo.value), b = parseFloat(oer.value);
    if(!isFinite(a) || !isFinite(b)){ out.textContent = '—'; return; }
    out.innerHTML = 'RM ' + (a * b / 100).toLocaleString(undefined,
      {minimumFractionDigits: 2, maximumFractionDigits: 2}) +
      ' <span class="cunit">/噸</span>';
  };

  [cpo, oer].forEach(el => {
    el.addEventListener('input', () => {
      if(el === oer){ try { localStorage.setItem(OER_KEY, el.value); } catch(e) {} }
      run();
    });
    el.addEventListener('click', e => e.stopPropagation());
  });
  box.querySelectorAll('.cb').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    cpo.value = b.dataset.use === 'avg' ? box.dataset.avg : box.dataset.today;
    run();
  });
  box.addEventListener('click', e => e.stopPropagation());
  run();
}

/* ---------- 有刻度的價格圖 ----------
   小縮圖不需要刻度，但展開後的圖要能回答「多少錢、在什麼價位」，
   所以這裡畫格線 + 右側價格刻度 + 最新價標記，滑過去還能看單日價格。 */
function priceChart(host, series, isIdx){
  const W = Math.max(280, host.clientWidth || 640), H = 168;
  const P = {t:10, r:54, b:18, l:2};
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const pts = series.map(d=>d.close);
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if(hi === lo){ hi += hi*0.01 || 1; lo -= lo*0.01 || 1; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;

  const X = i => P.l + (series.length<2 ? pw/2 : i/(series.length-1)*pw);
  const Y = v => P.t + ph - (v-lo)/(hi-lo)*ph;

  // 找好看的刻度間距（1 / 2 / 2.5 / 5 的倍數）
  const rough = (hi-lo)/4, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1,2,2.5,5,10].find(m => m*mag >= rough) * mag;
  const ticks = [];
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step) ticks.push(v);

  const last = series[series.length-1];
  const rising = pts[pts.length-1] >= pts[0];
  const col = rising ? 'var(--up)' : 'var(--down)';
  const line = series.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d.close).toFixed(1)}`).join(' ');
  const gid = 'pg'+Math.random().toString(36).slice(2,7);

  // x 軸日期：頭、尾、加中間兩點
  const xi = [0, Math.round((series.length-1)/3), Math.round((series.length-1)*2/3), series.length-1];
  const xlab = [...new Set(xi)].map(i=>{
    const [y,m,d] = series[i].date.split('-');
    const anchor = i===0 ? 'start' : i===series.length-1 ? 'end' : 'middle';
    return `<text class="axis" x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${anchor}">${m}/${d}</text>`;
  }).join('');

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".16"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>{
      // 格線照畫，但刻度數字若跟「最新價」標籤太近就省略，免得疊在一起
      const near = Math.abs(Y(v) - Y(last.close)) < 11;
      return `<line class="gl" x1="${P.l}" x2="${P.l+pw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>` +
        (near ? '' : `<text class="axis" x="${P.l+pw+7}" y="${(Y(v)+3.5).toFixed(1)}">${px(v,isIdx)}</text>`);
    }).join('')}
    <path d="${line} L${X(series.length-1).toFixed(1)} ${P.t+ph} L${P.l} ${P.t+ph} Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${P.t+ph}" style="display:none"/>
    <circle class="hov" r="3.5" fill="${col}" style="display:none"/>
    <circle cx="${X(series.length-1).toFixed(1)}" cy="${Y(last.close).toFixed(1)}" r="3" fill="${col}"/>
    <text class="last" x="${P.l+pw+7}" y="${(Y(last.close)+3.5).toFixed(1)}" fill="${col}">${px(last.close,isIdx)}</text>
    ${xlab}
  </svg>`;

  return {X, Y, P, pw, svg: host.querySelector('svg')};
}

/* 欄位：只留真正每天會看的 */
const STAR = on => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}"
  stroke="currentColor" stroke-width="${on ? 0 : 1.7}" stroke-linejoin="round">
  <path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.45 6.19 20.5 7.3 14.03 2.6 9.45l6.5-.95z"/></svg>`;

const COLS = [
  {k:'fav', t:'', nosort:true,
   cell:s=>`<button class="star ${isFav(s.symbol)?'on':''}" type="button"
     aria-label="加入最愛" data-fav="${s.symbol}">${STAR(isFav(s.symbol))}</button>`},
  {k:'name', t:'',  cell:s=>{
      const bad = (s.flags||[]).find(f=>f.level==='bad');
      const warn = (s.flags||[]).find(f=>f.level==='warn');
      const dot = bad ? '<span class="dot bad"></span>' : warn ? '<span class="dot warn"></span>' : '';
      return `<span class="name">${s.name}</span><span class="sym">${s.symbol}</span>${dot}`; },
     sort:s=>s.name, dir:1},
  {k:'trend',t:'走勢·半年', cell:s=>spark(s.series.slice(-126),74,22,false), sort:s=>s.change_pct_1m},
  {k:'price',t:'股價',   cell:s=>px(s.price,s.is_index), sort:s=>s.price},
  {k:'d1',   t:'今日',   cell:s=>`<span class="${cls(s.change_pct_1d)}">${pc(s.change_pct_1d)}</span>`, sort:s=>s.change_pct_1d},
  {k:'m1',   t:'1個月',  cell:s=>`<span class="${cls(s.change_pct_1m)}">${pc(s.change_pct_1m)}</span>`, sort:s=>s.change_pct_1m},
  {k:'pb',   t:'P/B',    cell:s=>s.fundamentals.pb_ratio || '—',  sort:s=>num(s.fundamentals.pb_ratio), dir:1},
  {k:'roe',  t:'ROE',    cell:s=>s.fundamentals.roe || '—',       sort:s=>num(s.fundamentals.roe)},
  {k:'yld',  t:'殖利率', cell:s=>s.fundamentals.div_yield || '—', sort:s=>num(s.fundamentals.div_yield)},
  // 只在手機版顯示：把 P/B、ROE、殖利率併成一行，省掉橫向捲動
  {k:'meta', t:'', nosort:true, cell:s=>{
      const f = s.fundamentals || {};
      const bits = [];
      if(f.pb_ratio)  bits.push('P/B ' + f.pb_ratio);
      if(f.roe)       bits.push('ROE ' + f.roe);
      if(f.div_yield) bits.push('息 ' + f.div_yield);
      if(!bits.length) bits.push('1個月 ' + pc(s.change_pct_1m));
      return bits.join(' · '); }},
];

/* ---------- 最愛 ----------
   存在瀏覽器裡（每台裝置各自一份），加了會釘在最上面，
   同時從原本的分類移除，避免同一檔出現兩次。 */
const FAV_KEY = 'favs';
let favs = (() => {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch(e) { return []; }
})();
const isFav = sym => favs.includes(sym);
function toggleFav(sym){
  favs = isFav(sym) ? favs.filter(x => x !== sym) : favs.concat(sym);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {}
}

const ORDER = ['大盤','銀行','REIT','油棕','AI 馬股','AI 美股','國際','其他'];

/* 分頁：把相關的分類併在一起，一次只看一組 */
const TABS = [
  {t:'最愛', secs:null},                      // 特例：看的是最愛清單不是分類
  {t:'指數', secs:['大盤','國際']},
  {t:'銀行', secs:['銀行']},
  {t:'REIT', secs:['REIT']},
  {t:'AI',   secs:['AI 馬股','AI 美股']},
  {t:'油棕', secs:['油棕','其他']},
  {t:'全部', secs:ORDER},
];
const TAB_KEY = 'tab';
let activeTab = (() => {
  try { return localStorage.getItem(TAB_KEY) || ''; } catch(e) { return ''; }
})();
// 短區間用日線（一個月約 21 個交易日），長區間切到週線——
// 五年的日線資料量太大，週線 260 點看趨勢也夠。
const RANGES = [
  {t:'1個月', d:21,  w:false},
  {t:'3個月', d:63,  w:false},
  {t:'半年',  d:126, w:false},
  {t:'1年',   d:0,   w:false},
  {t:'3年',   d:156, w:true},
  {t:'5年',   d:0,   w:true},
];
let sortKey = null, sortDir = 1, openSym = null, chartRange = '半年';

function detailRow(s){
  const f = s.fundamentals || {};
  const cells = [
    ['前收', px(s.prev_close,s.is_index)], ['當日高', px(s.day_high,s.is_index)], ['當日低', px(s.day_low,s.is_index)],
    ['5 日', pc(s.change_pct_5d)], ['3 個月', pc(s.change_pct_3m)], ['1 年', pc(s.change_pct_1y)],
    ['3 年', pc(s.change_pct_3y)], ['5 年', pc(s.change_pct_5y)],
    ['52週高', px(s.high_52w,s.is_index)], ['52週低', px(s.low_52w,s.is_index)], ['距高點', pc(s.off_52w_high)],
    ['成交量', s.volume ? s.volume.toLocaleString() : '—'],
    ['量能倍數', s.volume_ratio ? s.volume_ratio+'x' : '—'],
    ['市值', f.market_cap], ['P/E', f.pe_ratio], ['每股淨值', f.bvps], ['EPS', f.eps], ['ROA', f.roa],
    ['每股派息', f.dps], ['派息率', f.payout_ratio], ['除息日', f.ex_div_date],
    ['下次財報', f.earnings_date], ['分析師', f.analyst_rating_zh || f.analyst_rating], ['目標價', f.analyst_target],
  ].filter(([,v]) => v!=null && v!=='' && v!=='—');
  const COLORED = ['5 日','3 個月','1 年','距高點'];

  const esc = t => (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const feed = (list, empty) => list && list.length
    ? list.map(n => {
        const zh = n.title_zh || n.title, en = n.title || '';
        const translated = zh !== en;
        const hasBody = !!(n.body_zh || n.body);
        return `<div class="item"
             data-zh="${esc(zh)}" data-en="${esc(en)}"
             data-src="${esc([n.source_zh || n.source, n.when].filter(Boolean).join(' · '))}"
             data-url="${esc(n.source_url || n.url)}"
             data-body-en="${esc(n.body || '')}"
             data-body-zh="${esc(n.body_zh || '')}">
          <a class="it" href="${esc(n.url)}" target="_blank" rel="noopener">${zh}</a>
          <div class="im">${[n.source_zh || n.source, n.when].filter(Boolean).join(' · ')}
            ${(translated || hasBody) ? `<button class="orig" type="button">${hasBody ? '讀全文' : '原文'}</button>` : ''}</div>
        </div>`;
      }).join('')
    : `<div class="none">${empty}</div>`;

  const tr = document.createElement('tr');
  tr.className = 'detail';
  tr.innerHTML = `<td colspan="${COLS.length}"><div class="dbox">
    <div class="dnote">${s.note||''}${s.market_time?' · 最後成交 '+s.market_time:''}</div>
    <div class="chips">${(s.flags||[]).map(f=>`<span class="chip ${f.level}">${f.text}</span>`).join('')}</div>
    ${(s.digest && s.digest.length) ? `<div class="dg">
      <div class="dg-h">重點報導</div>
      ${s.digest.map(([k, v]) => `<div class="dg-r"><div class="dg-k">${k}</div>
        <div class="dg-v">${v}</div></div>`).join('')}
    </div>` : ''}
    <div class="ranges">${RANGES.filter(r => !r.w || (s.series_w || []).length > 30)
      .map(r => `<span class="rng ${r.t===chartRange?'on':''}" data-d="${r.t}">${r.t}</span>`).join('')}</div>
    <div class="chartslot"></div>
    <div class="dgrid">${cells.map(([k,v])=>
      `<div><div class="k">${k}</div><div class="v ${COLORED.includes(k)?cls(num(v)):''}">${v}</div></div>`
    ).join('')}</div>
    ${s.calculator ? calculator(s) : ''}
    <div class="news">
      <div><h4>媒體報導 <span class="seg">
        <button type="button" class="on" data-l="zh">中文</button>
        <button type="button" data-l="en">原文</button></span></h4>
${feed(s.articles, '近三個月沒有相關報導')}</div>
      <div><h4>Bursa 公告 <span class="seg">
        <button type="button" class="on" data-l="zh">中文</button>
        <button type="button" data-l="en">原文</button></span></h4>
${feed(s.filings, '沒有抓到公告')}</div>
    </div>
  </div></td>`;

  const slot = tr.querySelector('.chartslot');
  const draw = () => {
    let r = RANGES.find(x => x.t === chartRange);
    if(!r || (r.w && (s.series_w || []).length <= 30)) r = RANGES[2];   // 沒週線就退回半年
    const src = r.w ? s.series_w : s.series;
    const seg = r.d ? src.slice(-r.d) : src;
    const chg = (seg[seg.length-1].close / seg[0].close - 1) * 100;

    slot.innerHTML = `<div class="chart"></div>
      <div class="readout">
        <span class="pt"></span>
        <span class="rg">區間 ${seg[0].date} → ${seg[seg.length-1].date} ·
          ${seg.length} ${r.w ? '週' : '個交易日'} ·
          <span class="${cls(chg)}">${pc(chg)}</span>${r.w ? '（週線）' : ''}</span>
      </div>`;

    const host = slot.querySelector('.chart');
    const {X, Y, P, pw, svg} = priceChart(host, seg, s.is_index);
    const tip = document.createElement('div');
    tip.className = 'tip';
    host.appendChild(tip);
    const out   = slot.querySelector('.readout .pt');
    const cross = svg.querySelector('.cross');
    const hov   = svg.querySelector('.hov');

    // 沒有指到任何一天時，顯示最新收盤
    const base = () => {
      const d = seg[seg.length - 1];
      out.innerHTML = `最新 ${d.date} · <b>${px(d.close, s.is_index)}</b>`;
      cross.style.display = 'none';
      hov.style.display = 'none';
      tip.classList.remove('on');
    };
    base();

    // 滑鼠移過去 / 手指滑過去，顯示那一天的日期與價格
    const track = clientX => {
      const r = svg.getBoundingClientRect();
      const vx = (clientX - r.left) / r.width * svg.viewBox.baseVal.width;
      const i = Math.max(0, Math.min(seg.length - 1,
                Math.round((vx - P.l) / pw * (seg.length - 1))));
      const d = seg[i];
      const vs = (d.close / seg[0].close - 1) * 100;
      out.innerHTML = `${d.date} · <b>${px(d.close, s.is_index)}</b>
        <span class="${cls(vs)}">${pc(vs)}</span>`;
      const cx = X(i);
      cross.setAttribute('x1', cx);
      cross.setAttribute('x2', cx);
      cross.style.display = '';
      hov.setAttribute('cx', cx);
      hov.setAttribute('cy', Y(d.close));
      hov.style.display = '';

      // 標籤跟著游標，貼在資料點正上方；靠近邊緣時往內收，不要被切掉
      tip.innerHTML = `<b>${px(d.close, s.is_index)}</b>${s.unit ? ' ' + s.unit : ''}<br>${d.date}`;
      tip.classList.add('on');
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.max(half + 2, Math.min(host.clientWidth - half - 2, cx)) + 'px';
      tip.style.top  = Y(d.close) + 'px';
    };

    svg.addEventListener('pointermove',  e => { e.stopPropagation(); track(e.clientX); });
    svg.addEventListener('pointerleave', base);
    svg.addEventListener('touchmove',    e => track(e.touches[0].clientX), {passive: true});
    svg.addEventListener('touchend',     base);
    svg.addEventListener('click',        e => e.stopPropagation());
  };

  // 「中文 / 原文」兩顆按鈕：機器翻譯遇到金融術語會有偏差，要能一眼看出目前在哪個模式
  tr.querySelectorAll('.seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => btn.onclick = ev => {
      ev.stopPropagation();
      const en = btn.dataset.l === 'en';
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      seg.closest('div').querySelectorAll('.item').forEach(it => {
        const v = en ? it.dataset.en : it.dataset.zh;
        if(v) it.querySelector('.it').textContent = v;
      });
    });
  });

  tr._redraw = draw;                         // 由 render() 在插進 DOM 後呼叫（那時才量得到寬度）
  wireCalculator(tr);
  tr.querySelectorAll('.rng').forEach(b => b.onclick = ev => {
    ev.stopPropagation();                    // 別讓點擊冒泡去收合這一列
    chartRange = b.dataset.d;
    // 用按鈕自己的父層來切換高亮，不能用 tr——手機版會把 .dbox 搬進面板，
    // 搬走之後 tr.querySelectorAll('.rng') 會是空的，高亮就不會跟著動
    b.parentNode.querySelectorAll('.rng').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  return tr;
}

const BRIEF_KEY = 'brief_collapsed';

/* ---------- 今日重點 ----------
   每次更新後由 analyze.py 用規則挑出來的，不是全部列出來。
   點一下跳到那一檔。 */
function renderBrief(){
  const host = $('#brief');
  const hl = D.highlights || [];
  if(!hl.length){ host.innerHTML = ''; return; }

  let collapsed = false;
  try { collapsed = localStorage.getItem(BRIEF_KEY) === '1'; } catch(e) {}

  host.innerHTML = `<div class="brief">
    <div class="brief-h"><b>今日重點</b><span>${hl.length} 條</span>
      <button class="tog" type="button">${collapsed ? '展開' : '收起'}</button></div>
    <div class="brief-list" ${collapsed ? 'hidden' : ''}>${hl.map(h => `
      <div class="bi ${h.level}" data-go="${h.symbol}">
        <div class="bar"></div>
        <div class="bt">
          <div class="bw"><b>${h.name}</b> ${h.what}</div>
          ${h.why ? `<div class="by">${h.why}</div>` : ''}
        </div>
        <div class="bn">${h.sector}</div>
      </div>`).join('')}</div></div>`;

  host.querySelector('.tog').onclick = () => {
    const list = host.querySelector('.brief-list');
    const now = !list.hidden;
    list.hidden = now;
    host.querySelector('.tog').textContent = now ? '展開' : '收起';
    try { localStorage.setItem(BRIEF_KEY, now ? '1' : '0'); } catch(e) {}
  };
  host.querySelectorAll('.bi').forEach(el => el.onclick = () => {
    const s = D.stocks.find(x => x.symbol === el.dataset.go);
    if(!s) return;
    if(isMobile()){ openSheet(s); return; }
    openSym = s.symbol; render();
    const row = [...document.querySelectorAll('tr.row')]
      .find(r => r.textContent.includes(s.symbol));
    if(row) row.scrollIntoView({block:'center', behavior:'smooth'});
  });
}

/* ---------- 市場脈搏 ----------
   挑四個最能代表「今天外面發生什麼事」的數字：
   馬股大盤、棕櫚油（收入來源）、兩個匯率。點一下直接開那一檔。 */
const PULSE = ['^KLSE', 'MPOB-CPO', 'MYR=X', 'SGDMYR=X'];

function renderPulse(){
  const host = $('#pulse');
  const items = PULSE.map(sym => D.stocks.find(s => s.symbol === sym)).filter(Boolean);
  if(!items.length){ host.innerHTML = ''; return; }

  host.innerHTML = items.map(s => `<div class="pu" data-go="${s.symbol}">
      <div class="k">${s.name}</div>
      <div class="v">${px(s.price, s.is_index)}</div>
      <div class="c ${cls(s.change_pct_1d)}">${pc(s.change_pct_1d)}</div>
    </div>`).join('');

  host.querySelectorAll('.pu').forEach(el => el.onclick = () => {
    const s = D.stocks.find(x => x.symbol === el.dataset.go);
    if(!s) return;
    if(isMobile()){ openSheet(s); return; }
    activeTab = '全部'; openSym = s.symbol; render();
  });
}

function render(){
  renderPulse();
  renderBrief();
  $('#title').textContent = D.title;
  $('#updated').textContent = D.updated_at;

  $('#head').innerHTML = '<tr>' + COLS.map(c =>
    `<th data-k="${c.k}" class="c-${c.k}">${c.t}<span class="a">${
      sortKey===c.k ? (sortDir>0?'▲':'▼') : (c.t?'⇅':'')}</span></th>`).join('') + '</tr>';
  $('#head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = COLS.find(x=>x.k===th.dataset.k);
    if(c.nosort) return;
    if(sortKey===c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.dir || -1; }
    render();
  });

  const body = $('#body'); body.innerHTML = '';

  const pinned = favs.map(sym => D.stocks.find(s => s.symbol === sym)).filter(Boolean);

  // 分頁列：沒有最愛就不顯示那一頁
  const tabs = TABS.filter(t => t.t !== '最愛' || pinned.length);
  if(!tabs.some(t => t.t === activeTab)) activeTab = pinned.length ? '最愛' : '銀行';
  const countOf = t => t.secs === null ? pinned.length
                     : D.stocks.filter(s => t.secs.includes(s.sector)).length;
  $('#tabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.t===activeTab?'on':''}" type="button" data-t="${t.t}">${t.t}<span class="n">${countOf(t)}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    activeTab = b.dataset.t;
    try { localStorage.setItem(TAB_KEY, activeTab); } catch(e) {}
    openSym = null;
    render();
    scrollTo({top: 0, behavior: 'smooth'});
  });

  const tab = tabs.find(t => t.t === activeTab);
  const groups = [];
  if(tab.secs === null){
    groups.push(['最愛', pinned]);
  } else if(activeTab === '全部'){
    // 只有「全部」需要把最愛釘到最上面；其他分頁本來就已經聚焦了
    if(pinned.length) groups.push(['最愛', pinned]);
    ORDER.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec && !isFav(s.symbol));
      if(list.length) groups.push([sec, list]);
    });
  } else {
    tab.secs.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec);
      if(list.length) groups.push([sec, list]);
    });
  }

  groups.forEach(([sec, group]) => {
    let list = group;

    if(sortKey && sec !== '最愛'){
      const g = COLS.find(c=>c.k===sortKey).sort;
      list = [...list].sort((a,b)=>{
        const av=g(a), bv=g(b);
        if(av==null) return 1; if(bv==null) return -1;
        return typeof av === 'string' ? sortDir*av.localeCompare(bv,'zh-Hant') : sortDir*(av-bv);
      });
    }

    const gr = document.createElement('tr');
    gr.className = 'group';
    gr.innerHTML = `<td colspan="${COLS.length}">${sec}</td>`;
    body.appendChild(gr);

    list.forEach(s => {
      const tr = document.createElement('tr');
      tr.className = 'row' + (openSym===s.symbol ? ' on' : '');
      tr.innerHTML = COLS.map(c=>`<td class="c-${c.k}">${c.cell(s)}</td>`).join('');
      tr.onclick = ev => {
        const star = ev.target.closest('.star');
        if(star){                              // 點星星只切換最愛，不展開
          ev.stopPropagation();
          toggleFav(star.dataset.fav);
          render();
          return;
        }
        if(isMobile()){ openSheet(s); return; }
        openSym = openSym === s.symbol ? null : s.symbol;
        render();
      };
      body.appendChild(tr);
      if(openSym === s.symbol && !isMobile()){
        const d = detailRow(s);
        body.appendChild(d);
        d._redraw();                         // 插入後才畫圖，這樣量得到實際寬度
      }
    });
  });
}

/* ---------- 點開才翻的內文翻譯 ----------
   批次在伺服器翻不可行：免費 API 在上百篇的量級會直接限流
   （實測 106 篇只成功 16 篇）。改成使用者點開哪篇才翻哪篇，
   用他自己的瀏覽器去打 API，翻完存在本機，再開就是即時的。 */

// 這些翻了會出錯，先換成佔位符保護（Bursa Malaysia 曾被翻成「馬來西亞交易所」）
const KEEP = ['Sentral REIT','IGB REIT','Pavilion REIT','Axis REIT','KLCCP',
  'Bursa Malaysia','Bank Negara','FBM KLCI','Maybank','CIMB','Public Bank',
  'Hong Leong','RHB','AmBank','AMMB','Alliance Bank','Bank Islam','Affin',
  'MBSB','MRCB','YTL','Gamuda','Sunway','Zetrix','Inari','ViTrox','Frontken',
  'TIME dotCom','Mah Sing','NVIDIA','Broadcom','Palantir','Nasdaq',
  'OPR','DPU','NPI','EPS','ROE','NIM','EPF','KWAP','REIT','REITs','GDP','RM'];

const TR_KEY = 'tr_cache';
function trCache(){
  try { return JSON.parse(localStorage.getItem(TR_KEY)) || {}; } catch(e) { return {}; }
}
function trSave(c){
  try {
    const keys = Object.keys(c);
    if(keys.length > 120) keys.slice(0, keys.length - 120).forEach(k => delete c[k]);
    localStorage.setItem(TR_KEY, JSON.stringify(c));
  } catch(e) {}
}
const trKey = t => t.length + '|' + t.slice(0, 60) + '|' + t.slice(-30);

function chunk(text, size = 450){
  const out = [];
  let buf = '';
  for(const sen of text.split(/(?<=[.!?])\s+/)){
    if(buf.length + sen.length > size && buf){ out.push(buf.trim()); buf = ''; }
    buf += sen + ' ';
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

async function gtranslate(part){
  const marks = [];
  let held = part;
  for(const term of [...KEEP].sort((a, b) => b.length - a.length)){
    const re = new RegExp('\\b' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if(!re.test(held)) continue;
    const tok = 'ZZ' + marks.length + 'ZZ';
    held = held.replace(re, tok);
    marks.push(term);
  }
  const url = 'https://translate.googleapis.com/translate_a/single' +
              '?client=gtx&sl=en&tl=zh-TW&dt=t&q=' + encodeURIComponent(held);
  const res = await fetch(url);
  if(!res.ok) throw new Error('翻譯服務回應 ' + res.status);
  const data = await res.json();
  let zh = (data[0] || []).map(x => x[0]).filter(Boolean).join('');
  // 佔位符必須原封不動回來，否則寧可放棄這一段
  if(!marks.every((_, i) => zh.includes('ZZ' + i + 'ZZ'))) throw new Error('專有名詞還原失敗');
  marks.forEach((term, i) => { zh = zh.split('ZZ' + i + 'ZZ').join(term); });
  return zh.replace(/([，。、；：！？（）])\s+/g, '$1').trim();
}

async function translateBody(text){
  const cache = trCache(), key = trKey(text);
  if(cache[key]) return cache[key];
  const parts = chunk(text);
  const out = [];
  for(const p of parts) out.push(await gtranslate(p));
  const zh = out.join('');
  cache[key] = zh;
  trSave(cache);
  return zh;
}

/* ---------- 原文彈出視窗 ----------
   機器翻譯遇到金融術語一定會有偏差，要能隨時叫出原文對照。
   用彈窗而不是 title 提示，因為手機沒有 hover。 */
const isMobile = () => matchMedia('(max-width:700px)').matches;

/* ---------- 手機的個股面板 ---------- */
const sheet = document.getElementById('sheet');

function openSheet(s){
  const star = document.getElementById('sh-star');
  const paint = () => {
    star.innerHTML = STAR(isFav(s.symbol));
    star.classList.toggle('on', isFav(s.symbol));
  };
  paint();
  star.onclick = ev => {
    ev.stopPropagation();
    toggleFav(s.symbol);
    paint();
    render();                                  // 底下的列表同步更新
  };

  document.getElementById('sh-name').textContent = s.name;
  document.getElementById('sh-sym').textContent  = s.symbol + (s.unit ? ' · ' + s.unit : '');
  document.getElementById('sh-price').textContent = px(s.price, s.is_index);
  const chg = document.getElementById('sh-chg');
  chg.textContent = pc(s.change_pct_1d);
  chg.className = 'ch ' + cls(s.change_pct_1d);

  const host = document.getElementById('sh-body');
  host.innerHTML = '';
  const row = detailRow(s);                    // 沿用同一份內容，不另外維護一套
  host.appendChild(row.querySelector('.dbox'));
  sheet.classList.add('on');
  document.body.style.overflow = 'hidden';
  row._redraw();
  wireCalculator(host);
}

function closeSheet(){
  sheet.classList.remove('on');
  document.body.style.overflow = '';
}
document.getElementById('sh-x').onclick = closeSheet;
sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });

const ovl = document.getElementById('ovl');

function showOriginal(item){
  const d = item.dataset;
  const dlg = ovl.querySelector('.dlg');
  const bodyEn = d.bodyEn || '';
  let bodyZh = d.bodyZh || '';
  if(bodyZh && bodyEn && bodyZh === bodyEn) bodyZh = '';   // 伺服器沒翻成功

  const needs = !bodyZh && bodyEn;                          // 要在瀏覽器現翻
  dlg.innerHTML = `
    <h5>${bodyEn || bodyZh ? '全文' : '原文對照'}
      <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">標題</div>
      <div class="zh" style="font-weight:600">${esc(d.zh)}</div></div>
    ${(bodyZh || needs) ? `<div class="dsec"><div class="k">內文（機器翻譯）</div>
      <div class="zh" id="ovl-body">${bodyZh ? esc(bodyZh).replace(/\n/g, '<br>')
        : '<span class="tload">翻譯中⋯</span>'}</div></div>` : ''}
    <div class="dsec"><div class="k">ENGLISH</div>
      <div class="en" style="font-size:13px">${esc(d.en)}</div>
      ${bodyEn ? `<div class="en" style="font-size:12.5px;color:var(--read);margin-top:7px">
        ${esc(bodyEn).replace(/\n/g, '<br>')}</div>` : ''}</div>
    <div class="dfoot"><span>${esc(d.src || '')}</span>
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">開啟來源網頁 →</a>` : ''}</div>`;
  ovl.classList.add('on');

  if(needs){
    const slot = dlg.querySelector('#ovl-body');
    translateBody(bodyEn)
      .then(zh => { slot.innerHTML = esc(zh).replace(/\n/g, '<br>'); })
      .catch(e => {
        slot.innerHTML = '<span class="tfail">翻譯失敗（' + esc(e.message) +
          '）。下方有英文原文。</span>';
      });
  }
}

function esc(t){
  return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const closeOverlay = () => ovl.classList.remove('on');

ovl.addEventListener('click', e => { if(e.target === ovl || e.target.classList.contains('x')) closeOverlay(); });
addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(ovl.classList.contains('on')) closeOverlay();   // 先關上層的原文彈窗
  else closeSheet();
});

// 事件委派：新聞是動態產生的，綁在 document 上就不用每次重綁
document.addEventListener('click', e => {
  const btn = e.target.closest('.orig');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  showOriginal(btn.closest('.item'));
});

/* 主畫面 App 沒有網址列，沒辦法下拉強制重載，所以自己提供一顆。
   帶上時間戳繞過快取——不然按了也是拿到同一份舊資料。 */
document.getElementById('reload').onclick = ev => {
  ev.currentTarget.classList.add('busy');    // 重載有延遲，先轉起來讓人知道按到了
  try { sessionStorage.setItem('reload_from', (D && D.updated_at) || ''); } catch(e) {}
  const u = new URL(location.href);
  u.searchParams.set('t', Date.now());
  location.replace(u.toString());
};

/* ---------- 載入資料 ----------
   用 fetch 而不是 <script src>：固定網址的 script 會被瀏覽器快取住，
   而且一旦快取條目建立，之後就算伺服器改送 no-store 它也不會回頭問，
   於是出現「資料明明更新了、畫面卻是舊的」。fetch 可以明確指定不用快取。 */
async function loadData(){
  const res = await fetch('data/data.js?t=' + Date.now(), {cache: 'no-store'});
  const txt = await res.text();
  return JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf(';')));
}

async function boot(){
  if(!D){
    try {
      D = await loadData();
    } catch (e) {
      document.getElementById('brief').innerHTML =
        '<div class="brief"><div class="bi bad"><div class="bar"></div>' +
        '<div class="bt"><div class="bw">資料載入失敗</div>' +
        '<div class="by">' + e + '</div></div></div></div>';
      return;
    }
  }
  render();

  // 重載回來後才報告結果——沒有新資料就照實說，不要假裝更新了
  let prev = null;
  try {
    prev = sessionStorage.getItem('reload_from');
    sessionStorage.removeItem('reload_from');
  } catch(e) {}
  if(prev === null) return;
  const now = (D.updated_at || '').replace(' (MYT)', '');
  toast(prev && prev !== now ? '已更新到最新資料' : '已經是最新資料',
        '資料時間 ' + now);
}
boot();

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const d = document.querySelector('tr.detail');
    if(d && d._redraw) d._redraw();
  }, 150);
});
</script>
</body>
</html>
