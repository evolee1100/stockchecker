<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>馬股每日追蹤</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="馬股追蹤">
<style>
/* 淺色 · 極簡：一個表格搞定，只用髮絲線分隔，不用卡片和陰影 */
:root{
  --bg:#fff;
  --line:#e8eaee;
  --hair:#f1f3f5;
  --ink:#16191d;
  --ink-2:#6b737e;
  --ink-3:#98a0ab;   /* 只用於標籤、單位這類不需要細讀的字 */
  --read:#5a626d;    /* 說明文字專用：白底對比 6.2:1，遠高於 AA 的 4.5:1 */
  --up:#0a7a45;
  --down:#c2261f;
  --flat:#a3aab4;
  --tint:#f7f8fa;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:34px 22px 70px}

/* 報頭：中文標題走襯線，跟下面全是無襯線的數據拉開層次。
   用系統內建的宋體/明體（iOS 有 Songti TC、macOS 有 Songti SC），
   不下載網頁字型——CJK 字型檔動輒好幾 MB，手機讀取會拖很久。 */
header{display:flex;align-items:center;gap:11px;
       padding-bottom:15px;margin-bottom:0;border-bottom:1px solid var(--ink)}
.logo{border-radius:7px;flex:none}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.02em;line-height:1.15;
   font-family:"Songti TC","Songti SC","Noto Serif TC","Source Han Serif TC",
               "PingFang TC",serif}
.stamp{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right;
       font-variant-numeric:tabular-nums}
.reload{display:inline-flex;align-items:center;gap:9px;flex:none;cursor:pointer;
        font:inherit;font-size:17px;font-weight:500;line-height:1;
        color:var(--ink-2);background:#fff;border:1px solid var(--line);
        border-radius:4px;padding:12px 19px}      /* 長方形，不是膠囊 */
.reload svg{width:24px;height:24px;flex:none}
.reload:hover{color:var(--ink);border-color:#c9d1da;background:var(--tint)}
.reload:active{transform:translateY(1px)}
.reload.busy svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 市場脈搏：進來第一眼就看到的四個數字。
   不用卡片，用垂直細線分隔，像報紙的行情欄。 */
.pulse{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
       border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.pulse::-webkit-scrollbar{display:none}
.pu{flex:1;min-width:88px;padding:13px 14px 14px;border-left:1px solid var(--hair);cursor:pointer}
.pu:first-child{border-left:none;padding-left:0}
.pu:hover{background:var(--tint)}
.pu .k{font-size:10.5px;color:var(--ink-3);white-space:nowrap;letter-spacing:.02em}
.pu .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;
       letter-spacing:-.02em;line-height:1.2;margin-top:5px}
.pu .c{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
@media(max-width:700px){
  .pulse{margin:0 -15px 20px;padding:0 15px}
  .pu{min-width:104px;padding:14px 15px 15px}
  .pu:first-child{padding-left:0}
  .pu .k{font-size:14.4px}
  .pu .v{font-size:26.4px}
  .pu .c{font-size:15.6px}
}

/* 分頁：46 檔擠一頁太長，依用途切開 */
.tabs{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;
      margin:0 0 20px;padding-bottom:3px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:13px;font-weight:500;line-height:1.6;
     color:var(--ink-2);background:#fff;border:1px solid var(--line);
     border-radius:4px;padding:8px 15px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);border-color:#c9d1da;background:var(--tint)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.tab .n{opacity:.55;margin-left:5px;font-size:11.5px;font-variant-numeric:tabular-nums}
.tab.on .n{opacity:.6}
@media(max-width:700px){
  .tabs{margin:0 -15px 20px;padding:0 15px 4px}
  .tab{font-size:18px;padding:10px 19px}
  .tab .n{font-size:15.6px}
}

/* 更新完成的通知：5 秒後自己消失 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
       display:flex;align-items:center;gap:11px;white-space:nowrap;
       max-width:calc(100vw - 28px);
       background:var(--ink);color:#fff;border-radius:9px;padding:12px 18px;
       box-shadow:0 8px 26px rgba(16,24,40,.26);
       opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:19px;height:19px;flex:none}
.toast .tt{font-size:14px;font-weight:600;line-height:1.3}
.toast .ts{font-size:12px;line-height:1.3;color:rgba(255,255,255,.7);
           font-variant-numeric:tabular-nums;margin-top:2px}
@media(max-width:700px){
  .toast{padding:14px 20px;bottom:22px;gap:12px}
  .toast svg{width:22px;height:22px}
  .toast .tt{font-size:19.2px}
  .toast .ts{font-size:16.2px}
}

/* 今日重點 */
.brief{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:26px}
.brief-h{display:flex;align-items:baseline;gap:9px;padding:11px 14px 10px;
         background:var(--tint);border-bottom:1px solid var(--line)}
.brief-h b{font-size:15px;font-weight:600;letter-spacing:.06em;
           font-family:"Songti TC","Songti SC","Noto Serif TC","PingFang TC",serif}
.brief-h span{font-size:11px;color:var(--ink-3)}
.brief-h .tog{margin-left:auto;font:inherit;font-size:11px;color:var(--ink-3);
              background:none;border:none;cursor:pointer;padding:0}
.brief-h .tog:hover{color:var(--ink)}
.bi{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--hair);cursor:pointer}
.bi:last-child{border-bottom:none}
.bi:hover{background:var(--tint)}
.bi .bar{width:3px;border-radius:2px;flex:none;background:var(--ink-3)}
.bi.critical .bar{background:var(--down)}
.bi.warn .bar{background:#d99100}
.bi.good .bar{background:var(--up)}
.bi.info .bar{background:#7aa7e8}
.bi .bt{flex:1;min-width:0}
.bi .bw{font-size:13.5px;line-height:1.5}
.bi .bw b{font-weight:600}
.bi .by{font-size:12.5px;color:var(--read);line-height:1.6;margin-top:4px}
.bi .bn{font-size:11px;color:var(--ink-3);white-space:nowrap;margin-left:auto;padding-left:8px}
.bi .bwhen{font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
thead th{
  font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.07em;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;padding-bottom:9px;
}
thead th:hover{color:var(--ink)}
th .a{opacity:.35;font-size:8.5px;margin-left:2px}
td{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* 分類標題列 */
tr.group td{
  padding:26px 0 8px;border-bottom:1px solid var(--ink);
  font-size:11.5px;font-weight:650;color:var(--ink);
  letter-spacing:.14em;text-align:left;
}
tr.group:first-child td{padding-top:8px}

tr.row{cursor:pointer}
tr.row:hover td{background:var(--tint)}
tr.row.on td{background:var(--tint)}
/* 最愛 */
.star{background:none;border:none;padding:4px;margin:-4px;cursor:pointer;
      line-height:0;display:inline-flex;color:var(--ink-3);
      -webkit-tap-highlight-color:transparent}
.star svg{width:15px;height:15px;display:block}
.star:hover{color:#c99700}
.star.on{color:#e8a80c}
tr.row td.c-fav{width:1px;padding-left:0;padding-right:6px}
thead th.c-fav{padding-left:0;padding-right:6px;cursor:default}
.name{font-weight:550;letter-spacing:-.005em}
.sym{color:var(--ink-3);font-size:10.5px;font-weight:400;margin-left:7px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.spark{display:block;width:74px;height:22px;margin-left:auto}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:7px;vertical-align:middle}
.dot.bad{background:var(--down)} .dot.warn{background:#d99100}

/* 展開列 */
tr.detail td{padding:0;background:var(--tint);border-bottom:1px solid var(--line);
             white-space:normal;text-align:left}
.dbox{padding:16px 0 20px}
.dnote{font-size:12px;color:var(--read);margin:0 0 12px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.chip{font-size:10.5px;padding:2.5px 9px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.chip.bad{color:var(--down);border-color:#f2cfcd}
.chip.good{color:var(--up);border-color:#c9e6d8}
.chip.warn{color:#8a5c00;border-color:#eeddb6}
.bigchart{display:block;width:100%;height:130px}
/* 有刻度的價格圖 */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart .gl{stroke:var(--hair);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.chart .last{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
/* 跟著游標的價格標籤 */
.tip{position:absolute;pointer-events:none;z-index:3;
     transform:translate(-50%,calc(-100% - 9px));
     background:var(--ink);color:#fff;font-size:11px;line-height:1.35;
     padding:4px 8px;border-radius:6px;white-space:nowrap;
     font-variant-numeric:tabular-nums;opacity:0;transition:opacity .09s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;
           border:4px solid transparent;border-top-color:var(--ink)}

/* 月價試算 */
.calc{margin-top:18px;padding:14px 15px;background:#fff;
      border:1px solid var(--line);border-radius:9px}
.calc h4{margin:0 0 3px;font-size:12px;font-weight:600;color:var(--ink)}
.calc .cnote{font-size:11.5px;color:var(--read);margin:0 0 11px;line-height:1.7}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:14px}
.crow .op{color:var(--ink-3)}
.ci{width:96px;padding:6px 9px;font:inherit;font-size:13.5px;
    font-variant-numeric:tabular-nums;text-align:right;
    border:1px solid var(--line);border-radius:6px;background:var(--tint);color:var(--ink)}
.ci:focus{outline:none;border-color:var(--ink);background:#fff}
.cout{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clab{font-size:10.5px;color:var(--ink-3);width:100%;display:flex;gap:7px}
.clab span{width:96px;text-align:right}
.clab span.w-s{width:66px}
.clab span:last-child{width:auto}
.ci-s{width:66px}
.cunit{font-size:12px;font-weight:500;color:var(--ink-3)}
.cbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.cb{font:inherit;font-size:11px;color:var(--ink-2);background:var(--tint);cursor:pointer;
    border:1px solid var(--line);border-radius:99px;padding:4px 12px;line-height:1.6}
.cb:hover{color:var(--ink);border-color:#d4d9e0;background:#fff}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;
         font-size:11.5px;font-variant-numeric:tabular-nums;margin:5px 0 14px}
.readout .pt{color:var(--ink);font-weight:600}
.readout .rg{color:var(--read)}
/* 圖表區間切換 */
.ranges{display:flex;gap:4px;margin:2px 0 10px}
.rng{font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);
     background:#fff;color:var(--ink-2);cursor:pointer;line-height:1.5}
.rng:hover{color:var(--ink);border-color:#d4d9e0}
.rng.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.rmeta{font-size:11px;color:var(--ink-3);margin:0 0 14px;font-variant-numeric:tabular-nums}

/* 重點報導 */
.dg{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 4px}
.dg-h{padding:9px 13px 8px;background:var(--tint);border-bottom:1px solid var(--line);
      font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.dg-r{display:flex;gap:11px;padding:9px 13px;border-bottom:1px solid var(--hair)}
.dg-r:last-child{border-bottom:none}
.dg-k{flex:none;width:34px;font-size:11px;color:var(--ink-3);padding-top:1px}
.dg-v{flex:1;min-width:0;font-size:12.5px;line-height:1.7;color:var(--read)}

/* 新聞 */
.news{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){ .news{grid-template-columns:1fr;gap:18px} }
.news h4{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;
         letter-spacing:.09em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
/* 資料來源語言：兩顆按鈕，看得出目前在哪個模式 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{font:inherit;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;
            color:var(--ink-3);background:#fff;border:none;padding:2px 10px;cursor:pointer;
            line-height:1.6}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink);background:var(--tint)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on:hover{background:var(--ink);color:#fff}
.item{padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.it{display:block;font-size:12.5px;line-height:1.45;color:inherit;text-decoration:none}
.it:hover{color:#0b57d0;text-decoration:underline}
.im{font-size:11px;color:var(--read);margin-top:4px;display:flex;align-items:center;gap:7px}
.orig{font:inherit;font-size:10px;color:var(--ink-3);background:#fff;cursor:pointer;
      border:1px solid var(--line);border-radius:99px;padding:1px 7px;line-height:1.5}
.orig:hover{color:var(--ink);border-color:#d4d9e0}

/* 原文彈出視窗 */
.ovl{position:fixed;inset:0;z-index:60;display:none;padding:20px;
     align-items:center;justify-content:center;background:rgba(14,18,23,.42)}
.ovl.on{display:flex}
.dlg{background:#fff;border-radius:13px;width:100%;max-width:580px;max-height:82vh;
     overflow:auto;padding:20px 22px 18px;box-shadow:0 16px 48px rgba(16,24,40,.24)}
.dlg h5{margin:0 0 14px;font-size:10.5px;font-weight:600;color:var(--ink-3);
        text-transform:uppercase;letter-spacing:.09em;
        display:flex;align-items:center;justify-content:space-between}
.dlg .x{font-size:20px;line-height:1;color:var(--ink-3);background:none;border:none;
        cursor:pointer;padding:0 2px}
.dlg .x:hover{color:var(--ink)}
.dsec{margin-bottom:15px}
.dsec .k{font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px}
.dsec .en{font-size:15px;line-height:1.5;color:var(--ink)}
.dsec .zh{font-size:13.5px;line-height:1.7;color:var(--ink)}
.tload{color:var(--read)}
.tload:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tfail{color:var(--down)}
.dfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
       border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--ink-3)}
.dfoot a{color:#0b57d0;text-decoration:none;font-weight:500}
.dfoot a:hover{text-decoration:underline}
@media(max-width:700px){
  .ovl{padding:0;align-items:flex-end}
  .dlg{max-width:none;border-radius:14px 14px 0 0;max-height:88vh;padding:18px 18px 22px}
}

/* ---------- 手機版的個股面板 ----------
   手機上把詳細資料塞在列表中間，會把下面的股票推到很遠，看完要捲很久才找得回原位。
   改成從底部滑上來的全螢幕面板，關掉就回到原本的位置。 */
.sheet{position:fixed;inset:0;z-index:55;display:none;background:rgba(14,18,23,.4)}
.sheet.on{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;top:34px;background:#fff;
          border-radius:15px 15px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
          box-shadow:0 -6px 30px rgba(16,24,40,.2)}
.sheet-bar{position:sticky;top:0;z-index:2;background:#fff;
           border-bottom:1px solid var(--line);padding:13px 16px 11px;
           display:flex;align-items:flex-start;gap:12px}
.sheet-bar .t{flex:1;min-width:0}
.sheet-bar .star{margin-top:2px}
.sheet-bar .nm{font-size:15px;font-weight:600;line-height:1.3}
.sheet-bar .sy{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.sheet-bar .pr{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.sheet-bar .ch{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sheet-bar .x{font-size:24px;line-height:.8;color:var(--ink-3);background:none;
              border:none;cursor:pointer;padding:2px 0 2px 6px}
.sheet-body{padding:0 16px 40px}
.sheet-body .dbox{padding:14px 0 0}
.none{font-size:12px;color:var(--read);padding:7px 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 18px}
.dgrid .k{font-size:10.5px;color:var(--ink-3)}
.dgrid .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}


/* meta 欄只給手機用 */
.c-meta{display:none}

/* ---------- 手機版：不捲表格，改成兩行式列表 ----------
   name  ┊ 走勢 ┊ 股價
   P/B·ROE·息 ┊    ┊ 今日%                                        */
@media(max-width:700px){
  .wrap{padding:22px 15px 56px}
  .scroll{overflow:visible}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tr.group{display:block}
  tr.group td{display:block;padding:24px 0 7px;font-size:13.2px}

  tr.row{
    display:grid;
    grid-template-columns:26px minmax(0,1fr) 54px auto;
    grid-template-areas:"fv nm tr pr" "fv mt tr ch";
    align-items:center;
    column-gap:9px;row-gap:3px;
    padding:14px 0;                      /* 點擊區至少 56px 高，手指按得準 */
    border-bottom:1px solid var(--hair);
    -webkit-tap-highlight-color:rgba(6,112,63,.07);
  }
  tr.row:active td{opacity:.55}
  tr.row td{display:block;border:none;padding:0;background:none !important}
  /* 注意：這些一定要用 tr.row 開頭，否則權重輸給上面的 `tr.row td`，display:none 不會生效 */
  tr.row td.c-fav  {grid-area:fv;align-self:center}
  tr.row td.c-name {grid-area:nm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17.4px}
  tr.row td.c-meta {grid-area:mt;display:block;font-size:13.2px;color:var(--ink-3);
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.row td.c-trend{grid-area:tr;align-self:center}
  tr.row td.c-trend .spark{width:54px;height:26px}
  /* 手指的點擊區至少 44px 高，視覺上還是那顆小星星 */

     而是把手機上看得到的每一處字級各自 x1.2。集中在這裡方便日後再調。 */

/* ---------- iPhone 版面修正 ----------
   實機截圖（iOS 27、iPhone 寬 393pt）看到四個問題：
   1. 標題放大後，更新鈕被擠到自己一整行，浪費整列高度
   2. 市場脈搏第 4 項被切掉——其實能左右滑，但畫面上看不出來
   3. 分頁同上，「REIT」只露出一半
   4. 股票名稱靠右（bug）：加了最愛星星後星星成了第一欄，
      「第一欄靠左」的規則套到星星上，名稱變第二欄繼承了靠右
   手機上不該把東西藏在看不出來的滑動後面，改成全部攤開。 */
@media(max-width:700px){
  /* 1. 報頭：第一列 圖示＋標題，第二列 時間戳｜更新鈕 */
  header{flex-wrap:wrap;row-gap:12px}
  header .logo{order:0}
  header h1{order:1;flex:1 1 calc(100% - 40px)}
  header .stamp{order:2;flex:1 1 auto;flex-basis:auto;margin:0;align-self:center;text-align:left}
  header .reload{order:3;margin-left:auto}

  /* 2. 市場脈搏：2x2 格，四個數字全部看得到 */
  .pulse{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin:0 0 20px;padding:0}
  .pu{min-width:0;padding:13px 0 14px;border-left:none;border-top:1px solid var(--hair)}
  .pu:nth-child(odd){padding-right:13px;border-right:1px solid var(--hair)}
  .pu:nth-child(even){padding-left:15px}
  .pu:nth-child(-n+2){border-top:none}
  .pu:first-child{padding-left:0}
  .pu .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 3. 分頁：4 欄等寬排成兩列，七個全部看得到。
        單純換行會排成 3+3+1，「全部」孤零零一行很難看 */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
        overflow:visible;margin:0 0 20px;padding:0}
  .tab{padding:10px 4px;text-align:center;min-width:0}
  .tab .n{margin-left:3px}

  /* 4. 名稱與小字靠左 */
  tr.row td.c-name, tr.row td.c-meta{text-align:left}

  /* 區間按鈕：六個等寬排一列。用 flex 換行時字會在按鈕內折成「1個/月」，
     等寬格 + 不換行才排得整齊 */
  .ranges{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .rng{font-size:13px;padding:7px 2px;text-align:center;white-space:nowrap;min-width:0}
}

/* ---------- 市場區塊（快訊／漲跌排行／IPO）----------
   跟「重點」同一套卡片樣式，每張都能收起並記住狀態。 */
.mcard{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px}
.mcard-h{display:flex;align-items:baseline;gap:9px;padding:11px 14px 10px;
         background:var(--tint);border-bottom:1px solid var(--line)}
.mcard-h b{font-size:15px;font-weight:600;letter-spacing:.06em;
           font-family:"Songti TC","Songti SC","Noto Serif TC","PingFang TC",serif}
.mcard-h span{font-size:11px;color:var(--ink-3)}
.mcard-h .tog{margin-left:auto;font:inherit;font-size:11px;color:var(--ink-3);
              background:none;border:none;cursor:pointer;padding:0}
.mcard-h .tog:hover{color:var(--ink)}
.mcard-b[hidden]{display:none}

/* 快訊 */
.hl{display:block;padding:10px 14px;border-bottom:1px solid var(--hair);
    color:inherit;text-decoration:none;cursor:pointer}
.hl:last-child{border-bottom:none}
.hl:hover{background:var(--tint)}
.hl .t{font-size:13.5px;line-height:1.5}
.hl .m{font-size:11px;color:var(--read);margin-top:3px}
/* 即時新聞：「追蹤股票最新」卡片，每則前面標出是哪一檔 */
.hl .m .stk{color:var(--ink);font-weight:600}
/* 第一次抓回來之前先佔好三則的高度：資料進來時不會把下面的漲跌排行、股票列表往下推 */
.hl.sk{cursor:default}
.hl.sk i{display:block;height:1em;margin:.25em 0;border-radius:4px;background:var(--hair)}
.hl.sk i.s{width:62%}
.hl.sk .m i{width:38%}
.hl-note{font-size:12.5px;color:var(--read);padding:12px 14px;line-height:1.6}
/* 個股報導裡瀏覽器剛抓到的那幾則 */
.live{flex:none;font-size:10px;font-weight:600;line-height:1.5;color:#0b57d0;
      border:1px solid #c9d8f3;border-radius:99px;padding:0 6px}
/* 「新聞 18:40 更新」那一行先留好位置：第一次抓到才冒出來的話，
   手機上報頭會多一行，整頁在讀者眼前往下跳 */
.stamp .fresh{display:block;min-height:1.5em;color:var(--ink-2);font-weight:500}
.dsec .zh p{margin:0 0 .8em}
.dsec .zh p:last-child{margin-bottom:0}

/* 漲跌排行：兩欄並排，手機上改上下 */
.mv{display:grid;grid-template-columns:1fr 1fr}
.mv-col + .mv-col{border-left:1px solid var(--line)}
.mv-h{font-size:11px;font-weight:600;letter-spacing:.06em;padding:9px 14px 6px}
.mv-h.up{color:var(--up)} .mv-h.down{color:var(--down)}
.mvr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;
     padding:8px 14px;border-top:1px solid var(--hair);text-decoration:none;color:inherit}
.mvr:hover{background:var(--tint)}
.mvr .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvr .s{font-size:10.5px;color:var(--read);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvr .p{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mvr .c{font-size:11.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mv-note{font-size:10.5px;color:var(--read);padding:8px 14px 10px;border-top:1px solid var(--hair);
         line-height:1.6}

/* IPO */
.ipo-sec{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);
         padding:10px 14px 5px}
.ipo-sec + .ipor{border-top:none}
.ipor{display:grid;grid-template-columns:52px minmax(0,1fr) auto;column-gap:11px;align-items:center;
      padding:9px 14px;border-top:1px solid var(--hair);text-decoration:none;color:inherit}
.ipor:hover{background:var(--tint)}
.ipor .d{font-size:11px;color:var(--read);font-variant-numeric:tabular-nums;line-height:1.35}
.ipor .d b{display:block;font-size:14px;color:var(--ink);font-weight:650}
.ipor .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipor .s{font-size:10.5px;color:var(--read);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipor .r{text-align:right;font-variant-numeric:tabular-nums}
.ipor .r .p{font-size:12.5px;color:var(--read)}
.ipor .r .c{font-size:13px;font-weight:650}
.ipor{align-items:start}
.ipor .n,.ipor .s{white-space:normal;overflow:visible}
.ipor .fn{font-size:10.5px;color:var(--read);margin-top:1px}
.ipor .biz{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:4px;
           display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ipor .meta{font-size:11px;color:var(--read);line-height:1.5;margin-top:3px}
.ipor .meta b{color:var(--ink-2);font-weight:600}
.ipo-note{font-size:11px;color:var(--read);padding:9px 14px 2px;line-height:1.6}

@media(max-width:700px){
  .mcard-h b{font-size:17.5px}
  .mcard-h span,.mcard-h .tog{font-size:13px}
  .hl .t{font-size:16px} .hl .m{font-size:13px}
  .hl-note{font-size:15px}
  .live{font-size:12.5px;padding:0 7px}
  .mv{grid-template-columns:1fr}
  .mv-col + .mv-col{border-left:none;border-top:1px solid var(--line)}
  .mv-h{font-size:13px}
  .mvr .n{font-size:16px} .mvr .s{font-size:12.5px}
  .mvr .p{font-size:16px} .mvr .c{font-size:14px}
  .mv-note{font-size:12.5px}
  .ipo-sec{font-size:13px}
  .ipor{grid-template-columns:60px minmax(0,1fr) auto}
  .ipor .d{font-size:13px} .ipor .d b{font-size:17px}
  .ipor .n{font-size:16px} .ipor .s{font-size:12.5px}
  .ipor .r .p{font-size:14px} .ipor .r .c{font-size:15.5px}
  .ipor .fn{font-size:12.5px} .ipor .biz{font-size:14.5px} .ipor .meta{font-size:13px}
  .ipo-note{font-size:13px}
}

.bi.more{display:none}

       background:var(--tint);border:none;border-top:1px solid var(--line);

@media(max-width:700px){

  /* 漲跌排行在手機上仍左右並排：只留名稱與漲跌幅，高度減半 */

<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon.svg" alt="" width="26" height="26">
    <h1 id="title">馬股每日追蹤</h1>
    <span class="stamp" title="收盤價，非即時報價。僅為資訊整理，不構成投資建議。"><span id="updated"></span><span class="fresh" id="fresh"></span></span>
    <button class="reload" type="button" id="reload" title="重新載入最新資料">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/>
      </svg><span>更新</span></button>
  </header>

  <div class="pulse" id="pulse"></div>
  <div id="headlines"></div>
  <div id="brief"></div>
  <div id="watchnews"></div>
  <div id="movers"></div>
  <div id="ipo"></div>
  <div class="tabs" id="tabs"></div>

  <div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>


</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sheet-bar">
      <button class="star" type="button" id="sh-star" aria-label="加入最愛"></button>
      <div class="t"><div class="nm" id="sh-name"></div><div class="sy" id="sh-sym"></div></div>
      <div><div class="pr" id="sh-price"></div><div class="ch" id="sh-chg"></div></div>
      <button class="x" type="button" id="sh-x" aria-label="關閉">&times;</button>
    </div>
    <div class="sheet-body" id="sh-body"></div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="dlg" role="dialog" aria-modal="true" aria-label="原文">
    <h5>原文 <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">${failed ? 'ENGLISH（這則翻譯失敗，下次更新會再試）' : 'ENGLISH 原文'}</div><div class="en" id="ovl-en"></div></div>
    <div class="dsec"><div class="k">中譯（機器翻譯）</div><div class="zh" id="ovl-zh"></div></div>
    <div class="dfoot"><span id="ovl-src"></span>
      <a id="ovl-url" href="#" target="_blank" rel="noopener">開啟原文網頁 →</a></div>
  </div>
</div>

<script>
let D = window.STOCK_DATA || null;   // snapshot.html 會把資料直接內嵌，那就不用再抓
const $ = s => document.querySelector(s);

const num = v => { if(v==null) return null;
  const n = parseFloat(String(v).replace(/[%,]/g,'')); return isNaN(n)?null:n; };
const cls = v => v==null ? 'flat' : v>0 ? 'up' : v<0 ? 'down' : 'flat';
const pc  = v => v==null ? '—' : (v>0?'+':'') + v.toFixed(2) + '%';
// dp 可以指定小數位：穩定幣要看到第 4 位，0.9998 用一般規則會變成 1.000
const px  = (v,i,dp) => v==null ? '—'
  : dp != null ? v.toFixed(dp)
  : Math.abs(v) >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:0})
  : i ? v.toLocaleString(undefined,{maximumFractionDigits:2})
  : v.toFixed(Math.abs(v) < 1 ? 3 : 2);

function spark(series, w, h, big){
  const p = series.map(x=>x.close);
  if(p.length<2) return '';
  const lo=Math.min(...p), hi=Math.max(...p), span=(hi-lo)||1;
  const d = p.map((v,i)=>`${i?'L':'M'}${(i/(p.length-1)*w).toFixed(1)} ${(h-(v-lo)/span*(h-3)-1.5).toFixed(1)}`).join(' ');
  const col = p[p.length-1] >= p[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="${big?'bigchart':'spark'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="${big?1.6:1.3}"
          stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}



/* ---------- 鮮果串（FFB / TBS）收購價試算 ----------
   小園主拿到的鮮果串價 = 毛棕櫚油（CPO）價 x 收購商給的出油率（OER）。
   CPO 價用 MPOB 官方牌價，出油率由使用者自己填（收購商會給）。 */
const OER_KEY = 'palm_oer';

function calculator(s){
  const saved = (() => { try { return localStorage.getItem(OER_KEY); } catch(e) { return null; } })();
  return `<div class="calc" data-calc data-avg="${s.avg30}" data-today="${s.price}">
    <h4>鮮果串（FFB）收購價試算</h4>
    <p class="cnote">鮮果串價 = 毛棕櫚油價 × 出油率。CPO 價預設帶入
       <b>${s.avg30_days} 日均價 RM ${Number(s.avg30).toLocaleString()}</b>
       （MPOB 官方牌價每日加總 ÷ ${s.avg30_days}）。</p>
    <div class="crow">
      <input class="ci" data-k="cpo" value="${s.avg30}" inputmode="decimal">
      <span class="op">×</span>
      <input class="ci ci-s" data-k="oer" value="${saved || '18.75'}" inputmode="decimal">
      <span class="op">%</span>
      <span class="op">=</span>
      <span class="cout"></span>
    </div>
    <div class="clab"><span>CPO 價 RM/噸</span><span></span><span class="w-s">出油率</span></div>
    <div class="cbtns">
      <button class="cb" type="button" data-use="avg">用 ${s.avg30_days} 日均價</button>
      <button class="cb" type="button" data-use="today">用當日價 ${Number(s.price).toLocaleString()}</button>
    </div>
  </div>`;
}

function wireCalculator(root){
  const box = root.querySelector('[data-calc]');
  if(!box) return;
  const cpo = box.querySelector('[data-k="cpo"]');
  const oer = box.querySelector('[data-k="oer"]');
  const out = box.querySelector('.cout');

  const run = () => {
    const a = parseFloat(cpo.value), b = parseFloat(oer.value);
    if(!isFinite(a) || !isFinite(b)){ out.textContent = '—'; return; }
    out.innerHTML = 'RM ' + (a * b / 100).toLocaleString(undefined,
      {minimumFractionDigits: 2, maximumFractionDigits: 2}) +
      ' <span class="cunit">/噸</span>';
  };

  [cpo, oer].forEach(el => {
    el.addEventListener('input', () => {
      if(el === oer){ try { localStorage.setItem(OER_KEY, el.value); } catch(e) {} }
      run();
    });
    el.addEventListener('click', e => e.stopPropagation());
  });
  box.querySelectorAll('.cb').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    cpo.value = b.dataset.use === 'avg' ? box.dataset.avg : box.dataset.today;
    run();
  });
  box.addEventListener('click', e => e.stopPropagation());
  run();
}

/* ---------- 有刻度的價格圖 ----------
   小縮圖不需要刻度，但展開後的圖要能回答「多少錢、在什麼價位」，
   所以這裡畫格線 + 右側價格刻度 + 最新價標記，滑過去還能看單日價格。 */
function priceChart(host, series, isIdx){
  const W = Math.max(280, host.clientWidth || 640), H = 168;
  const P = {t:10, r:54, b:18, l:2};
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const pts = series.map(d=>d.close);
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if(hi === lo){ hi += hi*0.01 || 1; lo -= lo*0.01 || 1; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;

  const X = i => P.l + (series.length<2 ? pw/2 : i/(series.length-1)*pw);
  const Y = v => P.t + ph - (v-lo)/(hi-lo)*ph;

  // 找好看的刻度間距（1 / 2 / 2.5 / 5 的倍數）
  const rough = (hi-lo)/4, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1,2,2.5,5,10].find(m => m*mag >= rough) * mag;
  const ticks = [];
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step) ticks.push(v);

  const last = series[series.length-1];
  const rising = pts[pts.length-1] >= pts[0];
  const col = rising ? 'var(--up)' : 'var(--down)';
  const line = series.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d.close).toFixed(1)}`).join(' ');
  const gid = 'pg'+Math.random().toString(36).slice(2,7);

  // x 軸日期：頭、尾、加中間兩點
  const xi = [0, Math.round((series.length-1)/3), Math.round((series.length-1)*2/3), series.length-1];
  const xlab = [...new Set(xi)].map(i=>{
    const [y,m,d] = series[i].date.split('-');
    const anchor = i===0 ? 'start' : i===series.length-1 ? 'end' : 'middle';
    return `<text class="axis" x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${anchor}">${m}/${d}</text>`;
  }).join('');

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".16"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>{
      // 格線照畫，但刻度數字若跟「最新價」標籤太近就省略，免得疊在一起
      const near = Math.abs(Y(v) - Y(last.close)) < 11;
      return `<line class="gl" x1="${P.l}" x2="${P.l+pw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>` +
        (near ? '' : `<text class="axis" x="${P.l+pw+7}" y="${(Y(v)+3.5).toFixed(1)}">${px(v,isIdx)}</text>`);
    }).join('')}
    <path d="${line} L${X(series.length-1).toFixed(1)} ${P.t+ph} L${P.l} ${P.t+ph} Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${P.t+ph}" style="display:none"/>
    <circle class="hov" r="3.5" fill="${col}" style="display:none"/>
    <circle cx="${X(series.length-1).toFixed(1)}" cy="${Y(last.close).toFixed(1)}" r="3" fill="${col}"/>
    <text class="last" x="${P.l+pw+7}" y="${(Y(last.close)+3.5).toFixed(1)}" fill="${col}">${px(last.close,isIdx)}</text>
    ${xlab}
  </svg>`;

  return {X, Y, P, pw, svg: host.querySelector('svg')};
}

// 同一標題的公告（EPF 一週申報五六次持股變動）合併成一則，
// 不然清單被同一句話洗版，其他公告被擠出去。點開看得到每一則的內容。
function groupFilings(list){
  const by = new Map(), out = [];
  for(const f of list || []){
    const k = f.title_zh || f.title;
    if(by.has(k)){ by.get(k).push(f); continue; }
    const g = [f]; by.set(k, g); out.push(g);
  }
  const md = iso => iso ? +iso.slice(5, 7) + '/' + +iso.slice(8, 10) : '';
  return out.slice(0, 6).map(g => g.length < 2 ? g[0] : {...g[0],
    title_zh: (g[0].title_zh || g[0].title) + `（${g.length} 則）`,
    body_zh: g.filter(f => f.body_zh).map(f => md(f.date) + '：' + f.body_zh).join('\n\n'),
    body: ''});
}

const NO_ARTICLES = '近三個月沒有相關報導', NO_FILINGS = '沒有抓到公告';
const newsMeta = n => [n.source_zh || n.source, ago(n)].filter(Boolean).join(' · ');

// 每則新聞共用的 data-*：彈窗（showOriginal）和「中文／原文」切換都從這裡讀。
// 大馬中文報（lang zh）全文太長不塞進屬性，用網址去 LIVE_BODY 查；
// data-full 標出「App 裡讀得到全文」——news.json 那份只有標題，點了就直接開來源網頁
function newsAttrs(n){
  const zh = isZh(n);
  return `data-zh="${esc(n.title_zh || n.title)}" data-en="${esc(n.title || '')}"
    data-src="${esc(newsMeta(n))}" data-url="${esc(n.source_url || n.url)}"
    data-body-en="${zh ? '' : esc(n.body || '')}" data-body-zh="${esc(n.body_zh || '')}"
    ${zh ? `data-lang="zh" data-key="${esc(n.url)}"${zhFull(n) ? ' data-full="1"' : ''}` : ''}`;
}

// 抽出來放在外層（原本在 detailRow 裡），即時新聞抓回來後要能只重畫這一塊
function feed(list, empty){
  if(!list || !list.length) return `<div class="none">${empty}</div>`;
  return list.map(n => {
    const zh = n.title_zh || n.title, en = n.title || '';
    const cn = isZh(n);
    const translated = !cn && zh !== en;
    const hasBody = cn ? zhFull(n) : !!(n.body_zh || n.body);
    return `<div class="item" ${newsAttrs(n)}>
      <a class="it" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(zh)}</a>
      <div class="im">${n.live ? '<span class="live">即時</span>' : ''}${esc(newsMeta(n))}
        ${(translated || hasBody) ? `<button class="orig" type="button">${hasBody ? '讀全文' : '原文'}</button>` : ''}</div>
    </div>`;
  }).join('');
}

function detailRow(s){
  const f = s.fundamentals || {};
  const cells = [
    ['前收', px(s.prev_close,s.is_index,s.dp)], ['當日高', px(s.day_high,s.is_index,s.dp)], ['當日低', px(s.day_low,s.is_index,s.dp)],
    ['5 日', pc(s.change_pct_5d)], ['3 個月', pc(s.change_pct_3m)], ['1 年', pc(s.change_pct_1y)],
    ['3 年', pc(s.change_pct_3y)], ['5 年', pc(s.change_pct_5y)],
    ['52週高', px(s.high_52w,s.is_index,s.dp)], ['52週低', px(s.low_52w,s.is_index,s.dp)], ['距高點', pc(s.off_52w_high)],
    ['成交量', s.volume ? s.volume.toLocaleString() : '—'],
    ['量能倍數', s.volume_ratio ? s.volume_ratio+'x' : '—'],
    ['市值', f.market_cap], ['P/E', f.pe_ratio], ['每股淨值', f.bvps], ['EPS', f.eps], ['ROA', f.roa],
    ['每股派息', f.dps], ['派息率', f.payout_ratio], ['除息日', f.ex_div_date],
    ['下次財報', f.earnings_date], ['分析師', f.analyst_rating_zh || f.analyst_rating], ['目標價', f.analyst_target],
  ].filter(([,v]) => v!=null && v!=='' && v!=='—');
  const COLORED = ['5 日','3 個月','1 年','距高點'];

  const artsHtml = feed(stockArticles(s), NO_ARTICLES), filHtml = feed(groupFilings(s.filings), NO_FILINGS);
  const tr = document.createElement('tr');
  tr.className = 'detail';
  tr.innerHTML = `<td colspan="${COLS.length}"><div class="dbox">
    <div class="dnote">${s.note||''}${s.market_time?' · 最後成交 '+s.market_time:''}${
      s.live && s.live_ts ? ' · 即時報價 ' + hhmm(s.live_ts) : ''}</div>
    <div class="chips">${(s.flags||[]).map(f=>`<span class="chip ${f.level}">${f.text}</span>`).join('')}</div>
    ${(s.digest && s.digest.length) ? `<div class="dg">
      <div class="dg-h">重點報導</div>
      ${s.digest.map(([k, v]) => `<div class="dg-r"><div class="dg-k">${k}</div>
        <div class="dg-v">${v}</div></div>`).join('')}
    </div>` : ''}
    <div class="ranges">${RANGES.filter(r => !r.w || (s.series_w || []).length > 30)
      .map(r => `<span class="rng ${r.t===chartRange?'on':''}" data-d="${r.t}">${r.t}</span>`).join('')}</div>
    <div class="chartslot"></div>
    <div class="dgrid">${cells.map(([k,v])=>
      `<div><div class="k">${k}</div><div class="v ${COLORED.includes(k)?cls(num(v)):''}">${v}</div></div>`
    ).join('')}</div>
    ${s.calculator ? calculator(s) : ''}
    <div class="news">
      <div><h4>媒體報導 <span class="seg">
        <button type="button" class="on" data-l="zh">中文</button>
        <button type="button" data-l="en">原文</button></span></h4>
<div data-feed="a">${artsHtml}</div></div>
      <div><h4>Bursa 公告 <span class="seg">
        <button type="button" class="on" data-l="zh">中文</button>
        <button type="button" data-l="en">原文</button></span></h4>
<div data-feed="f">${filHtml}</div></div>
    </div>
  </div></td>`;
  // 記下畫出去的內容，paintFeeds 比對：一樣就不換，面板不閃也不跳
  tr.querySelector('[data-feed="a"]')._html = artsHtml;
  tr.querySelector('[data-feed="f"]')._html = filHtml;

  const slot = tr.querySelector('.chartslot');
  const draw = () => {
    let r = RANGES.find(x => x.t === chartRange);
    if(!r || (r.w && (s.series_w || []).length <= 30)) r = RANGES[0];   // 沒週線就退回 1 個月
    const src = r.w ? s.series_w : s.series;
    const seg = r.d ? src.slice(-r.d) : src;
    const chg = (seg[seg.length-1].close / seg[0].close - 1) * 100;

    slot.innerHTML = `<div class="chart"></div>
      <div class="readout">
        <span class="pt"></span>
        <span class="rg">區間 ${seg[0].date} → ${seg[seg.length-1].date} ·
          ${seg.length} ${r.w ? '週' : '個交易日'} ·
          <span class="${cls(chg)}">${pc(chg)}</span>${r.w ? '（週線）' : ''}</span>
      </div>`;

    const host = slot.querySelector('.chart');
    const {X, Y, P, pw, svg} = priceChart(host, seg, s.is_index);
    const tip = document.createElement('div');
    tip.className = 'tip';
    host.appendChild(tip);
    const out   = slot.querySelector('.readout .pt');
    const cross = svg.querySelector('.cross');
    const hov   = svg.querySelector('.hov');

    // 沒有指到任何一天時，顯示最新收盤
    const base = () => {
      const d = seg[seg.length - 1];
      out.innerHTML = `最新 ${d.date} · <b>${px(d.close, s.is_index, s.dp)}</b>`;
      cross.style.display = 'none';
      hov.style.display = 'none';
      tip.classList.remove('on');
    };
    base();

    // 滑鼠移過去 / 手指滑過去，顯示那一天的日期與價格
    const track = clientX => {
      const r = svg.getBoundingClientRect();
      const vx = (clientX - r.left) / r.width * svg.viewBox.baseVal.width;
      const i = Math.max(0, Math.min(seg.length - 1,
                Math.round((vx - P.l) / pw * (seg.length - 1))));
      const d = seg[i];
      const vs = (d.close / seg[0].close - 1) * 100;
      out.innerHTML = `${d.date} · <b>${px(d.close, s.is_index, s.dp)}</b>
        <span class="${cls(vs)}">${pc(vs)}</span>`;
      const cx = X(i);
      cross.setAttribute('x1', cx);
      cross.setAttribute('x2', cx);
      cross.style.display = '';
      hov.setAttribute('cx', cx);
      hov.setAttribute('cy', Y(d.close));
      hov.style.display = '';

      // 標籤跟著游標，貼在資料點正上方；靠近邊緣時往內收，不要被切掉
      tip.innerHTML = `<b>${px(d.close, s.is_index, s.dp)}</b>${s.unit ? ' ' + s.unit : ''}<br>${d.date}`;
      tip.classList.add('on');
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.max(half + 2, Math.min(host.clientWidth - half - 2, cx)) + 'px';
      tip.style.top  = Y(d.close) + 'px';
    };

    svg.addEventListener('pointermove',  e => { e.stopPropagation(); track(e.clientX); });
    svg.addEventListener('pointerleave', base);
    svg.addEventListener('touchmove',    e => track(e.touches[0].clientX), {passive: true});
    svg.addEventListener('touchend',     base);
    svg.addEventListener('click',        e => e.stopPropagation());
  };

  // 「中文 / 原文」兩顆按鈕：機器翻譯遇到金融術語會有偏差，要能一眼看出目前在哪個模式
  tr.querySelectorAll('.seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => btn.onclick = ev => {
      ev.stopPropagation();
      const en = btn.dataset.l === 'en';
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      seg.closest('div').querySelectorAll('.item').forEach(it => {
        const v = en ? it.dataset.en : it.dataset.zh;
        if(v) it.querySelector('.it').textContent = v;
      });
    });
  });

  tr._redraw = draw;                         // 由 render() 在插進 DOM 後呼叫（那時才量得到寬度）
  wireCalculator(tr);
  fillZh(tr);                                // 還是英文的報導標題，在手機上補翻
  tr.querySelectorAll('.rng').forEach(b => b.onclick = ev => {
    ev.stopPropagation();                    // 別讓點擊冒泡去收合這一列
    chartRange = b.dataset.d;
    // 用按鈕自己的父層來切換高亮，不能用 tr——手機版會把 .dbox 搬進面板，
    // 搬走之後 tr.querySelectorAll('.rng') 會是空的，高亮就不會跟著動
    b.parentNode.querySelectorAll('.rng').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  return tr;
}

/* ---------- 市場區塊：快訊、漲跌排行、IPO ----------
   追蹤清單只看得到自己挑的 49 檔。這三塊回答的是「整個市場今天怎麼了」，
   設計目標是打開頁面、不捲動、不點開，就知道大方向。 */

// 可收起的卡片，收起狀態記在瀏覽器裡。
// 內容跟上次畫的一模一樣就不重畫（即時新聞每 3 分鐘檢查一次，多半沒有新的）：
// 不閃、不動捲動位置，也不會把使用者剛切到「原文」的標題換回來。回傳有沒有重畫
function mcard(id, title, sub, body){
  const key = 'fold_' + id;
  let folded = false;
  try { folded = localStorage.getItem(key) === '1'; } catch(e) {}
  const host = document.getElementById(id);
  const html = `<div class="mcard">
    <div class="mcard-h"><b>${title}</b><span>${sub}</span>
      <button class="tog" type="button">${folded ? '展開' : '收起'}</button></div>
    <div class="mcard-b" ${folded ? 'hidden' : ''}>${body}</div></div>`;
  if(host._html === html) return false;
  host._html = html;
  host.innerHTML = html;
  host.querySelector('.tog').onclick = () => {
    const b = host.querySelector('.mcard-b');
    b.hidden = !b.hidden;
    host.querySelector('.tog').textContent = b.hidden ? '展開' : '收起';
    try { localStorage.setItem(key, b.hidden ? '1' : '0'); } catch(e) {}
  };
  return true;
}

const KSE = code => 'https://www.klsescreener.com/v2/stocks/view/' + encodeURIComponent(code);
const ppx = v => v == null ? '—' : v.toFixed(v < 1 ? 3 : 2);

// 快訊、追蹤股票都是預設 3 則，按「更多」看到 8 則：
// 兩張都攤開的話，手機第一屏被快訊塞滿，「重點」被擠到畫面外
const HL_TOP = 3, HL_MAX = 8, WATCH_TOP = 3, WATCH_MAX = 8;
let hlAll = false, watchAll = false;

// 「顯示更多／只看前 3 則」以按下去的那顆按鈕為準：
// 展開時按鈕以上的內容沒變，新的幾則就接在手指的位置往下長，不用捲；
// 收起時上面少了幾則，把按鈕捲回手指底下，不然按鈕跑到畫面外面。
// （以前拿下面的卡片當錨點，展開的那幾則反而被推出畫面上方）
function wireMore(host, flip, redraw){
  const b = host.querySelector('.bmore');
  if(!b) return;
  b.onclick = () => {
    const y = b.getBoundingClientRect().top;
    const opened = flip();
    redraw();
    const nb = host.querySelector('.bmore');
    if(opened || !nb) return;
    const d = nb.getBoundingClientRect().top - y;
    if(Math.abs(d) > 1) scrollBy(0, d);
  };
}

const hlRow = (n, tag) => `<div class="hl item" ${newsAttrs(n)}>

// 中文報只有標題、沒有全文可讀的，彈窗裡什麼都沒有，直接開來源網頁

   原本塞在快訊卡的下半段，手機上快訊卡長到 770px，把「重點」擠出第一屏 */
function renderWatch(){
  const host = document.getElementById('watchnews');
  const title = '追蹤股票最新';
  // 第一次還沒抓回來：先佔好三則的位置，抓到時下面的內容才不會被往下推
  if(!LIVE.tried){
    const sk = '<div class="hl sk"><div class="t"><i></i><i class="s"></i></div><div class="m"><i></i></div></div>';
    mcard('watchnews', title, '中文報 · 載入中', sk.repeat(WATCH_TOP));
    return;
  }
  // 同一篇（例如收盤報導同時提到馬銀行）快訊卡最上面三則已經列了，這裡就不再重複。
  // 只比對前三則（不管快訊卡有沒有展開），這張卡的內容才不會跟著那顆按鈕變來變去
  const seen = new Set(marketNews().slice(0, HL_TOP).flatMap(n => dupKeys(n).filter(k => !k.startsWith('p:'))));
  const ws = newest(LIVE.watch).filter(n => !dupKeys(n).some(k => seen.has(k))).slice(0, WATCH_MAX);
  if(!ws.length){
    mcard('watchnews', title, '中文報', `<div class="hl-note">${LIVE.watchOk
      ? '最近 7 天，星洲、南洋、中國報沒有提到追蹤股票的財經新聞。'
      : '暫時連不上星洲、南洋、中國報，稍後會自動再試。'}</div>`);
    return;
  }
  // 標出是哪一檔：一篇講好幾家銀行時只寫第一家，其餘用「等 N 檔」帶過
  const tagOf = n => n.stocks.length > 1 ? n.stocks[0].name + ' 等 ' + n.stocks.length + ' 檔'
                                         : n.stocks[0].name;
  const shown = ws.slice(0, watchAll ? WATCH_MAX : WATCH_TOP);
  mcard('watchnews', title, `中文報最新 ${shown.length} 則 · 即時`,
    shown.map(n => hlRow(n, tagOf(n))).join('') +
    (ws.length > WATCH_TOP ? `<button class="bmore" type="button">${
      watchAll ? '只看前 ' + WATCH_TOP + ' 則' : '顯示更多（共 ' + ws.length + ' 則）'}</button>` : ''));
  host.querySelectorAll('.hl').forEach(el => el.onclick = () => openNews(el));
  wireMore(host, () => (watchAll = !watchAll), renderWatch);
}

function renderIPO(){
  const ip = D.market && D.market.ipo;
  if(!ip || (!ip.upcoming.length && !ip.recent.length)){ clearCard('ipo'); return; }
  const md = iso => { const [, m, d] = iso.split('-').map(Number); return m + '/' + d; };
  const MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const dm = t => { const m = /(\d{1,2})\s+([A-Za-z]{3})/.exec(t || ''); return m && MON[m[2]] ? MON[m[2]] + '/' + (+m[1]) : ''; };
  // 金額換成「萬／億」令吉
  const rm = v => !v ? '' : v >= 1e8 ? 'RM' + (v / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 億'
                              : 'RM' + Math.round(v / 1e4).toLocaleString() + ' 萬';
  // 「GB BOND HOLDINGS BERHAD」→「GB Bond Holdings Berhad」
  const title = t => (t || '').toLowerCase().replace(/\b([a-z])([a-z]{3,})/g, (_, a, b) => a.toUpperCase() + b)
                                 .replace(/\b([a-z]{1,3})\b/g, w => w.toUpperCase());
  const detail = i => {
    const meta = [
      i.open && i.close ? `認購 ${dm(i.open)}–${dm(i.close)}` : '',
      i.oversub ? `超額認購 <b>${i.oversub} 倍</b>` : '',
      i.raise_m ? `集資 ${rm(i.raise_m * 1e6)}` : '',
      i.mcap ? `上市市值 ${rm(i.mcap)}` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="n">${esc(i.short)}${i.name_zh ? ' ' + esc(i.name_zh) : ''}</div>
      <div class="s">代號 ${esc(i.code)} · 馬股${esc(i.board_zh || i.board || '')}${i.sector_zh ? ' · ' + esc(i.sector_zh) : ''}</div>
      <div class="fn">${esc(title(i.name))}</div>
      ${(i.business || i.about) ? `<div class="biz">${esc(i.business ? '業務：' + i.business : i.about)}</div>` : ''}
      ${meta ? `<div class="meta">${meta}</div>` : ''}`;
  };
  const up = ip.upcoming.slice(0, 6).map(i => `<a class="ipor" href="${KSE(i.code)}" target="_blank" rel="noopener">
      <div class="d"><b>${md(i.listing)}</b>${i.days_to === 0 ? '今天' : i.days_to === 1 ? '明天' : i.days_to + ' 天後'}</div>
      <div>${detail(i)}</div>
      <div class="r"><div class="p">IPO 價</div>
           <div class="c">${i.ipo_price ? 'RM' + ppx(i.ipo_price) : '—'}</div></div></a>`).join('');
  const rc = ip.recent.filter(i => i.since_ipo != null).slice(0, 4).map(i => `<a class="ipor" href="${KSE(i.code)}" target="_blank" rel="noopener">
      <div class="d"><b>${md(i.listing)}</b>上市</div>
      <div>${detail(i)}</div>
      <div class="r"><div class="p">IPO ${ppx(i.ipo_price)}</div>
           <div class="p">現價 ${ppx(i.price)}</div>
           <div class="c ${cls(i.since_ipo)}">${pc(i.since_ipo)}</div></div></a>`).join('');
  const broke = ip.recent.filter(i => i.since_ipo != null && i.since_ipo < 0).length;
  const withP = ip.recent.filter(i => i.since_ipo != null).length;
  mcard('ipo', '馬股新股 IPO', `即將上市 ${ip.upcoming.length} 檔`,
    '<div class="ipo-note">全部是在馬來西亞交易所（Bursa Malaysia）掛牌的新股，價格單位是令吉（RM）。' +
    '創業板（ACE）是給成長型中小企業的板塊，風險比主板高。</div>' +
    (up ? '<div class="ipo-sec">即將上市</div>' + up : '') +
    (rc ? `<div class="ipo-sec">最近上市 · 上市後表現（${withP} 檔中 ${broke} 檔跌破 IPO 價）</div>` + rc : ''));
}

/* ---------- 今日重點 ----------
   每次更新後由 analyze.py 用規則挑出來的，不是全部列出來。
   點一下跳到那一檔。 */
// 把 2026-09-25 變成「9/25（五）」，並在是今天時直接說「今天」
// 馬來西亞當地日期（UTC+8），不依賴手機的時區設定
const mytToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);

// 報導時間在打開頁面的當下才算。資料檔裡的「3 小時前」是雲端抓資料那一刻算的，
// 兩三個小時後再看就不準了——所以有時間戳就用時間戳，只有日期的公告就用日期
function ago(n){
  if(n.ts){
    const h = (Date.now() / 1000 - n.ts) / 3600;
    // 即時新聞要看得出「12 分鐘前」和「50 分鐘前」的差別，不能一小時內都叫剛剛
    if(h < 1){ const m = Math.floor(h * 60); return m < 2 ? '剛剛' : m + ' 分鐘前'; }
    if(h < 24) return Math.floor(h) + ' 小時前';
  }
  const iso = n.date || (n.ts ? new Date(n.ts * 1000 + 8 * 3600e3).toISOString().slice(0, 10) : '');
  if(!iso) return n.when || '';
  const days = Math.round((Date.parse(mytToday()) - Date.parse(iso)) / 864e5);
  if(days <= 0) return '今天';
  if(days === 1) return '昨天';
  if(days < 30) return days + ' 天前';
  if(days < 365) return Math.floor(days / 30) + ' 個月前';
  return Math.floor(days / 365) + ' 年前';
}

// epoch 秒 → 馬來西亞時間「18:40」；不是今天就加上「9/29」
function hhmm(ts){
  const iso = new Date(ts * 1000 + 8 * 3600e3).toISOString();
  const day = iso.slice(0, 10);
  return (day === mytToday() ? '' : +day.slice(5, 7) + '/' + +day.slice(8, 10) + ' ') + iso.slice(11, 16);
}

function fmtWhen(iso){
  const parts = (iso || '').split('-').map(Number);
  if(parts.length !== 3) return iso || '';
  const [y, m, d] = parts;
  const today = mytToday();
  const wd = '日一二三四五六'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return (iso === today ? '今天 ' : '') + `${m}/${d}（${wd}）`;
}

function renderBrief(){
  const host = $('#brief');
  const hl = D.highlights || [];
  if(!hl.length){ host.innerHTML = ''; return; }

  let collapsed = false;
  try { collapsed = localStorage.getItem(BRIEF_KEY) === '1'; } catch(e) {}

  // 資料可能是前一個交易日的（週末、開盤前），所以標題不寫「今日」，
  // 直接標出資料截止時間，每條再各自帶自己的日期
  const cut = (D.updated_at || '').slice(0, 10);
  host.innerHTML = `<div class="brief">
    <div class="brief-h"><b>重點</b><span>${hl.length} 條 · 截至 ${cut}</span>
      <button class="tog" type="button">${collapsed ? '展開' : '收起'}</button></div>
    <div class="brief-list" ${collapsed ? 'hidden' : ''}>${hl.map((h, i) => `
      <div class="bi ${h.level} ${i >= BRIEF_TOP && !briefAll ? 'more' : ''}" data-go="${h.symbol}">
        <div class="bar"></div>
        <div class="bt">
          <div class="bw"><b>${h.name}</b> ${h.what}</div>
          ${h.why && ((h.kind || '').startsWith('類股') || h.level === 'critical') ? `<div class="by">${h.why}</div>` : ''}
          ${h.when ? `<div class="bwhen">${fmtWhen(h.when)}${h.kind ? ' · ' + h.kind : ''}</div>` : ''}
        </div>
        <div class="bn">${h.sector}</div>
      </div>`).join('')}
      ${hl.length > BRIEF_TOP ? `<button class="bmore" type="button">${briefAll ? '只看前 ' + BRIEF_TOP + ' 條' : '顯示全部 ' + hl.length + ' 條'}</button>` : ''}
    </div></div>`;

  const more = host.querySelector('.bmore');
  if(more) more.onclick = () => { briefAll = !briefAll; renderBrief(); };

  host.querySelector('.tog').onclick = () => {
    const list = host.querySelector('.brief-list');
    const now = !list.hidden;
    list.hidden = now;
    host.querySelector('.tog').textContent = now ? '展開' : '收起';
    try { localStorage.setItem(BRIEF_KEY, now ? '1' : '0'); } catch(e) {}
  };
  host.querySelectorAll('.bi').forEach(el => el.onclick = () => {
    const s = D.stocks.find(x => x.symbol === el.dataset.go);
    if(!s) return;
    if(isMobile()){ openSheet(s); return; }
    openSym = s.symbol; render();
    const row = [...document.querySelectorAll('tr.row')]
      .find(r => r.textContent.includes(s.symbol));
    if(row) row.scrollIntoView({block:'center', behavior:'smooth'});
  });
}

/* ---------- 市場脈搏 ----------
   挑四個最能代表「今天外面發生什麼事」的數字：

const PULSE = ['^KLSE', 'MPOB-CPO', 'MYR=X', 'SGDMYR=X'];

function renderPulse(){

function render(){
  renderPulse();
  renderHeadlines();
  renderBrief();
  renderWatch();
  renderMovers();
  renderIPO();
  $('#title').textContent = D.title;
  $('#updated').textContent = D.updated_at;
  paintFresh();

  $('#head').innerHTML = '<tr>' + COLS.map(c =>
    `<th data-k="${c.k}" class="c-${c.k}">${c.t}<span class="a">${
      sortKey===c.k ? (sortDir>0?'▲':'▼') : (c.t?'⇅':'')}</span></th>`).join('') + '</tr>';
  $('#head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = COLS.find(x=>x.k===th.dataset.k);
    if(c.nosort) return;
    if(sortKey===c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.dir || -1; }
    render();
  });

  const body = $('#body'); body.innerHTML = '';

  const pinned = favs.map(sym => D.stocks.find(s => s.symbol === sym)).filter(Boolean);

  // 分頁列：沒有最愛就不顯示那一頁
  const tabs = TABS.filter(t => t.t !== '最愛' || pinned.length);
  if(!tabs.some(t => t.t === activeTab)) activeTab = pinned.length ? '最愛' : '銀行';
  const countOf = t => t.secs === null ? pinned.length
                     : D.stocks.filter(s => t.secs.includes(s.sector)).length;
  $('#tabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.t===activeTab?'on':''}" type="button" data-t="${t.t}">${t.t}<span class="n">${countOf(t)}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    activeTab = b.dataset.t;
    try { localStorage.setItem(TAB_KEY, activeTab); } catch(e) {}
    openSym = null;
    // 刻意不捲動。原本會捲回最上面，但使用者往往是看到一半才換分頁，
    // 畫面突然跳走很惱人。切到較短的分頁時瀏覽器本來就會自己收斂位置。
    render();
  });

  const tab = tabs.find(t => t.t === activeTab);
  const groups = [];
  if(tab.secs === null){
    groups.push(['最愛', pinned]);
  } else if(activeTab === '全部'){
    // 只有「全部」需要把最愛釘到最上面；其他分頁本來就已經聚焦了
    if(pinned.length) groups.push(['最愛', pinned]);
    ORDER.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec && !isFav(s.symbol));
      if(list.length) groups.push([sec, list]);
    });
  } else {
    tab.secs.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec);
      if(list.length) groups.push([sec, list]);
    });
  }

  groups.forEach(([sec, group]) => {
    let list = group;

    if(sortKey && sec !== '最愛'){
      const g = COLS.find(c=>c.k===sortKey).sort;
      list = [...list].sort((a,b)=>{
        const av=g(a), bv=g(b);
        if(av==null) return 1; if(bv==null) return -1;
        return typeof av === 'string' ? sortDir*av.localeCompare(bv,'zh-Hant') : sortDir*(av-bv);
      });
    }

    const gr = document.createElement('tr');
    gr.className = 'group';
    gr.innerHTML = `<td colspan="${COLS.length}">${sec}</td>`;
    body.appendChild(gr);

    list.forEach(s => {
      const tr = document.createElement('tr');
      tr.className = 'row' + (openSym===s.symbol ? ' on' : '');
      tr.innerHTML = COLS.map(c=>`<td class="c-${c.k}">${c.cell(s)}</td>`).join('');
      tr.onclick = ev => {
        const star = ev.target.closest('.star');
        if(star){                              // 點星星只切換最愛，不展開
          ev.stopPropagation();
          toggleFav(star.dataset.fav);
          render();
          return;
        }
        if(isMobile()){ openSheet(s); return; }
        openSym = openSym === s.symbol ? null : s.symbol;
        render();
      };
      body.appendChild(tr);
      if(openSym === s.symbol && !isMobile()){
        const d = detailRow(s);
        body.appendChild(d);
        d._redraw();                         // 插入後才畫圖，這樣量得到實際寬度
        showStockLive(s);                    // 3 分鐘內抓過就直接用快取（已經畫在上面了）
      }
    });
  });
}

/* ---------- 點開才翻的內文翻譯 ----------
   批次在伺服器翻不可行：免費 API 在上百篇的量級會直接限流
   （實測 106 篇只成功 16 篇）。改成使用者點開哪篇才翻哪篇，
   用他自己的瀏覽器去打 API，翻完存在本機，再開就是即時的。 */

// 這些翻了會出錯，先換成佔位符保護（Bursa Malaysia 曾被翻成「馬來西亞交易所」）
const KEEP = ['Sentral REIT','IGB REIT','Pavilion REIT','Axis REIT','KLCCP',
  'Bursa Malaysia','Bank Negara','FBM KLCI','Maybank','CIMB','Public Bank',
  'Hong Leong','RHB','AmBank','AMMB','Alliance Bank','Bank Islam','Affin',
  'MBSB','MRCB','YTL','Gamuda','Sunway','Zetrix','Inari','ViTrox','Frontken',
  'TIME dotCom','Mah Sing','NVIDIA','Broadcom','Palantir','Nasdaq',
  'OPR','DPU','NPI','EPS','ROE','NIM','EPF','KWAP','REIT','REITs','GDP','RM'];

// 金融慣用語對照（由 translate.py 的 PHRASES 產生，兩邊一致）。
// 機器翻譯會把 bargain hunting 翻成「特價狩獵」、at opening 翻成「打開便宜貨」，
// 先換成佔位符、翻完再換成正確中文。
const PHRASES = [["what to expect on (Bursa Malaysia|Bursa|the market)", "\\1 盤前展望："], ["bargain[- ]hunting (emerges|returns|kicks in)", "逢低買盤進場"], ["bargain[- ]hunting", "逢低買盤"], ["profit[- ]taking", "獲利了結"], ["window[- ]dressing", "作帳行情"], ["foreign buying", "外資買盤"], ["foreign (funds|investors) (net )?(sold|sell|dumped)", "外資賣超"], ["foreign (funds|investors) (net )?(bought|buy)", "外資買超"], ["net (sellers|selling)", "賣超"], ["net (buyers|buying)", "買超"], ["at (the )?open(ing)?( bell)?", "開盤時"], ["at (the )?(mid-?day|midday) break", "午盤時"], ["at (the )?close(?! to)", "收盤時"], ["opens? sharply higher", "大幅開高"], ["opens? sharply lower", "大幅開低"], ["opens? slightly higher", "小幅開高"], ["opens? slightly lower", "小幅開低"], ["(ends?|closes?|finish(es)?) sharply higher", "大幅收高"], ["(ends?|closes?|finish(es)?) sharply lower", "大幅收低"], ["(ends?|closes?|finish(es)?) slightly higher", "小幅收高"], ["(ends?|closes?|finish(es)?) slightly lower", "小幅收低"], ["opens? higher", "開高"], ["opens? lower", "開低"], ["(ends?|closes?|finish(es)?) higher", "收高"], ["(ends?|closes?|finish(es)?) lower", "收低"], ["(retreats?|retreated|pulls? back) sharply", "大幅回落"], ["(falls?|fell|drops?|dropped|slides?|slid|slumps?|slumped) sharply", "大幅下跌"], ["(rises?|rose|climbs?|climbed|gains?|gained|jumps?|jumped) sharply", "大幅上漲"], ["(rebounds?|rebounded) sharply", "大幅反彈"], ["sharply", "大幅"], ["caution lingers", "謹慎情緒未退"], ["cautious sentiment", "謹慎情緒"], ["risk-off", "避險情緒"], ["risk-on", "風險偏好回升"], ["blue[- ]chips?", "藍籌股"], ["key index", "綜合指數"], ["benchmark index", "基準指數"], ["(rising|higher) (bond )?yields", "殖利率上升"], ["rate cut", "降息"], ["rate hike", "升息"], ["private placement", "私募配售"], ["rights issue", "附加股發行"], ["bonus issue", "紅股發行"], ["final (single[- ]tier )?dividend", "末期股息"], ["(first |second )?interim (single[- ]tier )?dividend", "中期股息"], ["special (single[- ]tier )?dividend", "特別股息"], ["single[- ]tier dividend", "單層股息"], ["dividend", "股息"], ["target price", "目標價"], ["upgrade[sd]?", "調升評級"], ["downgrade[sd]?", "調降評級"]].map(
  ([p, zh]) => [new RegExp('\\b' + p + '\\b', 'gi'), zh]);

// 翻完之後中文換中文（跟 translate.POST 同一份）：「外國拋售壓力」→「外資賣壓」
const POST = [["(外國|海外|外資)(投資者)?(的)?拋售(壓力)?", "外資賣壓"], ["拋壓壓力|拋售壓力", "賣壓"], ["逢低吸收", "逢低買盤"], ["(國外|海外|外國)銷售", "外資賣壓"], ["馬來西亞證券交易所|大馬交易所", "馬交所"]].map(([p, zh]) => [new RegExp(p, 'g'), zh]);

const TR_KEY = 'tr_cache';
function trCache(){
  try { return JSON.parse(localStorage.getItem(TR_KEY)) || {}; } catch(e) { return {}; }
}
function trSave(c){
  try {
    const keys = Object.keys(c);
    if(keys.length > 600) keys.slice(0, keys.length - 600).forEach(k => delete c[k]);   // 標題也存，120 則太快被擠掉
    localStorage.setItem(TR_KEY, JSON.stringify(c));
  } catch(e) {}
}
const trKey = t => t.length + '|' + t.slice(0, 60) + '|' + t.slice(-30);

function chunk(text, size = 450){
  const out = [];
  let buf = '';
  for(const sen of text.split(/(?<=[.!?])\s+/)){
    if(buf.length + sen.length > size && buf){ out.push(buf.trim()); buf = ''; }
    buf += sen + ' ';
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

async function gtranslate(part){
  const marks = [];
  let held = part;
  for(const [re, zh] of PHRASES){
    held = held.replace(re, (...m) => {
      const tok = 'ZZ' + marks.length + 'ZZ';
      // 對照表裡的 \\1 代表第一個括號，逐一代換
      marks.push(zh.replace(/\\(\d)/g, (_, n) => m[+n] || '').trim());
      return tok;
    });
  }
  for(const term of [...KEEP].sort((a, b) => b.length - a.length)){
    const re = new RegExp('\\b' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if(!re.test(held)) continue;
    const tok = 'ZZ' + marks.length + 'ZZ';
    held = held.replace(re, tok);
    marks.push(term);
  }
  // 兩個 Google 入口：clients5 比較不會被限流（跟 translate.py 同樣順序），失敗才換 gtx
  let zh = '';
  try {
    const data = await tfetchJSON('https://clients5.google.com/translate_a/t?client=dict-chrome-ex' +
                                  '&sl=en&tl=zh-TW&q=' + encodeURIComponent(held), {}, 10e3);
    zh = String(Array.isArray(data[0]) ? data[0][0] : data[0] || '');
  } catch(e) {
    const data = await tfetchJSON('https://translate.googleapis.com/translate_a/single' +
                                  '?client=gtx&sl=en&tl=zh-TW&dt=t&q=' + encodeURIComponent(held), {}, 10e3);
    zh = (data[0] || []).map(x => x[0]).filter(Boolean).join('');
  }
  // 佔位符必須原封不動回來，否則寧可放棄這一段
  if(!marks.every((_, i) => zh.includes('ZZ' + i + 'ZZ'))) throw new Error('專有名詞還原失敗');
  marks.forEach((term, i) => { zh = zh.split('ZZ' + i + 'ZZ').join(term); });
  for(const [re, to] of POST) zh = zh.replace(re, to);
  return zh.replace(/([，。、；：！？（）])\s+/g, '$1').trim();
}

/* 標題翻譯的後備：雲端批次翻譯偶爾被 Google 限流，標題就原樣留英文。
   打開畫面時把還是英文的標題在瀏覽器裡現翻（跟全文一樣存在手機上，下次不再翻）。
   一次只翻一則，遇到限流就停，不要連續打一堆請求。 */
const hasCJK = t => /[\u4e00-\u9fff]/.test(t || '');
// \u4e2d\u6587\u5831\u5c0e\uff1a\u5373\u6642\u6293\u7684\u6709\u6a19 lang\uff1bnews.json\uff0fklsescreener \u8f49\u4f86\u7684\u90a3\u4efd\u4e0d\u4e00\u5b9a\u6709\uff0c\u6a19\u984c\u662f\u4e2d\u6587\u5c31\u7b97
// \uff08\u4e0d\u7136\u5f48\u7a97\u6703\u628a\u7c21\u9ad4\u6a19\u984c\u653e\u5728\u300cENGLISH\u300d\u5e95\u4e0b\uff0c\u9084\u591a\u4e00\u9846\u6c92\u7528\u7684\u300c\u539f\u6587\u300d\uff09
const isZh = n => n.lang === 'zh' || (!n.lang && hasCJK(n.title));
// App \u88e1\u8b80\u5f97\u5230\u5168\u6587\uff1a\u5373\u6642\u6293\u7684\u4e2d\u6587\u5831\u5167\u6587\u5728 LIVE_BODY\uff0c\u96f2\u7aef\u7ffb\u597d\u7684\u5728 body_zh
const zhFull = n => LIVE_BODY.has(n.url) || !!n.body_zh;
// \u6a19\u984c\u5df2\u7d93\u6709\u50cf\u6a23\u7684\u4e2d\u6587\uff1a\u82f1\u6587\u8981\u7ffb\u6210\u4e2d\u6587\uff1b\u7c21\u9ad4\u8981\u8f49\u904e\uff08\u8f49\u5931\u6557\u6642\u96f2\u7aef\u6703\u539f\u6a23\u653e\u7c21\u9ad4\uff09
const goodZh = n => !!n.title_zh && (isZh(n) ? n.title_zh !== n.title : hasCJK(n.title_zh));
async function fillZh(root){
  for(const el of root.querySelectorAll('[data-en]')){
    const en = el.dataset.en;
    if(!en || hasCJK(el.dataset.zh)) continue;
    let zh;
    try { zh = await translateBody(en); } catch(e) { return; }
    if(!hasCJK(zh)) continue;
    el.dataset.zh = zh;
    const t = el.querySelector('.t, .it');
    if(t) t.textContent = zh;
    const im = el.querySelector('.im');
    if(im && !im.querySelector('.orig'))
      im.insertAdjacentHTML('beforeend', '<button class="orig" type="button">原文</button>');
  }
}

// 翻好的先記在記憶體：手機儲存空間滿了或被擋（無痕模式）時 localStorage 存不進去，
// 只靠它的話每次重畫都要重翻一次
const TR_MEM = new Map();
async function translateBody(text){
  const key = trKey(text);
  if(TR_MEM.has(key)) return TR_MEM.get(key);
  const hit = trCache()[key];
  if(hit){ TR_MEM.set(key, hit); return hit; }
  const parts = chunk(text);
  const out = [];
  for(const p of parts) out.push(await gtranslate(p));
  const zh = out.join('');
  TR_MEM.set(key, zh);
  const cache = trCache();                     // 重新讀一次，別蓋掉翻譯這段時間別處存進去的
  cache[key] = zh;
  trSave(cache);
  return zh;
}

/* 大馬中文報（星洲／南洋／中國報）的全文：搜尋 API 就附了完整內文，

function showZhArticle(item){

  dlg.scrollTop = 0;

/* ---------- 即時新聞 ----------
   9/29 銀行股連跌，頁面上卻看不出來：資料靠 GitHub 排程更新，
   實測「每 3 小時」的排程要 1.6～6.5 小時才真的跑一次，等資料進來早就收盤了。
   所以新聞另外走兩條路：
   1. news.json：伺服器端只抓新聞的工作（news 分支，約 5～15 分鐘一次），
      帶 Google News、Bursa 公告、漲跌排行、追蹤股的盤中報價
   2. 瀏覽器自己抓：星洲、南洋、中國報的搜尋 API，The Edge、Business Today
   打開頁面、切回前景、看著畫面時抓：大盤快訊每 3 分鐘，追蹤股票的類股／最愛查詢每 9 分鐘
   （每篇搜尋結果都附全文，一輪就是幾百 KB，手機流量吃不消）。
   任何一個來源失敗就當作沒有：不擋畫面、不跳錯誤。 */
const LIVE_MS = 180e3;
// 追蹤股票的查詢一次涵蓋一整週的報導，晚幾分鐘看到差別不大
const WATCH_MS = 540e3;
// 個股的快取比 3 分鐘短一點：refreshLive 先抓完大盤才輪到個股，兩輪之間會比 3 分鐘少幾秒，
// 快取若剛好 3 分鐘，每隔一輪就被「還沒過期」跳過，變成 6 分鐘才更新一次
const STOCK_MS = LIVE_MS - 30e3;
// api.github.com 推送後約 20 秒就拿得到新檔，但沒登入每小時只能 60 次；

const NEWS_RAW = 'https://raw.githubusercontent.com/evolee1100/stockchecker/news/news.json';

const LQ = new Map();                          // 每個查詢上一次成功的結果：「網站|關鍵字」→ {t, items}

// 逾時就放棄：手機訊號差時一個來源卡住，不能拖住其他來源。
// 計時一直算到內文讀完：以前表頭一到就停表，內文傳到一半卡住時 res.json() 永遠等不完，
// 整輪即時更新跟著卡死（liveBusy 一直是 true，之後每一輪都被跳過）
async function tfetchJSON(url, opt = {}, ms = 8000){
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const res = await fetch(url, {...opt, signal: ac.signal});
    if(!res.ok) throw Object.assign(new Error('回應 ' + res.status), {status: res.status});
    return await res.json();
  } catch(e) {
    if(ac.signal.aborted) throw new Error('逾時');
    throw e;
  } finally { clearTimeout(t); }
}

// HTML 實體（&amp;、&#8217;）與殘留標籤轉成純文字
function plain(html){
  const s = String(html || '').replace(/<br\s*\/?>|<\/p>/gi, '\n');
  if(!/[<&]/.test(s)) return s;
  return new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
}

const normT = t => (t || '').toLowerCase().replace(/[^0-9a-z一-鿿]/g, '');
const tsOf = n => n.ts || (n.date ? Date.parse(n.date + 'T00:00:00+08:00') / 1000 || 0 : 0);
// 出版社名稱各來源寫法不同：「BusinessToday Malaysia」「businesstoday.com.my」「Business Today」是同一家
const pubOf = s => String(s || '').toLowerCase().replace(/\.com|\.my|www\.|malaysia/g, '').replace(/[^0-9a-z一-鿿]/g, '');
// WordPress 網址的最後一段就是原本的標題（stock-today-maybank-holds-steady-…）。
// Google News 那份只有轉址網址，對方事後改了標題時，拿這段還對得上
function slugOf(u){
  try {
    const seg = new URL(u).pathname.split('/').filter(Boolean).pop() || '';
    return /^[a-z0-9]+(-[a-z0-9]+){3,}$/.test(seg) ? normT(seg) : '';
  } catch(e) { return ''; }
}
// 判斷「同一篇」用的鍵：網址、標題（原文、中譯、網址裡的標題）；
// 另外「同一家、同一秒發的」也算，但標題要夠像（p: 開頭，見 dedupe），免得同一秒排程發出的兩篇被併掉。
// 公告只看網址：EPF 每週的持股變動標題一模一樣，但每一則都是不同的申報
function dupKeys(n, urlOnly){
  const ks = [n.url, n.source_url];
  if(!urlOnly){
    for(const t of [normT(n.title), normT(n.title_zh), slugOf(n.url), slugOf(n.source_url)]) if(t) ks.push('t:' + t);
    if(n.ts && n.source) ks.push('p:' + pubOf(n.source) + '|' + Math.round(n.ts));
  }
  return ks.filter(Boolean);
}
const words = n => new Set(String(n.title || '').toLowerCase().match(/[a-z0-9]{3,}|[一-鿿]{2}/g) || []);
function near(a, b){
  const A = words(a), B = words(b);
  let c = 0;
  A.forEach(w => { if(B.has(w)) c++; });
  return c > 0 && c >= 0.5 * Math.min(A.size, B.size);
}
// 同一篇的兩份併成一份，不是丟掉後來那份：data.js 那份常有內文、中譯、持股變動（move），
// news.json 那份沒有；即時抓的中文報那份網址對得到 LIVE_BODY，App 裡才讀得到全文。
// 所以有全文的即時中文報當底，其餘欄位哪一份有就用哪一份
const FILL = ['title_zh', 'body', 'body_zh', 'move', 'source_url', 'source_zh', 'ts', 'date', 'when', 'lead', 'tax', 'stocks'];
const blank = v => v == null || v === '' || (Array.isArray(v) && !v.length);
function mergeItem(a, b){
  const full = n => isZh(n) && LIVE_BODY.has(n.url);
  if(full(b) && !full(a)) [a, b] = [b, a];
  const m = {...a};
  for(const k of FILL) if(blank(m[k]) && !blank(b[k])) m[k] = b[k];
  // 留下的是 Google News 轉址那份：另一份的網址就是原站，「開啟來源網頁」直接去那裡
  if(!m.source_url && /news\.google\.com/.test(m.url) && b.url && !/news\.google\.com/.test(b.url)) m.source_url = b.url;
  if(!goodZh(m) && goodZh(b)) m.title_zh = b.title_zh;
  if(!m.lang && b.lang) m.lang = b.lang;
  if(b.live) m.live = true;
  return m;
}
// 同一篇常會從兩個來源進來（Google News 和 The Edge 各一份、data.js 和 news.json 各一份）
function dedupe(list, urlOnly){
  const at = new Map(), out = [];
  for(const n of list){
    const ks = dupKeys(n, urlOnly);
    let i = -1;
    for(const k of ks){
      if(!at.has(k)) continue;
      const j = at.get(k);
      if(k.startsWith('p:') && !near(out[j], n)) continue;
      i = j;
      break;
    }
    if(i < 0){ i = out.length; out.push(n); }
    else out[i] = mergeItem(out[i], n);
    ks.forEach(k => { if(!at.has(k)) at.set(k, i); });
  }
  return out;
}
const newest = (list, urlOnly) => dedupe(list, urlOnly).sort((a, b) => tsOf(b) - tsOf(a));

/* 大馬三家中文報的搜尋 API（允許跨網域，瀏覽器可以直接打）。
   注意：它們的搜尋是「每個關鍵字都要出現」——寫 A OR B 時 OR 被當停用字丟掉，
   實測「MAYBANK OR ZETRIX」只回同時提到兩家的文章。所以一次只查一個詞。
   單一關鍵字時照時間新到舊排，一頁 10 篇，每篇附完整內文（簡體）。 */
const SITES = {
  sinchew:    {api: 'https://searchapi.sinchew.com.my/full-search',    host: 'www.sinchew.com.my',    name: '星洲日報'},
  nanyang:    {api: 'https://search.enanyang.my/full-search',          host: 'www.enanyang.my',       name: '南洋商報'},
  chinapress: {api: 'https://searchapi.chinapress.com.my/full-search', host: 'www.chinapress.com.my', name: '中國報'},
};
async function liveSearch(site, kw){
  const S = SITES[site];
  const data = await tfetchJSON(S.api, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: 'a1', params: {query_string: kw, query_from: 0}})});
  return ((data.hits && data.hits.hits) || []).map(h => h._source || {})
    .filter(x => x.post_id && x.post_title && x.post_date)
    .map(x => {
      const url = `https://${S.host}/?p=${x.post_id}`;
      const body = plain(x.post_content).split('\n').map(p => p.trim()).filter(Boolean).join('\n');
      if(body) LIVE_BODY.set(url, body);
      return {title: plain(x.post_title).replace(/\s+/g, ' ').trim(), url, source: S.name,
              ts: Math.floor(Date.parse(x.post_date) / 1000) || null,   // post_date 是 UTC
              tax: x.tax || [], lead: body.slice(0, 300), lang: 'zh', live: true};
    });
}
// 分類裡有「财经」才算財經新聞（同一個 KLCC 也可能是購物中心的社會新聞）
const isFin = n => (n.tax || []).some(t => String(t).includes('财经'));

// The Edge 的「Corporate」最新消息：沒有搜尋，但更新最快（約 15 分鐘內）
