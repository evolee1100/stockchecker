});
paintLang();
if(isEn()) startEnglish().catch(() => {});       // 開頁就是英文：字典在背景載，畫面先出來

/* ---------- Google 翻譯（批次）----------
   clients5 一次可以送好幾個 q，一個請求就處理完一批；網址控制在 6000 字元內（中文編碼後一個字佔 9 個字元）。
   兩個用途：中文報的簡轉繁（zh-CN→zh-TW）、英文模式的機器翻譯（auto→en，簡體繁體都進得來）。 */
const GT = (sl, tl) => 'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=' + sl + '&tl=' + tl;
async function gBatch(texts, sl, tl, fix = t => t){
  const base = GT(sl, tl);
  const batches = [];
  let cur = [], len = base.length;
  texts.forEach((t, i) => {
    const q = encodeURIComponent(t).length + 3;
    if(cur.length && len + q > 5800){ batches.push(cur); cur = []; len = base.length; }
    cur.push(i); len += q;
  });
  if(cur.length) batches.push(cur);
  const out = new Array(texts.length);
  let ok = 0;
  await Promise.all(batches.map(async idx => {
    try {
      const data = await tfetchJSON(base + idx.map(i => '&q=' + encodeURIComponent(texts[i])).join(''));
      idx.forEach((i, j) => {
        const v = Array.isArray(data) ? data[j] : null;
        const s = Array.isArray(v) ? v[0] : v;   // sl=auto 時每項是 [譯文, 偵測到的語言]
        if(typeof s === 'string' && s) out[i] = fix(s);
      });
      ok++;
    } catch(e) {}                                // 一批失敗，其他批照用
  }));
  if(!ok && texts.length) throw new Error('翻譯失敗');
  return out;
}

/* ---------- 簡體轉繁體 ----------
   中文報是簡體，使用者看繁體。zh-TW 會順便「在地化」，把 Bursa 的「主板」改成電腦的「主機板」，改回來 */
const twFix = t => t.replace(/主機板/g, '主板');
const s2tBatch = texts => gBatch(texts, 'zh-CN', 'zh-TW', twFix);

// 標題：轉好的直接套上去，同時記在記憶體；localStorage 只是讓下次打開不用再轉的快取
// （跟翻譯共用，鍵值加 s2t| 前綴）。以前是存進去再讀出來，手機儲存空間滿了或被擋時一個都存不進去，
// 標題全部留在簡體，而且每 3 分鐘重送同一批。轉不成就顯示簡體。
// 只處理還沒轉好的：news.json 帶來的多半已經是繁體
const S2T_MEM = new Map();
async function tradTitles(items){
  const want = items.filter(n => isZh(n) && !goodZh(n));
  if(!want.length) return;
  if(isEn()) return;                             // 英文模式：簡體標題留著，畫面上的觀察器會直接翻成英文
  const c = trCache();
  const hit = t => S2T_MEM.get(t) || c['s2t|' + t];
  const need = [...new Set(want.map(n => n.title).filter(t => !hit(t)))];
  if(need.length){
    try {
      const zh = await s2tBatch(need);
      const save = trCache();                      // 重新讀一次，別蓋掉這段時間別處存進去的翻譯
      need.forEach((t, i) => { if(zh[i]){ S2T_MEM.set(t, zh[i]); save['s2t|' + t] = zh[i]; } });
      trSave(save);
    } catch(e) {}
  }
  want.forEach(n => { n.title_zh = hit(n.title) || n.title; });
}

// 全文：點開才轉，一段一個 q，太長的段落在句號處切開；只記在記憶體（全文太大，不佔手機儲存空間）
const bodyTW = new Map();
async function tradBody(key, text){
  if(isEn()) return text;                        // 英文模式：不轉繁體，段落畫出來後由觀察器翻成英文
  if(bodyTW.has(key)) return bodyTW.get(key);
  const pieces = [];
  text.split('\n').filter(Boolean).forEach((p, k) => {
    let buf = '';
    const push = () => { for(let i = 0; i < buf.length; i += 600) pieces.push({k, t: buf.slice(i, i + 600)}); buf = ''; };
    for(const sen of p.split(/(?<=[。！？；])/)){
      if(buf && buf.length + sen.length > 500) push();
      buf += sen;
    }
    if(buf) push();
  });
  const zh = await s2tBatch(pieces.map(x => x.t));
  const paras = [];
  pieces.forEach((x, i) => { paras[x.k] = (paras[x.k] || '') + (zh[i] || x.t); });
  const out = paras.filter(Boolean).join('\n');
  bodyTW.set(key, out);
  return out;
}

/* ---------- 追蹤股票的中文稱呼 ----------
   中文報內文會寫「马银行（MAYBANK,1155,主板金融）」，所以 Bursa 簡稱（sa）最準，
   再加上每檔的簡體稱呼（zh，例如「马银行」「大众银行」）和英文別名（aliases）——
   fetch.py 從 watchlist.json 帶進 data.js。舊版 data.js 沒有這兩欄時就只用 Bursa 簡稱查，照樣能用。
   （以前會另外去抓同網址的 watchlist.json 補，但線上網站沒有部署這個檔，每次都 404） */
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// 第一次被提到的位置（沒提到是 -1）。英文簡稱要整個字比對（MPI 不能配到 MPIB）；中文稱呼直接找子字串
function mentionAt(text, keys){
  let best = -1;
  for(const k of keys){
    let i;
    if(/^[\x20-\x7e]+$/.test(k)){
      const m = new RegExp('(^|[^A-Za-z0-9])' + reEsc(k) + '(?![A-Za-z0-9])', 'i').exec(text);
      i = m ? m.index + m[1].length : -1;
    } else i = text.indexOf(k);
    if(i >= 0 && (best < 0 || i < best)) best = i;
  }
  return best;
}
// 中文報的比對要嚴一點，實測踩過的誤判：
// - 「大马银行业」同時含「马银行」「大马银行」，其實講的是銀行業——後面接「业」的不算
// - 「联昌证券下调评级」是分析機構在評別家公司——後面接证券／研究／投行的不算
// - 「伊斯兰银行与金融服务」是泛稱——內文裡的稱呼要緊接括號（「马银行（MAYBANK，1155，…）」
//   這種帶代號的正式介紹）才算；標題裡出現就算
// 另外「MAYBANK,1155」「MAYBANK，1155」這種代號標記最準，出現在標題或開頭都算。
const NOT_CO = /^(业|证券|研究|投行)/;
function cnAt(n, s){
  const sa = /\.KL$/.test(s.symbol) ? s.sa : null;
  const code = s.symbol.replace(/\.KL$/, '').replace(/SS$/, '');
  const text = n.title + '\n' + n.lead;
  let best = -1;
  const take = i => { if(best < 0 || i < best) best = i; };
  if(sa){
    const m = new RegExp(reEsc(sa) + '\\s*[,，]\\s*' + code).exec(text);
    if(m) take(m.index);
  }
  for(const k of [sa, ...(s.zh || [])].filter(k => k && k.length >= 2)){
    const ascii = /^[\x20-\x7e]+$/.test(k);
    const re = ascii ? new RegExp('(^|[^A-Za-z0-9])' + reEsc(k) + '(?![A-Za-z0-9])', 'gi')
                     : new RegExp('()' + reEsc(k), 'g');
    for(let m; (m = re.exec(text));){
      const i = m.index + m[1].length, after = text.slice(i + k.length);
      if(!NOT_CO.test(after) && (i < n.title.length || /^[（(]/.test(after))){ take(i); break; }
    }
  }
  return best;
}
// 英文（The Edge、Business Today）：簡稱或英文別名出現在標題或摘要開頭
const stockAt = (n, s) => n.lang === 'zh' ? cnAt(n, s)
  : mentionAt(n.title + '\n' + (n.lead || ''), [/\.KL$/.test(s.symbol) ? s.sa : '', ...(s.aliases || [])]
      .filter(k => k && k.length >= 2));
// 沒點名哪一檔、但整篇在講銀行股／產托的（例如 9/29「债券回酬率急升 银行股节节败退」），標成類股
const SECTOR_TAGS = [[/银行/, /央行|国行|中央银行|日本银行|世界银行|开发银行|投资银行/, '銀行股'],
                     [/产托|产业信托/, null, 'REIT']];


/* ---------- 市場快訊 + 追蹤股票最新 ----------
   大盤：星洲、南洋的「马股」和 The Edge，每 3 分鐘抓。
   追蹤股票用 Bursa 的行業標記查：三家內文都會寫「（MAYBANK,1155,主板金融）」這種代號，
   查「主板金融」就是最新的金融股新聞（銀行全在這一類），照時間排，一次就涵蓋 12 檔銀行。
   各家寫法不同：星洲「主板金融」、南洋「主板金融股」、中國報「主要板金服」。
   另外星號最愛的前 3 檔各查一次（星洲內文一定附代號）。這幾個 9 分鐘才重抓，中間沿用上一次的結果。
   每個查詢的結果各自留著：某一個這輪失敗，就用它上一次成功的，不會整塊消失 */
const favKws = () => favs.map(sym => D.stocks.find(s => s.symbol === sym))
  .filter(s => s && /\.KL$/.test(s.symbol) && s.sa).slice(0, 3).map(s => s.sa);
async function liveMarket(){
  try {
    const Q = [
      ['sinchew', '马股'], ['nanyang', '马股'], ['edge', ''],
      ['sinchew', '主板金融', 1], ['nanyang', '主板金融股', 1], ['chinapress', '主要板金服', 1],
      ...favKws().map(k => ['sinchew', k, 1]),
    ];
    const key = q => q[0] + '|' + q[1];
    const now = Date.now();
    const due = q => { const c = LQ.get(key(q)); return !c || !q[2] || now - c.t >= WATCH_MS - 30e3; };
    let ok = 0;
    await Promise.all(Q.filter(due).map(async q => {
      try {
        const items = q[0] === 'edge' ? await edgeLatest() : await liveSearch(q[0], q[1]);
        LQ.set(key(q), {t: Date.now(), items});
        ok++;
      } catch(e) {}                                 // 這個查詢失敗：沿用它上一次的結果
    }));
    const got = q => (LQ.get(key(q)) || {}).items || [];
    const [sc, ny, edge] = Q.slice(0, 3).map(got);
    const rest = Q.slice(3).flatMap(got);
    LIVE.watchOk = Q.slice(3).some(q => LQ.has(key(q)));

    const week = Date.now() / 1000 - 7 * 864e2;
    const recent = n => (n.ts || 0) > week;
    // The Edge 的 Corporate 大多是個別公司的人事、改名，不算「大盤」：
    // 只有講大盤、令吉、國行的放進快訊；提到追蹤股票的放到「追蹤股票最新」
    const edgeMkt = /\b(FBM KLCI|KLCI|Bursa|ringgit|Bank Negara|OPR)\b/i;
    const market = [...sc, ...ny].filter(n => isFin(n) && recent(n))
      .concat(edge.filter(n => recent(n) && edgeMkt.test(n.title)));
    const wl = D.stocks.filter(s => /\.KL$/.test(s.symbol) && s.sa);
    const watch = [];
    for(const n of dedupe([...sc, ...ny, ...rest, ...edge])){
      if(!recent(n) || (n.lang === 'zh' && !isFin(n))) continue;
      // 只看標題和開頭：後面順帶一提的不算。越早被提到的越是主角——
      // 「豐隆淨利新高」要標豐隆，不是後面順帶比較的馬銀行
      let hit = wl.map(s => ({s, at: stockAt(n, s)})).filter(x => x.at >= 0)
                  .sort((a, b) => a.at - b.at).map(x => x.s);
      if(!hit.length && n.lang === 'zh'){
        const sec = SECTOR_TAGS.find(([re, not]) => re.test(n.title) && !(not && not.test(n.title)));
        if(sec) hit = [{name: sec[2]}];
      }
      if(hit.length) watch.push({...n, stocks: hit});
    }
    if(!ok) return;                                   // 這一輪全部失敗：畫面留著上一輪的
    // 跟上一輪是同一批文章：沿用上一輪的（已經轉好繁體），不用再轉；卡片內容沒變也不會重畫
    const sig = [...market, ...watch].map(n => n.url + '|' + (n.stocks || []).map(s => s.name).join()).join('\n');
    if(sig !== LIVE.sig){
      await tradTitles([...market, ...watch]);
      Object.assign(LIVE, {market, watch, sig});
    }
    LIVE.at = Date.now();
    liveTs = Math.floor(Date.now() / 1000);
  } finally {
    LIVE.tried = true;
    keepScroll(() => { renderHeadlines(); renderWatch(); paintFresh(); });
  }
}

/* ---------- 個股的即時新聞 ----------
   打開一檔（桌機展開列、手機面板）時才查，結果併進「媒體報導」，標上「即時」。 */
function showStockLive(s){
  // 先看是不是正在抓：開抓時就記了時間，順序反過來的話抓到一半會被當成「剛抓過」
  if(stockPending.has(s.symbol)) return stockPending.get(s.symbol);
  const c = stockLive.get(s.symbol);
  if(c && Date.now() - c.t < STOCK_MS) return Promise.resolve();
  const prev = c ? c.items : [];
  // 開始抓的時間就記下來（見 STOCK_MS）；新的回來之前先沿用上一輪的
  const t = Date.now();
  stockLive.set(s.symbol, {t, items: prev});
  const p = fetchStockLive(s, prev, items => {
    stockLive.set(s.symbol, {t, items});
    paintFeeds(s);
  }).catch(() => {}).finally(() => stockPending.delete(s.symbol));
  stockPending.set(s.symbol, p);
  return p;
}

// 中文報三家通常 0.2 秒就回來，先畫；Business Today 的搜尋常要 3～8 秒，
// 只等它 3 秒，回來了再併進去——以前四個一起等，面板開了七、八秒都看不到即時新聞
async function fetchStockLive(s, prev, publish){
  const bursa = /\.KL$/.test(s.symbol) && !!s.sa;
  const zh = (s.zh || []).filter(Boolean), al = (s.aliases || []).filter(Boolean);
  const kw = bursa ? s.sa : zh[0];
  if(!kw) return;                                     // 匯率、海外指數：大馬中文報沒有對應的稱呼
  const got = new Map();                              // 來源名稱 → 這一輪抓到的（失敗是 null）
  const run = (name, p) => p.then(r => { got.set(name, r); }, () => { got.set(name, null); });
  const cn = Promise.all([
    run(SITES.sinchew.name, liveSearch('sinchew', kw)),
    run(SITES.nanyang.name, liveSearch('nanyang', kw)),
    // 中國報的搜尋偏重標題，用中文稱呼查比較準
    run(SITES.chinapress.name, liveSearch('chinapress', zh[0] || kw)),
  ]);
  const bt = bursa && al[0] ? run(BT_NAME, btSearch(al[0], 6000)) : null;
  const since = Date.now() / 1000 - 90 * 864e2;
  let done = -1;
  const out = async () => {
    // 全部失敗（例如訊號斷了）：不要把上一輪抓到的清掉
    if(![...got.values()].some(Boolean)) return;
    done = got.size;
    // 某個來源這一輪失敗或還沒回來，先沿用它上一輪的那幾則
    const all = [...got.values()].filter(Boolean).flat().concat(prev.filter(n => !got.get(n.source)));
    const keep = dedupe(all).filter(n => (n.ts || 0) > since &&
      (n.lang === 'zh' ? isFin(n) && cnAt(n, s) >= 0 : stockAt(n, s) >= 0));
    await tradTitles(keep);
    publish(keep);
  };
  await cn;
  await out();
  if(bt){ await bt; if(got.size > done) await out(); }
}

// 媒體報導 = 雲端資料 + 即時抓到的，照時間排，最多 10 則
function stockArticles(s){
  const c = stockLive.get(s.symbol);
  return newest([...(s.articles || []), ...(c ? c.items : [])]).slice(0, 10);
}

// 只重畫報導和公告兩塊，圖表、試算都不動。
// 內容沒變就不換；有變的話，正在讀的那一行留在原位（手機面板是自己捲動的，要補的是 .sheet-in）
function paintFeeds(s){
  const put = (root, sel, html) => {
    const el = root.querySelector(sel);
    if(!el || el._html === html) return false;
    el._html = html;
    el.innerHTML = html;
    return true;
  };
  const paint = root => {
    const a = put(root, '[data-feed="a"]', feed(stockArticles(s), NO_ARTICLES));
    const f = put(root, '[data-feed="f"]', feed(groupFilings(s.filings), NO_FILINGS));
    if(!a && !f) return;
    // 使用者切到「原文」的話，新換上的條目也照原文顯示
    root.querySelectorAll('.seg button.on[data-l="en"]').forEach(b => b.click());
    fillZh(root);
  };
  if(sheetSym === s.symbol)
    keepScroll(() => paint(document.getElementById('sh-body')), document.querySelector('.sheet-in'));
  if(openSym === s.symbol && !isMobile()){
    const d = document.querySelector('tr.detail');
    if(d) keepScroll(() => paint(d));
  }
}

/* ---------- news.json（伺服器端的新聞工作）---------- */
const dataTs = () => {
  const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})/.exec(D.updated_at || '');
  return m ? Date.parse(m[1] + 'T' + m[2] + '+08:00') / 1000 : 0;
};
const okItem = x => x && typeof x.title === 'string' && typeof x.url === 'string';

// 比 data.js 新才併進去；同一份 news.json 不重複處理。
// 同一篇兩邊都有時 dedupe 會把兩份併成一份（data.js 的內文、中譯不會被 news.json 那份蓋掉）
function mergeNews(n){
  if(!n || typeof n.ts !== 'number' || n.ts <= newsTs) return false;
  newsTs = n.ts;
  if(n.ts <= dataTs()) return false;
  const M = D.market = D.market || {};
  if(Array.isArray(n.headlines))
    M.headlines = newest([...n.headlines.filter(okItem), ...(M.headlines || [])]).slice(0, 12);
  for(const [sym, x] of Object.entries(n.stocks || {})){
    const s = D.stocks.find(y => y.symbol === sym);
    if(!s || !x) continue;
    if(Array.isArray(x.articles))
      s.articles = newest([...x.articles.filter(okItem), ...(s.articles || [])]).slice(0, 10);
    if(Array.isArray(x.filings))
      s.filings = newest([...x.filings.filter(okItem), ...(s.filings || [])], true).slice(0, 20);
  }
  // 漲跌排行整份換掉，不是把欄位疊上去：收盤後的 news.json 沒有 live/time，
  // 疊上去的話會留著 data.js 下午的 live:true，收盤排行被標成「今天盤中 15:34」
  // 但伺服器抓報價失敗時會沿用上一輪的排行：日期比手上這份舊就不換，免得新的被舊的蓋掉
  const mv = n.movers;
  if(mv && Array.isArray(mv.up) && Array.isArray(mv.down) &&
     (!M.movers || (mv.as_of || '') >= (M.movers.as_of || ''))) M.movers = mv;
  // 盤中報價：只改現價和今日漲跌，走勢圖（series）不動
  for(const [sym, q] of Object.entries(n.quotes || {})){
    const s = D.stocks.find(y => y.symbol === sym);
    if(!s || !q || typeof q.price !== 'number') continue;
    const t = q.ts || n.ts;
    const mt = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(s.market_time || '')
      ? Date.parse(s.market_time.replace(' ', 'T') + ':00+08:00') / 1000 : 0;
    if(t <= mt) continue;                                // data.js 的報價比較新就不動
    s.price = q.price;
    if(typeof q.change_pct_1d === 'number') s.change_pct_1d = q.change_pct_1d;
    s.live = true;
    s.live_ts = t;
  }
  return true;
}

// news 分支建立過一次就記住，之後不再先查
const NEWS_REF = 'https://api.github.com/repos/evolee1100/stockchecker/git/matching-refs/heads/news';
// 讀 news.json 的方式（為了 iPhone Safari 與手機流量）：
// 1. 先問 GitHub API「news 分支現在指向哪個 commit」——回應只有幾百 bytes。
// 2. commit 沒變就不下載；變了才去 raw.githubusercontent.com/<commit>/news.json 抓整份（約 280 KB）。
//    commit 網址每次都不同，CDN 不可能給舊檔；而且是普通 GET、不佔 API 每小時 60 次的額度。
// 3. 跨網域請求一律不設 fetch 的 cache 選項：Safari 會因此加上 Cache-Control／Pragma 標頭，
//    變成要先做 CORS 預檢，而 raw 的預檢一律 403、API 的預檢不允許這兩個標頭 → iPhone 上整個讀不到
//    （電腦上的 Chrome 測不出來）。改在網址加 t= 讓手機自己的快取失效。
// API 被限流（同一個 IP 每小時 60 次；電信共用 IP 時可能更早用完）就退回 raw 的分支網址（CDN 最多 5 分鐘舊）。
let newsSha = '';
async function loadNews(){
  if(Date.now() < newsWait) return;
  let sha = null;
  if(Date.now() >= apiWait){
    try {
      const refs = await tfetchJSON(NEWS_REF + '?t=' + Date.now());
      const r = Array.isArray(refs) && refs.find(x => x.ref === 'refs/heads/news');
      if(!r){ newsWait = Date.now() + 15 * 60e3; return; }   // 伺服器工作還沒跑過，分支還不存在
      sha = (r.object && r.object.sha) || null;
    } catch(e) {
      if(e.status === 403 || e.status === 429) apiWait = Date.now() + 15 * 60e3;
    }
  }
  if(sha && sha === newsSha){ keepScroll(paintFresh); return; }   // 伺服器沒有新檔
  let n;
  try {
    n = await tfetchJSON(sha ? 'https://raw.githubusercontent.com/evolee1100/stockchecker/' + sha + '/news.json'
                             : NEWS_RAW + '?t=' + Date.now());
  } catch(e) { return; }
  if(sha) newsSha = sha;
  await applyNews(n);
}

async function applyNews(n){
  if(!mergeNews(n)){ keepScroll(paintFresh); return; }
  // 伺服器那邊簡轉繁失敗時，中文報標題會原樣是簡體：這裡補轉（轉好的都跳過，不會多發請求）
  const M = D.market || {};
  await tradTitles([...(M.headlines || []), ...D.stocks.flatMap(s => s.articles || [])]);
  keepScroll(render);                                  // render 裡含 paintFresh
  const s = sheetSym && D.stocks.find(x => x.symbol === sheetSym);
  if(s){ sheetBar(s); paintFeeds(s); }                 // 開著的面板就地更新
}

/* 上面的東西變高變矮時，讓正在讀的那一行留在原位（iOS Safari 不會自動 scroll anchoring）。
   以前只認「頂端已經捲到畫面上 1/3 的整張卡片」，讀者在看的「重點」頂端若在畫面 45%，
   就沒有錨點，快訊卡長高 400px 時整段被推出畫面。
   現在直接看畫面 40% 高度那一點是什麼，取它所在的那一則／那一列，重畫後把它捲回原本的位置。
   那一則若被重畫換掉了：先用網址找回同一則，找不到就用它在區塊裡的位置。
   box：手機的個股面板自己會捲，傳 .sheet-in；沒給就是整頁。 */
const BLOCK = '.item, .hl, .bi, .bmore, .hl-note, .mvr, .mv-h, .mv-note, .ipor, .ipo-sec, .ipo-note, ' +
              '.mcard-h, .brief-h, .pu, .tab, tr, h4, .dg-r, .calc, .chart, .ranges, .readout, .dnote, .chips, ' +
              '.anb, .anr, .an-note, .an-warn, .an-txt > p, .an-ol > li, .an-head > div, .an-src li';
function pinAt(box){
  const r = box ? box.getBoundingClientRect() : null;
  const x = r ? r.left + r.width / 2 : innerWidth / 2;
  const y = r ? r.top + r.height * 0.4 : innerHeight * 0.4;
  // 面板或彈窗蓋在上面時，整頁要找的是蓋在底下的東西
  const scope = box || document.querySelector('.wrap');
  const hit = document.elementsFromPoint(x, y).find(e => e !== scope && scope.contains(e));
  if(!hit) return null;
  let el = hit.closest(BLOCK);
  if(!el || !scope.contains(el)) el = hit;
  const host = el.closest('[id], [data-feed]');       // 重畫時換掉的是它的內容，它本身還在
  const path = [];
  for(let e = el; host && e !== host; e = e.parentElement) path.unshift([...e.parentElement.children].indexOf(e));
  return {el, host, hostId: host && host.id, path, url: el.dataset.url || '', top: el.getBoundingClientRect().top};
}
function pinFind(p){
  if(p.el.isConnected) return p.el;
  const host = p.host && p.host.isConnected ? p.host : p.hostId ? document.getElementById(p.hostId) : null;
  if(!host) return null;
  if(p.url){
    const same = [...host.querySelectorAll('[data-url]')].find(e => e.dataset.url === p.url);
    if(same) return same;
  }
  let e = host;
  for(const i of p.path){
    const c = e.children[Math.min(i, e.children.length - 1)];
    if(!c) break;
    e = c;
  }
  return e;
}
function keepScroll(fn, box){
  // 還在最上面（沒開始往下讀）就不用顧：新東西本來就該出現在眼前
  const p = (box ? box.scrollTop : scrollY) > 0 ? pinAt(box) : null;
  fn();
  if(!p) return;
  const el = pinFind(p);
  if(!el || !el.isConnected) return;
  const d = el.getBoundingClientRect().top - p.top;
  if(Math.abs(d) < 1) return;
  if(box) box.scrollTop += d; else scrollBy(0, d);
}

// 報頭：「新聞 18:40 更新」——取 news.json 與瀏覽器即時抓取兩者較新的時間
function paintFresh(){
  const el = document.getElementById('fresh');
  const t = Math.max(newsTs, liveTs);
  if(el) el.textContent = t ? '新聞 ' + hhmm(t) + ' 更新' : '';
}

// liveBusy 記的是這一輪開始的時間。通常幾秒就跑完；卡住超過 30 秒（訊號時有時無）就不等它，
// 否則一直是「忙碌中」，之後每一輪都直接跳過，即時新聞從此停住、也不會有任何錯誤訊息
let liveBusy = 0, liveLast = 0;
async function refreshLive(){
  if(!D || (liveBusy && Date.now() - liveBusy < 30e3)) return;
  const me = liveBusy = Date.now();
  liveLast = Date.now();
  try {
    await Promise.all([loadNews().catch(() => {}), liveMarket().catch(() => {})]);
    const sym = sheetSym || (!isMobile() && openSym);
    const s = sym && D.stocks.find(x => x.symbol === sym);
    if(s) await showStockLive(s);
  } finally { if(liveBusy === me) liveBusy = 0; }
}
// 只在看得到頁面時抓：背景分頁不浪費流量，也不吃 GitHub 每小時 60 次的額度。
// 每 30 秒看一次「距離上次是否滿 3 分鐘」，比直接 setInterval(3 分鐘) 耐得住背景節流
setInterval(() => {
  if(document.visibilityState === 'visible' && Date.now() - liveLast >= LIVE_MS - 10e3) refreshLive();
}, 30e3);
// 從別的 App 切回來（超過 1 分鐘）馬上抓一次
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - liveLast > 60e3) refreshLive();
});

/* ---------- 載入資料 ----------
   用 fetch 而不是 <script src>：固定網址的 script 會被瀏覽器快取住，
   而且一旦快取條目建立，之後就算伺服器改送 no-store 它也不會回頭問，
   於是出現「資料明明更新了、畫面卻是舊的」。fetch 可以明確指定不用快取。 */
async function loadData(){
  const res = await fetch('data/data.js?t=' + Date.now(), {cache: 'no-store'});
  const txt = await res.text();
  return JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf(';')));
}

async function boot(){
  if(!D){
    try {
      D = await loadData();
    } catch (e) {
      document.getElementById('brief').innerHTML =
        '<div class="brief"><div class="bi bad"><div class="bar"></div>' +
        '<div class="bt"><div class="bw">資料載入失敗</div>' +
        '<div class="by">' + e + '</div></div></div></div>';
      return;
    }
  }
  render();
  refreshLive();                               // 即時新聞在背景抓，畫面先出來

  // 重載回來後才報告結果——沒有新資料就照實說，不要假裝更新了
  let prev = null;
  try {
    prev = sessionStorage.getItem('reload_from');
    sessionStorage.removeItem('reload_from');
  } catch(e) {}
  if(prev === null) return;
  const now = (D.updated_at || '').replace(' (MYT)', '');
  prev = (prev || '').replace(' (MYT)', '');
  toast(prev && prev !== now ? '已更新到最新資料' : '已經是最新資料',
        '資料時間 ' + now);
}
boot();

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const d = document.querySelector('tr.detail');
    if(d && d._redraw) d._redraw();
  }, 150);
});
</script>
