// 同一標題的公告（EPF 一週申報五六次持股變動）合併成一則，
// 不然清單被同一句話洗版，其他公告被擠出去。點開看得到每一則的內容。
function groupFilings(list){
  const by = new Map(), out = [];
  for(const f of list || []){
    const k = f.title_zh || f.title;
    if(by.has(k)){ by.get(k).push(f); continue; }
    const g = [f]; by.set(k, g); out.push(g);
  }
  const md = iso => iso ? +iso.slice(5, 7) + '/' + +iso.slice(8, 10) : '';
  // filing 標記：英文模式的 titleOf 靠它知道這是公告（才會先查字典的公告樣板）
  return out.slice(0, 6).map(g => g.length < 2 ? {...g[0], filing: true} : {...g[0], filing: true,
    title_zh: (g[0].title_zh || g[0].title) + `（${g.length} 則）`,
    body_zh: g.filter(f => f.body_zh).map(f => md(f.date) + '：' + f.body_zh).join('\n\n'),
    body: ''});
}

const NO_ARTICLES = '近三個月沒有相關報導', NO_FILINGS = '沒有抓到公告';
const newsMeta = n => [n.source_zh || n.source, ago(n)].filter(Boolean).join(' · ');
// 中文標題：中文報在英文模式一律用原始標題（即時抓的是簡體原文，雲端那份另有繁體 title_zh）——
// 卡片和彈窗顯示同一個字串，機器翻譯才共用同一條快取，不然兩邊各翻一次、譯文不一樣、人名音譯也不一樣
const zhTitle = n => isEn() && isZh(n) ? (n.title || n.title_zh) : (n.title_zh || n.title);
// 清單上顯示的標題：英文模式有英文原標題就直接用（不必再翻回去）；中文報的標題留給畫面上的機器翻譯。
// 公告先查字典：translate.py 整理過的中文標題字典有整齊的英文（Substantial shareholder's interest — KWAP (7)），
// 比 Bursa 原本一整串大寫好讀；查不到才用原標題。
// groupFilings 把同標題的公告併成一則時，「（N 則）」是接在中文標題後面的，英文標題要自己補上
function titleOf(n){
  if(isEn() && !isZh(n)){
    if(n.filing && hasCJK(n.title_zh || '')){
      const t = toEn(n.title_zh);
      if(t !== null && !hasCJK(t)) return t;
    }
    if(n.title && !hasCJK(n.title)){
      const g = /（(\d+) 則）$/.exec(n.title_zh || '');
      return g ? n.title + ' (' + g[1] + ')' : n.title;
    }
  }
  return zhTitle(n);
}

// 每則新聞共用的 data-*：彈窗（showOriginal）和「中文／原文」切換都從這裡讀。
// 大馬中文報（lang zh）全文太長不塞進屬性，用網址去 LIVE_BODY 查；
// data-full 標出「App 裡讀得到全文」——news.json 那份只有標題，點了就直接開來源網頁
function newsAttrs(n){
  const zh = isZh(n);
  return `data-zh="${esc(zhTitle(n))}" data-en="${esc(n.title || '')}"
    data-src="${esc(newsMeta(n))}" data-url="${esc(n.source_url || n.url)}"
    data-body-en="${zh ? '' : esc(n.body || '')}" data-body-zh="${esc(n.body_zh || '')}"
    ${zh ? `data-lang="zh" data-key="${esc(n.url)}"${zhFull(n) ? ' data-full="1"' : ''}` : ''}`;
}

// 抽出來放在外層（原本在 detailRow 裡），即時新聞抓回來後要能只重畫這一塊
function feed(list, empty){
  if(!list || !list.length) return `<div class="none">${empty}</div>`;
  return list.map(n => {
    const zh = titleOf(n), en = n.title || '';
    const cn = isZh(n);
    const translated = !cn && zh !== en;         // 英文模式直接顯示英文原標題時 zh === en，就不會多一顆「原文」
    const hasBody = cn ? zhFull(n) : !!(n.body_zh || n.body);
    return `<div class="item" ${newsAttrs(n)}>
      <a class="it" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(zh)}</a>
      <div class="im">${n.live ? '<span class="live">即時</span>' : ''}${esc(newsMeta(n))}
        ${(translated || hasBody) ? `<button class="orig" type="button">${hasBody ? '讀全文' : '原文'}</button>` : ''}</div>
    </div>`;
  }).join('');
}

/* ---------- 歷史低點參考價 ----------
   buyzone.py 算好歷年低點與三個價位；跟現價有關的（距離、股息率、P/B、能不能用）在這裡現算，
   因為網頁有盤中報價，比 buy_zone 的計算時間新。判斷順序跟 buyzone.status() 一樣，改一邊要一起改：
     broken  現價跌破近五個完整年度每一年的低點 → 過去的低點沒守住，不給參考價
     falling 年度低點一年比一年低            → 同上
     below   現價已在參考買價以下
     above   參考買價在現價下面 */
function bzStatus(s){
  const z = s.buy_zone, p = s.price;
  // 只給銀行股與 REIT（跟 buyzone.SECTORS 一致）。舊資料檔可能還帶著其他類股的 buy_zone，這裡再擋一次
  if(!z || !p || !['銀行', 'REIT'].includes(s.sector)) return null;
  const kind = p < z.floor_done ? 'broken' : z.trend === 'down' ? 'falling' : p <= z.ref ? 'below' : 'above';
  const bvps = num((s.fundamentals || {}).bvps);
  return {kind, ok: kind === 'below' || kind === 'above', gap: (z.ref / p - 1) * 100,
          yld: s.ttm_dividend ? s.ttm_dividend / z.ref * 100 : null,
          pb: bvps ? z.ref / bvps : null};
}
const BZ_CHIP = {broken: ['bad', '跌破五年低點'], falling: ['warn', '低點逐年下移'], below: ['good', '已低於參考價']};

function buyZoneHtml(s){
  const z = s.buy_zone, st = bzStatus(s);
  if(!st) return '';
  const P = v => px(v, false, s.dp);
  const off = v => (v / s.price - 1) * 100;
  const done = z.years.filter(y => !y.ytd);
  const rows = [];

  let head;
  if(st.kind === 'broken')
    head = `<span class="bz-bad">現價 ${P(s.price)} 已跌破近 ${Math.min(5, done.length)} 個完整年度每一年的最低價（最低 ${P(z.floor_done)}）。</span>` +
      '過去的低點沒有守住，用低點推算買價在這裡不適用，所以不提供參考價。';
  else if(st.kind === 'falling')
    head = '<span class="bz-bad">年度最低價一年比一年低。</span>過去的低點一路被跌破，用低點推算買價在這裡不適用，所以不提供參考價。';
  else
    head = `<b>參考買價 ${P(z.ref)}</b>` + (st.kind === 'below'
      ? `，<span class="bz-hit">現價 ${P(s.price)} 已比它低 ${Math.abs(st.gap).toFixed(1)}%</span>。`
      : `，比現價 ${P(s.price)} 低 ${Math.abs(st.gap).toFixed(1)}%。`) +
      (st.yld ? `用這個價位買，以近 12 個月股息算，股息率約 ${st.yld.toFixed(1)}%` +
                (st.pb ? `、P/B 約 ${st.pb.toFixed(2)}` : '') + '。' : '');
  rows.push(['結論', head]);

  if(st.ok){
    const names = ['第一批', '第二批', '第三批'];
    rows.push(['分批', z.tiers.map((t, i) => {
      const o = off(t.p);
      return `<div class="bz-tier"><span class="t">${names[i]}</span><span class="n">${P(t.p)}</span>` +
        `<span>${t.k}${t.d ? '，' + t.d : ''}</span>` +
        (o >= 0 ? '<span class="bz-hit">現價已到</span>' : `<span>${pc1(o)}</span>`) + '</div>';
    }).join('')]);
  }

  const pb = z.pullback;
  if(pb && st.ok){
    const now = (s.price / pb.high - 1) * 100;
    rows.push(['回檔', `過去 ${pb.years} 年，每年從年內高點最深跌掉的幅度，中位數是 ${pb.pct.toFixed(1)}%；` +
      `以一年高點 ${P(pb.high)} 計，是 ${P(pb.p)}。` +
      (s.price <= pb.p ? `現價已比一年高點低 ${Math.abs(now).toFixed(1)}%，跌得比一般年份深。`
                       : `現價比一年高點低 ${Math.abs(now).toFixed(1)}%，還在一般年份的回檔範圍內。`)]);
  }
  if(z.trend === 'up' && st.ok)
    rows.push(['趨勢', '年度最低價一年比一年高：愈舊的低點離現價愈遠，第二、三批不一定等得到。這種股票看上面的「回檔」比較實際。']);

  const lowest = Math.min(...z.years.map(y => y.p));
  rows.push(['歷年', '<div class="bz-yrs">' + z.years.map(y =>
    `<span${y.p === lowest ? ' class="lo"' : ''}>${y.y}${y.ytd ? '（今年）' : ''} ${P(y.p)}</span>`).join('') + '</div>']);
  rows.push(['說明', '用收盤價計算（不含盤中最低）。參考買價是「前兩年＋今年」三個年度最低價的中位數。' +
    '這只是歷史統計：不代表會跌到這裡，也不代表跌到就不會再跌。買之前先看派息率撐不撐得住股息，分批買。不構成投資建議。']);

  return `<div class="dg bz"><div class="dg-h">歷史低點參考價</div>` +
    rows.map(([k, v]) => `<div class="dg-r"><div class="dg-k">${k}</div><div class="dg-v">${v}</div></div>`).join('') + '</div>';
}

function detailRow(s){
  const f = s.fundamentals || {};
  const cells = [
    ['前收', px(s.prev_close,s.is_index,s.dp)], ['當日高', px(s.day_high,s.is_index,s.dp)], ['當日低', px(s.day_low,s.is_index,s.dp)],
    ['5 日', pc(s.change_pct_5d)], ['3 個月', pc(s.change_pct_3m)], ['1 年', pc(s.change_pct_1y)],
    ['3 年', pc(s.change_pct_3y)], ['5 年', pc(s.change_pct_5y)],
    ['52週高', px(s.high_52w,s.is_index,s.dp)], ['52週低', px(s.low_52w,s.is_index,s.dp)], ['距高點', pc(s.off_52w_high)],
    // 十億以上寫成「26.52B」（跟市值同一種寫法）：比特幣的「26,518,478,848」在手機兩欄格裡比格子寬 10px，會凸到卡片邊上
    ['成交量', !s.volume ? '—' : s.volume >= 1e9 ? (s.volume / 1e9).toFixed(2) + 'B' : s.volume.toLocaleString()],
    ['量能倍數', s.volume_ratio ? s.volume_ratio+'x' : '—'],
    ['市值', f.market_cap], ['P/E', f.pe_ratio], ['每股淨值', f.bvps], ['EPS', f.eps], ['ROA', f.roa],
    ['每股派息', f.dps], ['派息率', f.payout_ratio], ['除息日', f.ex_div_date],
    ['下次財報', f.earnings_date], ['分析師', f.analyst_rating_zh || f.analyst_rating], ['目標價', f.analyst_target],
  ].filter(([,v]) => v!=null && v!=='' && v!=='—');
  const COLORED = ['5 日','3 個月','1 年','距高點'];

  const artsHtml = feed(stockArticles(s), NO_ARTICLES), filHtml = feed(groupFilings(s.filings), NO_FILINGS);
  const tr = document.createElement('tr');
  tr.className = 'detail';
  // 「中文／原文」切換在英文模式沒有意義（英文原文已經直接顯示，中文報標題翻成英文後也沒得切），不畫
  const SEG = isEn() ? '' : `<span class="seg">
        <button type="button" class="on" data-l="zh">中文</button>
        <button type="button" data-l="en">原文</button></span>`;
  // 說明、最後成交、即時報價各包一個 span：英文模式是逐個文字節點查字典，拆開才各自對得到
  tr.innerHTML = `<td colspan="${COLS.length}"><div class="dbox">
    <div class="dnote">${s.note ? `<span>${s.note}</span>` : ''}${
      s.market_time ? `<span> · 最後成交 ${s.market_time}</span>` : ''}${
      s.live && s.live_ts ? `<span> · 即時報價 ${hhmm(s.live_ts)}</span>` : ''}</div>
    <div class="chips">${(s.flags||[]).map(f=>`<span class="chip ${f.level}">${f.text}</span>`).join('')}</div>
    ${(s.digest && s.digest.length) ? `<div class="dg">
      <div class="dg-h">重點報導</div>
      ${s.digest.map(([k, v]) => `<div class="dg-r"><div class="dg-k">${k}</div>
        <div class="dg-v">${v}</div></div>`).join('')}
    </div>` : ''}
    ${buyZoneHtml(s)}
    <div class="ranges">${RANGES.filter(r => !r.w || (s.series_w || []).length > 30)
      .map(r => `<span class="rng ${r.t===chartRange?'on':''}" data-d="${r.t}">${r.t}</span>`).join('')}</div>
    <div class="chartslot"></div>
    <div class="dgrid">${cells.map(([k,v])=>
      `<div><div class="k">${k}</div><div class="v ${COLORED.includes(k)?cls(num(v)):''}">${v}</div></div>`
    ).join('')}</div>
    ${s.calculator ? calculator(s) : ''}
    <div class="news">
      <div><h4>媒體報導 ${SEG}</h4>
<div data-feed="a">${artsHtml}</div></div>
      <div><h4>Bursa 公告 ${SEG}</h4>
<div data-feed="f">${filHtml}</div></div>
    </div>
  </div></td>`;
  // 記下畫出去的內容，paintFeeds 比對：一樣就不換，面板不閃也不跳
  tr.querySelector('[data-feed="a"]')._html = artsHtml;
  tr.querySelector('[data-feed="f"]')._html = filHtml;

  const slot = tr.querySelector('.chartslot');
  const draw = () => {
    let r = RANGES.find(x => x.t === chartRange);
    if(!r || (r.w && (s.series_w || []).length <= 30)) r = RANGES[0];   // 沒週線就退回 1 個月
    const src = r.w ? s.series_w : s.series;
    const seg = r.d ? src.slice(-r.d) : src;
    const chg = (seg[seg.length-1].close / seg[0].close - 1) * 100;

    slot.innerHTML = `<div class="chart"></div>
      <div class="readout">
        <span class="pt"></span>
        <span class="rg">區間 ${seg[0].date} → ${seg[seg.length-1].date} ·
          ${seg.length} ${r.w ? '週' : '個交易日'} ·
          <span class="${cls(chg)}">${pc(chg)}</span>${r.w ? (isEn() ? ' (weekly)' : '（週線）') : ''}</span>
      </div>`;

    const host = slot.querySelector('.chart');
    const bz = bzStatus(s);
    const marks = bz && bz.ok ? [{v: s.buy_zone.ref, t: '參考買價 ' + px(s.buy_zone.ref, false, s.dp)}] : [];
    const {X, Y, P, pw, svg} = priceChart(host, seg, s.is_index, marks);
    const tip = document.createElement('div');
    tip.className = 'tip';
    host.appendChild(tip);
    const out   = slot.querySelector('.readout .pt');
    const cross = svg.querySelector('.cross');
    const hov   = svg.querySelector('.hov');

    // 沒有指到任何一天時，顯示最新收盤
    const base = () => {
      const d = seg[seg.length - 1];
      out.innerHTML = `最新 ${d.date} · <b>${px(d.close, s.is_index, s.dp)}</b>`;
      cross.style.display = 'none';
      hov.style.display = 'none';
      tip.classList.remove('on');
    };
    base();

    // 滑鼠移過去 / 手指滑過去，顯示那一天的日期與價格
    const track = clientX => {
      const r = svg.getBoundingClientRect();
      const vx = (clientX - r.left) / r.width * svg.viewBox.baseVal.width;
      const i = Math.max(0, Math.min(seg.length - 1,
                Math.round((vx - P.l) / pw * (seg.length - 1))));
      const d = seg[i];
      const vs = (d.close / seg[0].close - 1) * 100;
      out.innerHTML = `${d.date} · <b>${px(d.close, s.is_index, s.dp)}</b>
        <span class="${cls(vs)}">${pc(vs)}</span>`;
      const cx = X(i);
      cross.setAttribute('x1', cx);
      cross.setAttribute('x2', cx);
      cross.style.display = '';
      hov.setAttribute('cx', cx);
      hov.setAttribute('cy', Y(d.close));
      hov.style.display = '';

      // 標籤跟著游標，貼在資料點正上方；靠近邊緣時往內收，不要被切掉
      tip.innerHTML = `<b>${px(d.close, s.is_index, s.dp)}</b>${s.unit ? ' ' + s.unit : ''}<br>${d.date}`;
      tip.classList.add('on');
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.max(half + 2, Math.min(host.clientWidth - half - 2, cx)) + 'px';
      tip.style.top  = Y(d.close) + 'px';
    };

    svg.addEventListener('pointermove',  e => { e.stopPropagation(); track(e.clientX); });
    svg.addEventListener('pointerleave', base);
    svg.addEventListener('touchmove',    e => track(e.touches[0].clientX), {passive: true});
    svg.addEventListener('touchend',     base);
    svg.addEventListener('click',        e => e.stopPropagation());
  };

  // 「中文 / 原文」兩顆按鈕：機器翻譯遇到金融術語會有偏差，要能一眼看出目前在哪個模式
  tr.querySelectorAll('.seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => btn.onclick = ev => {
      ev.stopPropagation();
      const en = btn.dataset.l === 'en';
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      seg.closest('div').querySelectorAll('.item').forEach(it => {
        const v = en ? it.dataset.en : it.dataset.zh;
        if(v) it.querySelector('.it').textContent = v;
      });
    });
  });

  tr._redraw = draw;                         // 由 render() 在插進 DOM 後呼叫（那時才量得到寬度）
  wireCalculator(tr);
  fillZh(tr);                                // 還是英文的報導標題，在手機上補翻
  tr.querySelectorAll('.rng').forEach(b => b.onclick = ev => {
    ev.stopPropagation();                    // 別讓點擊冒泡去收合這一列
    chartRange = b.dataset.d;
    // 用按鈕自己的父層來切換高亮，不能用 tr——手機版會把 .dbox 搬進面板，
    // 搬走之後 tr.querySelectorAll('.rng') 會是空的，高亮就不會跟著動
    b.parentNode.querySelectorAll('.rng').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  return tr;
}

/* ---------- 市場區塊：快訊、漲跌排行、IPO ----------
   追蹤清單只看得到自己挑的 49 檔。這三塊回答的是「整個市場今天怎麼了」，
   設計目標是打開頁面、不捲動、不點開，就知道大方向。 */

// 可收起的卡片，收起狀態記在瀏覽器裡。
// 內容跟上次畫的一模一樣就不重畫（即時新聞每 3 分鐘檢查一次，多半沒有新的）：
// 不閃、不動捲動位置，也不會把使用者剛切到「原文」的標題換回來。回傳有沒有重畫
// foldDef：使用者從沒按過時要不要先收起（分析分頁的「怎麼看數字」「原則」是長篇固定文字，預設收起，
// 不然每次打開都要捲過一大段才看到下面）。按過一次就照他按的記住
function mcard(id, title, sub, body, foldDef = false){
  const key = 'fold_' + id;
  let folded = foldDef;
  try { const v = localStorage.getItem(key); if(v !== null) folded = v === '1'; } catch(e) {}
  const host = document.getElementById(id);
  const html = `<div class="mcard${folded ? ' folded' : ''}">
    <div class="mcard-h"><b>${title}</b><span>${sub}</span>
      <button class="tog" type="button" aria-expanded="${!folded}">${folded ? '展開' : '收起'}</button></div>
    <div class="mcard-b" ${folded ? 'hidden' : ''}>${body}</div></div>`;
  if(host._html === html) return false;
  host._html = html;
  host.innerHTML = html;
  // 整條標題列都能點（按鈕留著給鍵盤、讀屏用）：預設收起的卡片只靠右上角兩個小字，手機上幾乎點不到。
  // 標題列裡若有連結，點連結不要順便收起
  host.querySelector('.mcard-h').onclick = e => {
    if(e.target.closest('a')) return;
    const b = host.querySelector('.mcard-b'), t = host.querySelector('.tog');
    b.hidden = !b.hidden;
    host.querySelector('.mcard').classList.toggle('folded', b.hidden);
    t.textContent = b.hidden ? '展開' : '收起';
    t.setAttribute('aria-expanded', String(!b.hidden));
    try { localStorage.setItem(key, b.hidden ? '1' : '0'); } catch(e) {}
  };
  return true;
}
function clearCard(id){
  const host = document.getElementById(id);
  host.innerHTML = '';
  host._html = '';
}

const KSE = code => 'https://www.klsescreener.com/v2/stocks/view/' + encodeURIComponent(code);
const ppx = v => v == null ? '—' : v.toFixed(v < 1 ? 3 : 2);

// 快訊、追蹤股票都是預設 3 則，按「更多」看到 8 則：
// 兩張都攤開的話，手機第一屏被快訊塞滿，「重點」被擠到畫面外
const HL_TOP = 3, HL_MAX = 8, WATCH_TOP = 3, WATCH_MAX = 8;
let hlAll = false, watchAll = false;

// 「顯示更多／只看前 3 則」以按下去的那顆按鈕為準：
// 展開時按鈕以上的內容沒變，新的幾則就接在手指的位置往下長，不用捲；
// 收起時上面少了幾則，把按鈕捲回手指底下，不然按鈕跑到畫面外面。
// （以前拿下面的卡片當錨點，展開的那幾則反而被推出畫面上方）
function wireMore(host, flip, redraw){
  const b = host.querySelector('.bmore');
  if(!b) return;
  b.onclick = () => {
    const y = b.getBoundingClientRect().top;
    const opened = flip();
    redraw();
    const nb = host.querySelector('.bmore');
    if(opened || !nb) return;
    const d = nb.getBoundingClientRect().top - y;
    if(Math.abs(d) > 1) scrollBy(0, d);
  };
}

// 中文報只有標題、沒有全文可讀的，彈窗裡什麼都沒有，直接開來源網頁

/* 追蹤股票最新：自己一張卡，放在「重點」下面。
   原本塞在快訊卡的下半段，手機上快訊卡長到 770px，把「重點」擠出第一屏 */
function renderWatch(){
  const host = document.getElementById('watchnews');
  const title = '追蹤股票最新';
  // 第一次還沒抓回來：先佔好三則的位置，抓到時下面的內容才不會被往下推
  // 佔位要跟真的卡片差不多高：每則三行標題（中文報多半兩行，The Edge 的英文標題常是三到五行）＋一行來源，
  // 最下面再留一條「顯示更多」（通常都超過三則）。以前每則只佔兩行、也沒留那一條，佔位比真的矮 170px，
  // 載完時漲跌排行、分頁、股票列表整片往下跳
  if(!LIVE.tried){
    const sk = '<div class="hl sk"><div class="t"><i></i><i></i><i class="s"></i></div><div class="m"><i></i></div></div>';
    mcard('watchnews', title, '中文報 · 載入中', sk.repeat(WATCH_TOP) + '<div class="bmore sk"><i></i></div>');
    return;
  }
  // 同一篇（例如收盤報導同時提到馬銀行）快訊卡最上面三則已經列了，這裡就不再重複。
  // 只比對前三則（不管快訊卡有沒有展開），這張卡的內容才不會跟著那顆按鈕變來變去
  const seen = new Set(marketNews().slice(0, HL_TOP).flatMap(n => dupKeys(n).filter(k => !k.startsWith('p:'))));
  const ws = newest(LIVE.watch).filter(n => !dupKeys(n).some(k => seen.has(k))).slice(0, WATCH_MAX);
  if(!ws.length){
    mcard('watchnews', title, '中文報', `<div class="hl-note">${LIVE.watchOk
      ? '最近 7 天，星洲、南洋、中國報沒有提到追蹤股票的財經新聞。'
      : '暫時連不上星洲、南洋、中國報，稍後會自動再試。'}</div>`);
    return;
  }
  // 標出是哪一檔：一篇講好幾家銀行時只寫第一家，其餘用「等 N 檔」帶過
  // 「等 N 檔」另外包一個 span：英文模式逐個文字節點查字典，股票名和「等 N 檔」分開才各自對得到
  const tagOf = n => esc(nameEn(n.stocks[0].name)) +
    (n.stocks.length > 1 ? ' <span>等 ' + n.stocks.length + ' 檔</span>' : '');
  const shown = ws.slice(0, watchAll ? WATCH_MAX : WATCH_TOP);
  mcard('watchnews', title, `中文報最新 ${shown.length} 則 · 即時`,
    shown.map(n => hlRow(n, tagOf(n))).join('') +
    (ws.length > WATCH_TOP ? `<button class="bmore" type="button">${
      watchAll ? '只看前 ' + WATCH_TOP + ' 則' : '顯示更多（共 ' + ws.length + ' 則）'}</button>` : ''));
  host.querySelectorAll('.hl').forEach(el => el.onclick = () => openNews(el));
  wireMore(host, () => (watchAll = !watchAll), renderWatch);
}

function renderIPO(){
  const ip = D.market && D.market.ipo;
  if(!ip || (!ip.upcoming.length && !ip.recent.length)){ clearCard('ipo'); return; }
  const md = iso => { const [, m, d] = iso.split('-').map(Number); return m + '/' + d; };
  const MON = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const dm = t => { const m = /(\d{1,2})\s+([A-Za-z]{3})/.exec(t || ''); return m && MON[m[2]] ? MON[m[2]] + '/' + (+m[1]) : ''; };
  // 金額換成「萬／億」令吉；英文模式直接寫 m／bn——「1.2 億」要換成「120m」得換數字，字典和機器翻譯都做不到。
  // 單位貼著數字（RM103.1m，財經慣例），隔一格的話「m」會自己折到下一行
  const rm = v => !v ? '' : isEn()
    ? (v >= 1e9 ? 'RM' + (v / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'bn'
                : 'RM' + (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'm')
    : (v >= 1e8 ? 'RM' + (v / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 億'
                : 'RM' + Math.round(v / 1e4).toLocaleString() + ' 萬');
  // 「GB BOND HOLDINGS BERHAD」→「GB Bond Holdings Berhad」

      : `${esc(i.code)} · 馬股${esc(i.board_zh || i.board || '')}${i.sector_zh ? ' · ' + esc(i.sector_zh) : ''}`;

/* ---------- 今日重點 ----------
   每次更新後由 analyze.py 用規則挑出來的，不是全部列出來。
   點一下跳到那一檔。 */
// 把 2026-09-25 變成「9/25（五）」，並在是今天時直接說「今天」
// 馬來西亞當地日期（UTC+8），不依賴手機的時區設定
const mytToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);

// 報導時間在打開頁面的當下才算。資料檔裡的「3 小時前」是雲端抓資料那一刻算的，
// 兩三個小時後再看就不準了——所以有時間戳就用時間戳，只有日期的公告就用日期
function ago(n){
  if(n.ts){
    const h = (Date.now() / 1000 - n.ts) / 3600;
    // 即時新聞要看得出「12 分鐘前」和「50 分鐘前」的差別，不能一小時內都叫剛剛
    if(h < 1){ const m = Math.floor(h * 60); return m < 2 ? '剛剛' : m + ' 分鐘前'; }
    if(h < 24) return Math.floor(h) + ' 小時前';
  }
  const iso = n.date || (n.ts ? new Date(n.ts * 1000 + 8 * 3600e3).toISOString().slice(0, 10) : '');
  if(!iso) return n.when || '';
  const days = Math.round((Date.parse(mytToday()) - Date.parse(iso)) / 864e5);
  if(days <= 0) return '今天';
  if(days === 1) return '昨天';
  if(days < 30) return days + ' 天前';
  if(days < 365) return Math.floor(days / 30) + ' 個月前';
  return Math.floor(days / 365) + ' 年前';
}

// epoch 秒 → 馬來西亞時間「18:40」；不是今天就加上「9/29」
function hhmm(ts){
  const iso = new Date(ts * 1000 + 8 * 3600e3).toISOString();
  const day = iso.slice(0, 10);
  return (day === mytToday() ? '' : +day.slice(5, 7) + '/' + +day.slice(8, 10) + ' ') + iso.slice(11, 16);
}

function fmtWhen(iso){
  const parts = (iso || '').split('-').map(Number);
  if(parts.length !== 3) return iso || '';
  const [y, m, d] = parts;
  const today = mytToday();
  const wd = '日一二三四五六'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return (iso === today ? '今天 ' : '') + `${m}/${d}（${wd}）`;
}

const COMMENTARY = {

const COMMENTARY_STALE = 14;                     // 天：大環境的數字（殖利率、外資）兩週就會變

// 出油率跟個股面板的鮮果串試算共用同一個設定（palm_oer）。試算框每打一個字就存一次，
// 打到一半的「1」也會被存下來：不在 10–30% 之間的當作沒設，免得算出 RM40 一噸的鮮果串
function anOer(){
  let v = NaN;
  try { v = parseFloat(localStorage.getItem(OER_KEY)); } catch(e) {}
  return v >= 10 && v <= 30 ? +v.toFixed(2) : 18.75;
}
// 數字一律寫成 en-US 格式（1,608）：手機語系若用句點或空格分千位，英文字典的樣板就對不到
const anInt = v => Math.round(v).toLocaleString('en-US');
// 一律帶正負號（+0.0%）：字典的樣板認的是「[-+]數字%」，少了正號的那句會掉去機器翻譯
const pc1 = v => v == null || !isFinite(v) ? '—' : (v < 0 ? '' : '+') + v.toFixed(1) + '%';
const nv = (v, d) => v == null ? d : v;
// 句子裡列名字用短名（「Maybank 馬來亞銀行」→ Maybank、「Zetrix AI（原 MyEG）」→ Zetrix AI）；
// 列表本身用完整名稱，跟表格一致，使用者才認得出是同一檔
const shortName = s => s.name.replace(/[（(].*?[）)]/g, '').replace(/\s*[一-鿿].*$/, '').trim() || nameEn(s.name);

// 今年以來：基準是去年最後一個收盤——新聞、券商講的「今年漲跌」都這樣算，使用者拿去對才對得起來。
// 以前用今年第一個交易日的收盤，IGB REIT 明明今年小漲，這裡卻顯示 -1.4%。series（一年的日線）沒有去年的點才退回今年第一個收盤。
// 「今年」是馬來西亞今天的年份，不是 series 最後一天的年份：1/1 到第一個交易日之間最後一天還是去年，
// 會把去年整年的漲跌標成「今年」。
// 今年高點只看今年的收盤（去年 12/31 不算）；今年還沒有交易日時沒有高點（peak 是 null）。
// 現價用 s.price（news.json 帶來盤中報價時會比 series 的最後一天新）
function ytdOf(s){
  const ser = (s.series || []).filter(p => p && p.close != null && p.date);
  if(!ser.length) return null;
  const jan1 = mytToday().slice(0, 4) + '-01-01';
  const prev = ser.filter(p => p.date < jan1), yr = ser.filter(p => p.date >= jan1);
  const base = prev.length ? prev[prev.length - 1] : yr[0];
  if(!(base && base.close > 0)) return null;
  const now = s.price != null ? s.price : ser[ser.length - 1].close;
  const ytd = (now / base.close - 1) * 100;
  if(!yr.length) return {now, ytd, peak: null, peakDate: null, off: null};
  const top = yr.reduce((a, p) => p.close > a.close ? p : a, yr[0]);
  const peak = Math.max(top.close, now);
  return {now, ytd, peak, peakDate: now >= top.close ? null : top.date, off: (now / peak - 1) * 100};
}

// 銀行的標籤，依序第一個符合的算數。先看股息撐不撐得住：ROE 再高，派得比賺得多也撐不久
function bankTier(s){
  const f = s.fundamentals || {};
  const roe = num(f.roe), pb = num(f.pb_ratio), pay = num(f.payout_ratio), dps = num(f.dps), eps = num(f.eps);
  if((pay != null && pay > 90) || (dps != null && eps != null && dps > 0 && dps > eps)) return ['bad', '股息撐不住'];
  // ROE 低於 8%：真的低於帳面才叫「便宜有原因」（P/B 低是因為賺得少）；
  // P/B 1.3 的低 ROE 銀行一點也不便宜，標成「便宜」是說錯話，只說 ROE 偏低
  if(roe != null && roe < 8) return pb != null && pb < 1 ? ['warn', '便宜有原因'] : ['', 'ROE 偏低'];
  if(roe != null && roe >= 11) return ['good', '穩健'];
  if(roe != null && pb != null && pb < 1) return ['info', '低於帳面'];   // 走到這裡 ROE 一定 ≥ 8%
  return null;
}
// 圖例：標籤、說明。只列今天真的有出現的標籤
const TIER_LEGEND = [
  ['good', '穩健', 'ROE 11% 以上'],
  ['info', '低於帳面', 'P/B 低於 1，ROE 也有 8% 以上'],
  ['warn', '便宜有原因', 'ROE 低於 8%，P/B 也低於 1：便宜是因為賺得少'],
  ['', 'ROE 偏低', 'ROE 低於 8%'],
  ['bad', '股息撐不住', '派息率超過 90%，或每股股息比每股盈利多'],
];
// REIT 不看 ROE。派得比帳面盈利多在 REIT 很常見（盈利扣了建築物折舊，現金其實還在），
// 所以不用紅色的「撐不住」嚇人，只提醒去查可分派收入
function reitTier(s){
  const f = s.fundamentals || {};
  const pay = num(f.payout_ratio), dps = num(f.dps), eps = num(f.eps);
  const over = pay != null ? pay > 100 : dps != null && eps != null && dps > 0 && dps > eps;
  return over ? ['warn', '派息高於盈利，要查可分派收入'] : null;
}

// 列的第二行：標籤（固定排第一個）· P/B · ROE · 股息率 · 派息率 · 距52週高。
// 缺資料寫「—」而不是省略：少一欄會被誤讀成「沒有派息」。「息」寫全成「股息率」：只寫一個「息」會被看成利率。
// 距52週高用 data.js 的 off_52w_high，不用盤中現價重算：點開的面板（重點報導「距 52 週高點…」、詳細資料的「距高點」）
// 用的都是這個數字，同一檔點下去前後要是同一個數。不上紅綠色：它永遠 ≤ 0，紅色不帶任何訊息
function anMeta(s, chip, withRoe){
  const f = s.fundamentals || {};
  const p = v => v == null ? '—' : v.toFixed(1) + '%';
  const pay = num(f.payout_ratio);
  return (chip ? `<span class="chip ${chip[0]}">${chip[1]}</span>` : '') +
    ['P/B ' + (f.pb_ratio || '—'), withRoe ? 'ROE ' + p(num(f.roe)) : '', '股息率 ' + p(num(f.div_yield)),
     '派息率 ' + (pay == null ? '—' : Math.round(pay) + '%'), '距52週高 ' + pc1(s.off_52w_high)]
      .filter(Boolean).map(b => `<span>${esc(b)}</span>`).join('');
}
function anRow(s, chip, withRoe){
  const y = ytdOf(s);
  return `<div class="anr" data-go="${esc(s.symbol)}">
    <div class="n">${esc(nameEn(s.name))}</div>
    <div class="r"><span class="k">今年</span><span class="${cls(y && y.ytd)}">${y ? pc1(y.ytd) : '—'}</span></div>
    <div class="s">${anMeta(s, chip, withRoe)}</div></div>`;
}

// 點一列：跟在表格裡點那一檔一樣。手機開面板；桌機的詳細資料是表格裡展開的那一列：
// 現在的分頁就看得到這一檔（從「重點」點進來常是這樣）就留在原分頁只展開，看不到才切到它所在的分頁，再捲過去。
// 切過去不記成使用者選的分頁，重新整理還是回到原本那頁，跟點市場脈搏一樣
function openStock(sym, block = 'start'){
  const s = D && D.stocks.find(x => x.symbol === sym);
  if(!s) return;
  if(isMobile()){ openSheet(s); return; }
  const cur = TABS.find(t => t.t === activeTab);
  const here = cur && !cur.view && (cur.secs === null ? isFav(s.symbol) : cur.secs.includes(s.sector));
  if(!here){
    const t = TABS.find(t => t.secs && t.secs !== ORDER && !t.view && t.secs.includes(s.sector));
    activeTab = t ? t.t : '全部';
  }
  openSym = s.symbol;
  render();
  const row = document.querySelector('tr.row.on');
  if(row) row.scrollIntoView({block, behavior: 'smooth'});
}
// 事件委派：卡片內容沒變時 mcard 不重畫，綁在外層就不必每次重綁。
// data-go 開那一檔；data-to 捲到這一頁下面的卡片（「現在發生什麼事」的銀行股、REIT 那兩條）
document.getElementById('analysis').addEventListener('click', e => {
  const to = e.target.closest('[data-to]');
  if(to){
    const card = document.getElementById(to.dataset.to);
    if(card && card.firstChild) card.scrollIntoView({block: 'start', behavior: 'smooth'});
    return;
  }
  const el = e.target.closest('[data-go]');
  if(el) openStock(el.dataset.go);
});

function renderAnalysis(){
  if(!D) return;
  const en = isEn();
  const of = sec => D.stocks.filter(s => s.sector === sec);
  const bySym = sym => D.stocks.find(s => s.symbol === sym);
  const md = iso => +iso.slice(5, 7) + '/' + +iso.slice(8, 10);
  // 英文副標裡的日期換成不折行的連字號（U+2011），跟「重點」同一招：不然手機上會在連字號處斷成兩截
  const nb = t => en ? t.replace(/-/g, '‑') : t;

  // ---- 0. 資料時間、免責：固定兩行字，不能收起（見 CSS .an-head）
  const head = `<div>資料時間 ${esc(nb(D.updated_at || ''))}</div><div>僅為資訊整理，不構成投資建議；買賣請自己判斷。</div>`;
  const top = document.getElementById('an-top');
  if(top._html !== head){ top._html = head; top.innerHTML = head; }

  // ---- 1. 現在發生什麼事：[屬性（data-go 開那一檔／data-to 捲到卡片／空字串不能點）, 標籤, 一句話]
  const now = [];
  const k = bySym('^KLSE'), ky = k && ytdOf(k);
  if(ky) now.push([`data-go="${esc(k.symbol)}"`, '綜指', `${anInt(ky.now)}，今年 ${pc1(ky.ytd)}` +
    (ky.peak == null ? '' : !ky.peakDate ? '，今年新高'
      : `，比今年高點 ${anInt(ky.peak)}（${md(ky.peakDate)}）低 ${Math.abs(ky.off).toFixed(1)}%`)]);
  // 類股：「重點」裡已經有這個類股的趨勢就直接用那一句（同一件事兩處說法要一樣）；
  // 沒有（類股沒在跌，重點不會報）才自己算，算法和句型都跟 analyze.py 一樣：每檔截在 ±15% 再平均，
  // 一檔暴跌不會把整個類股拉下去；句型一樣，英文字典的類股規則也就共用
  const sector = (sec, label, card) => {
    const h = (D.highlights || []).find(h => h.sector === sec && /^類股/.test(h.kind || '') && h.what);
    if(h) return [`data-to="${card}"`, label, h.what];
    const list = of(sec).filter(s => s.change_pct_1m != null);
    if(list.length < 2) return null;
    const avg = list.reduce((a, s) => a + Math.max(-15, Math.min(15, s.change_pct_1m)), 0) / list.length;
    const down = list.filter(s => s.change_pct_1m < 0).length;
    return [`data-to="${card}"`, label, `一個月平均 ${pc1(avg)}，${list.length} 檔` +
      (down === list.length ? '全數下跌' : `中 ${down} 檔下跌`)];
  };
  [sector('銀行', '銀行股', 'an-bank'), sector('REIT', 'REIT', 'an-reit')].forEach(x => x && now.push(x));
  const c = bySym('MPOB-CPO');
  if(c && c.price){
    const oer = anOer(), ffb = anInt(c.price * oer / 100);
    now.push([`data-go="${esc(c.symbol)}"`, '毛棕油', `RM${anInt(c.price)}/噸` +
      (c.avg30 ? `，${c.avg30_days || 30} 日均價 RM${anInt(c.avg30)}` : '') + `；鮮果串約 RM${ffb}/噸（出油率 ${oer}%）`]);
  }
  // 最近上市（market.py 只留 90 天內的）：上市幾檔就寫幾檔；沒有現價的（LEAP 板常見）判斷不了有沒有跌破，
  // 另外註明「幾檔有報價」——以前直接濾掉，10 檔被說成 9 檔
  const recent = (D.market && D.market.ipo && D.market.ipo.recent) || [];
  const ipoSay = (list, board) => {
    if(!list.length) return '';
    const q = list.filter(i => i.since_ipo != null);
    return `最近 3 個月${board}上市 ${list.length} 檔` + (q.length < list.length ? `（${q.length} 檔有報價）` : '') +
      `，${q.filter(i => i.since_ipo < 0).length} 檔跌破發行價`;
  };
  const ipoLine = ipoSay(recent, '');
  // 「三種先不要碰」講的是創業板（ACE）新股，那裡只數 ACE 的：主板一檔漲了兩倍多，混進去會把話說反
  const aceLine = ipoSay(recent.filter(i => /ACE/i.test(i.board || '')), '創業板');
  if(ipoLine) now.push(['', '新股', ipoLine]);
  mcard('an-now', '現在發生什麼事', '從最新資料自動算', now.map(([attr, label, text]) =>
    `<div class="anb"${attr ? ' ' + attr : ''}><b>${label}</b><span>${esc(text)}</span></div>`).join(''));

  // ---- 2. 怎麼看數字（固定說明，預設收起）。排在銀行股前面：下面每一列的 P/B、ROE、派息率，先在這裡講過
  mcard('an-howto', '怎麼看數字', 'P/B、ROE、派息率、股息率', `<div class="an-txt">
    <p><b>P/B（股價 ÷ 每股淨值）</b><span>1.0 代表用帳面價值買。銀行股 P/B 低於 1 是打折，但要搭配 ROE 一起看。</span></p>
    <p><b>ROE（股東權益報酬率）</b><span>銀行拿股東的錢一年賺幾 %。ROE 愈高，值得的 P/B 愈高：ROE 高、P/B 低才是便宜；ROE 低、P/B 低是便宜有原因。</span></p>
    <p><b>派息率（股息 ÷ 盈利）</b><span>超過 90% 等於把賺的幾乎全發出去，盈利一變差就可能減息；每股股息比每股盈利還多，就是發的比賺的多。</span></p>
    <p><b>股息率 vs 公債殖利率</b><span>股息率要跟 10 年期大馬公債（MGS）殖利率比，差距就是承擔股價波動的補償。公債殖利率往上，補償就縮水，股價往往要再跌一點才平衡。</span></p>
    </div>`, true);

  // ---- 3. 銀行股：ROE 高的在前，ROE 一樣時 P/B 低的在前（同樣的賺錢能力，買得比較便宜）
  const banks = of('銀行').map(s => ({s, roe: num((s.fundamentals || {}).roe), pb: num((s.fundamentals || {}).pb_ratio)}))
    .sort((a, b) => nv(b.roe, -1e9) - nv(a.roe, -1e9) || nv(a.pb, 1e9) - nv(b.pb, 1e9)).map(x => x.s);
  const tiers = banks.map(bankTier);
  if(banks.length){
    // 圖例放在列表上面：第一個標籤出現之前就先看得到意思（以前放在 11 列底下，要往下捲一千多 px）
    const has = new Set(tiers.filter(Boolean).map(t => t[1]));
    const legend = '<div class="an-note an-lg">' +
      TIER_LEGEND.filter(x => has.has(x[1])).map(([c, t, d]) => `<div><span class="chip ${c}">${t}</span><span>${d}</span></div>`).join('') +
      '<div><span class="k0">沒有標籤</span><span>沒有特別要注意的</span></div>' +
      '<div><span class="k0">距52週高</span><span>比過去一年的最高收盤低多少</span></div></div>';
    mcard('an-bank', '銀行股體檢', `${banks.length} 檔 · 依 ROE 排序`,
      legend + banks.map((s, i) => anRow(s, tiers[i], true)).join(''));
  } else clearCard('an-bank');

  // ---- 4. REIT：收租型看的是股息，股息率高的在前
  const reits = of('REIT').sort((a, b) => nv(num((b.fundamentals || {}).div_yield), -1) - nv(num((a.fundamentals || {}).div_yield), -1));
  if(reits.length) mcard('an-reit', 'REIT 體檢', `${reits.length} 檔 · 依股息率排序`,
    reits.map(s => anRow(s, reitTier(s), false)).join('') +
    '<div class="an-note">REIT 的帳面盈利扣了建築物折舊，派息高於盈利很常見，不一定是警訊；要看的是「可分派收入」撐不撐得住。' +
    '利率上升時 REIT 兩面受壓：借款利息變貴，股息相對公債也變得沒那麼吸引人。</div>');
  else clearCard('an-reit');

  // ---- 4b. 歷史低點參考價：銀行與 REIT（收息股才適合用低點分批買；題材股的歷年低點離現價太遠）。
  // 能用的排前面、離參考價近的在前（已經低於參考價的最前）；低點法不適用的排最後，不給價位
  const bzList = [...banks, ...reits].map(s => ({s, st: bzStatus(s)})).filter(x => x.st)
    .sort((a, b) => (b.st.ok - a.st.ok) || (b.st.gap - a.st.gap));
  if(bzList.length) mcard('an-buy', '歷史低點參考價', '銀行與 REIT · 依歷年低點',
    '<div class="an-note">參考買價＝「前兩年＋今年」三個年度最低收盤價的中位數。點進個股可以看分三批的價位、每年的最低價和回檔幅度。' +
    '跌破近五年每一年低點、或低點一年比一年低的，用低點推算不適用，不給價位。這是歷史統計，不構成投資建議。</div>' +
    bzList.map(({s, st}) => {
      const z = s.buy_zone, P = v => px(v, false, s.dp);
      const chip = BZ_CHIP[st.kind];
      // 體檢標籤一起放：Bank Islam 這類「便宜有原因」的，跌到參考價以下也只是更便宜，不代表比較值得買
      const tier = s.sector === '銀行' ? bankTier(s) : reitTier(s);
      const meta = [`現價 ${P(s.price)}`, `一年低點 ${P(z.tiers[0].p)}`, `五年最低 ${P(z.tiers[2].p)}`];
      if(st.ok && st.yld) meta.push(`參考價股息率 ${st.yld.toFixed(1)}%`);
      return `<div class="anr" data-go="${esc(s.symbol)}">
        <div class="n">${esc(nameEn(s.name))}</div>
        <div class="r"><span class="k">參考</span>${st.ok ? `${P(z.ref)} <span class="${st.kind === 'below' ? 'up' : 'flat'}">${pc1(st.gap)}</span>` : '—'}</div>
        <div class="s">${[chip, tier && tier[0] !== 'good' ? tier : null].filter(Boolean)
          .map(c => `<span class="chip ${c[0]}">${c[1]}</span>`).join('')}${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div></div>`;
    }).join('') +
    '<div class="an-note">右邊的百分比是參考價相對現價：負數是還要再跌多少才到；綠色的正數代表現價已經比參考價低。</div>');
  else clearCard('an-buy');

  // ---- 5. 題材股風險：只看題材類股（「AI」分頁那兩類）。以前是「指數、匯率、加密、油價以外全部」，
  // 一年跌掉一半的建築地產股也會被叫成題材股、列在「通常是公司出了結構性問題」底下——在公開網頁上點名一家公司，說法要準
  const THEME = (TABS.find(t => t.t === 'AI') || {}).secs || [];
  const risk = D.stocks.filter(s => THEME.includes(s.sector)).map(s => {
    const f = s.fundamentals || {};
    const y1 = s.change_pct_1y, pe = num(f.pe_ratio);
    // 目標價「1.55 (+1,723.53%)」：股價崩了、分析師沒更新，算出來的上漲空間就離譜。錯的數字比沒數字危險
    const m = /\(([-+]?[\d,.]+)%\)/.exec(f.analyst_target || '');
    const up = m ? parseFloat(m[1].replace(/,/g, '')) : null;
    const why = [];
    if(y1 != null && y1 <= -50) why.push(`一年 ${y1 < 0 ? '' : '+'}${anInt(y1)}%`);
    // 門檻是「過 80」：四捨五入成整數會把 80.3 寫成「80 倍」，看起來像沒過門檻。
    // 100 倍以下留一位小數、無條件進位（減一點點是抵掉 80.1 × 10 = 801.0000000001 這種浮點誤差）
    if(pe != null && pe > 80) why.push(`本益比 ${pe < 100 ? (Math.ceil(pe * 10 - 1e-9) / 10).toFixed(1) : anInt(pe)} 倍`);
    if(up != null && Math.abs(up) > 100) why.push(`分析師目標價 ${up < 0 ? '' : '+'}${anInt(up)}%，已過時`);
    return {s, why, y1: nv(y1, 0), pe: nv(pe, 0), crash: y1 != null && y1 <= -50};
  }).filter(x => x.why.length)
    // 一年腰斬的排前面（跌最多的最前），其餘照本益比由高到低
    .sort((a, b) => (b.crash - a.crash) || (a.crash ? a.y1 - b.y1 : b.pe - a.pe));
  mcard('an-risk', '題材股風險', '一年腰斬、本益比過 80、目標價過時',
    (risk.length ? risk.map(({s, why}) => `<div class="anr" data-go="${esc(s.symbol)}">
      <div class="n">${esc(nameEn(s.name))}</div>
      <div class="s">${why.map(w => `<span>${esc(w)}</span>`).join('')}</div></div>`).join('')
      : '<div class="anb">目前沒有符合條件的股票。</div>') +
    '<div class="an-note">題材股漲的時候本益比不重要，跌的時候什麼都不重要；本益比很高的股票，一個壞消息就能腰斬。</div>');

  // ---- 6. 給新手的原則（固定說明，預設收起）。「三種先不要碰」不寫死股票名：描述類型，後面接現在符合的。
  // 這是公開網頁：原則只講通用的方法，不寫任何人自己的買賣計畫，也不寫成叫人買哪一類股票
  const names = list => list.length ? '目前符合：' + list.map(shortName).join('、') : '目前沒有';
  const payBad = banks.filter((s, i) => (tiers[i] || [])[0] === 'bad');
  const reitOver = reits.filter(s => reitTier(s));
  const crashed = risk.filter(x => x.crash).map(x => x.s);
  const live = t => `<span class="an-live">${esc(t)}</span>`;
  mcard('an-rules', '給新手的原則', '不是叫你買哪一檔', `<div class="an-txt"><ol class="an-ol">
    <li><b>先弄懂三個數字</b><span>P/B、ROE、派息率，個股詳細資料裡都有。看不懂這三個數字，就還不到買的時候。</span></li>
    <li><b>收息股不是致富工具</b><span>銀行股、REIT 這類股票的報酬主要來自股息，股價一年跌 20% 也不奇怪；承受不了這種波動，就不要買個股。</span></li>
    <li><b>不要一次買完</b><span>價格接下來往哪走沒人知道。分幾次、每次固定金額買，比一次買完不容易後悔。</span></li>
    <li><b>不要只買一檔</b><span>分散到不同產業、不同類型的資產，一家公司出事才不會拖垮全部。</span></li>
    <li><b>買之前查兩個日期</b><span>除息日（除息前買才拿得到這次股息）和財報日（財報前後波動大），個股詳細資料裡都有。</span></li>
    <li><b>三種先不要碰</b><ul>
      <li><span>股息撐不住的：派息率超過 90%，或每股股息比每股盈利多。</span>${live(names(payBad))}${
        reitOver.length ? live('REIT 要先查可分派收入：' + reitOver.map(shortName).join('、')) : ''}</li>
      <li><span>剛上市的創業板（ACE）新股：超額認購幾倍也不代表上市後會漲。</span>${aceLine ? live(aceLine) : ''}</li>
      <li><span>一年跌掉一半以上的題材股：通常是公司出了結構性問題，不是「跌夠了可以撿」。</span>${live(names(crashed))}</li>
    </ul></li>
    <li><b>算清楚成本</b><span>買賣各收券商佣金（線上多為 0.1%–0.42%）、印花稅 0.1%、清算費 0.03%，一買一賣約 0.5%–1%，頻繁進出會把股息吃掉。個人股息所得每年超過 RM10 萬的部分要繳 2% 股息稅（2025 課稅年起，細節請向券商或稅務人員確認）。</span></li>
    <li><b>事先寫好計畫</b><span>買進條件、分幾次買，先寫下來，照計畫執行，不要臨時決定。</span></li>
    <li><b>先留 6 個月生活費，再談投資</b><span>收入不固定的人要留更多。</span></li>
    </ol></div>`, true);

  // ---- 7. 大環境觀點（人工整理、帶日期）。日期用馬來西亞當地日期算，不看手機時區。
  // 過期了：警告寫在卡片裡，副標也寫「已 N 天」（卡片收起時只看得到標題列），而且預設收起，不讓過時的看法佔掉一整屏。
  // 使用者自己按過展開／收起的，照使用者按的
  const age = Math.round((Date.parse(mytToday()) - Date.parse(COMMENTARY.date)) / 864e5);
  const stale = age > COMMENTARY_STALE;
  mcard('an-view', '大環境觀點', esc(nb(COMMENTARY.date)) + (stale ? ` · 已 ${age} 天` : ''),
    (stale ? `<div class="an-warn">這段觀點已超過 ${age} 天，數字可能過時</div>` : '') +
    `<div class="an-txt"><ul class="an-ol">${COMMENTARY.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <details class="an-srch"><summary>來源（${COMMENTARY.sources.length}）</summary>
      <ul class="an-src">${COMMENTARY.sources.map(x =>
        `<li><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a></li>`).join('')}</ul></details>
      <p class="an-foot">這段是人工整理的看法，不會自動更新。</p></div>`, stale);
}

function render(){
  renderPulse();
  renderHeadlines();
  renderBrief();
  renderWatch();
  renderMovers();
  renderIPO();
  $('#title').textContent = isEn() ? EN_TITLE : D.title;   // 英文模式的標題固定，不經字典也不經機器翻譯
  $('#updated').textContent = D.updated_at;
  paintFresh();

  $('#head').innerHTML = '<tr>' + COLS.map(c =>
    `<th data-k="${c.k}" class="c-${c.k}">${c.t}<span class="a">${
      sortKey===c.k ? (sortDir>0?'▲':'▼') : (c.t?'⇅':'')}</span></th>`).join('') + '</tr>';
  $('#head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = COLS.find(x=>x.k===th.dataset.k);
    if(c.nosort) return;
    if(sortKey===c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.dir || -1; }
    render();
  });

  const body = $('#body'); body.innerHTML = '';

  const pinned = favs.map(sym => D.stocks.find(s => s.symbol === sym)).filter(Boolean);

  // 分頁列：沒有最愛就不顯示那一頁
  const tabs = TABS.filter(t => t.t !== '最愛' || pinned.length);
  if(!tabs.some(t => t.t === activeTab)) activeTab = pinned.length ? '最愛' : '銀行';
  const countOf = t => t.secs === null ? pinned.length
                     : D.stocks.filter(s => t.secs.includes(s.sector)).length;
  // 「分析」不是清單，不標檔數
  $('#tabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.t===activeTab?'on':''}" type="button" data-t="${t.t}">${tabName(t.t)}${
      t.view ? '' : `<span class="n">${countOf(t)}</span>`}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    activeTab = b.dataset.t;
    try { localStorage.setItem(TAB_KEY, activeTab); } catch(e) {}
    openSym = null;
    // 刻意不捲動。原本會捲回最上面，但使用者往往是看到一半才換分頁，
    // 畫面突然跳走很惱人。切到較短的分頁時瀏覽器本來就會自己收斂位置。
    render();
  });

  const tab = tabs.find(t => t.t === activeTab);
  // 分析分頁：藏起表格、畫分析。表格內容上面已經清空，不必再排一次
  const an = tab.view === 'analysis';
  $('#tablewrap').hidden = an;
  $('#analysis').hidden = !an;
  if(an){ renderAnalysis(); return; }
  const groups = [];
  if(tab.secs === null){
    groups.push(['最愛', pinned]);
  } else if(activeTab === '全部'){
    // 只有「全部」需要把最愛釘到最上面；其他分頁本來就已經聚焦了
    if(pinned.length) groups.push(['最愛', pinned]);
    ORDER.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec && !isFav(s.symbol));
      if(list.length) groups.push([sec, list]);
    });
  } else {
    tab.secs.forEach(sec => {
      const list = D.stocks.filter(s => s.sector === sec);
      if(list.length) groups.push([sec, list]);
    });
  }

  groups.forEach(([sec, group]) => {
    let list = group;

    if(sortKey && sec !== '最愛'){
      const g = COLS.find(c=>c.k===sortKey).sort;
      list = [...list].sort((a,b)=>{
        const av=g(a), bv=g(b);
        if(av==null) return 1; if(bv==null) return -1;
        return typeof av === 'string' ? sortDir*av.localeCompare(bv,'zh-Hant') : sortDir*(av-bv);
      });
    }

    const gr = document.createElement('tr');
    gr.className = 'group';
    gr.innerHTML = `<td colspan="${COLS.length}">${tabName(sec)}</td>`;
    body.appendChild(gr);

    list.forEach(s => {
      const tr = document.createElement('tr');
      tr.className = 'row' + (openSym===s.symbol ? ' on' : '');
      tr.innerHTML = COLS.map(c=>`<td class="c-${c.k}">${c.cell(s)}</td>`).join('');
      tr.onclick = ev => {
        const star = ev.target.closest('.star');
        if(star){                              // 點星星只切換最愛，不展開
          ev.stopPropagation();
          toggleFav(star.dataset.fav);
          render();
          return;
        }
        if(isMobile()){ openSheet(s); return; }
        openSym = openSym === s.symbol ? null : s.symbol;
        render();
      };
      body.appendChild(tr);
      if(openSym === s.symbol && !isMobile()){
        const d = detailRow(s);
        body.appendChild(d);
        d._redraw();                         // 插入後才畫圖，這樣量得到實際寬度
        showStockLive(s);                    // 3 分鐘內抓過就直接用快取（已經畫在上面了）
      }
    });
  });
}

/* ---------- 點開才翻的內文翻譯 ----------
   批次在伺服器翻不可行：免費 API 在上百篇的量級會直接限流
   （實測 106 篇只成功 16 篇）。改成使用者點開哪篇才翻哪篇，
   用他自己的瀏覽器去打 API，翻完存在本機，再開就是即時的。 */

// 這些翻了會出錯，先換成佔位符保護（Bursa Malaysia 曾被翻成「馬來西亞交易所」）
const KEEP = ['Sentral REIT','IGB REIT','Pavilion REIT','Axis REIT','KLCCP',
  'Bursa Malaysia','Bank Negara','FBM KLCI','Maybank','CIMB','Public Bank',
  'Hong Leong','RHB','AmBank','AMMB','Alliance Bank','Bank Islam','Affin',
  'MBSB','MRCB','YTL','Gamuda','Sunway','Zetrix','Inari','ViTrox','Frontken',
  'TIME dotCom','Mah Sing','NVIDIA','Broadcom','Palantir','Nasdaq',
  'OPR','DPU','NPI','EPS','ROE','NIM','EPF','KWAP','REIT','REITs','GDP','RM'];

// 金融慣用語對照（由 translate.py 的 PHRASES 產生，兩邊一致）。
// 機器翻譯會把 bargain hunting 翻成「特價狩獵」、at opening 翻成「打開便宜貨」，
// 先換成佔位符、翻完再換成正確中文。
const PHRASES = [["what to expect on (Bursa Malaysia|Bursa|the market)", "\\1 盤前展望："], ["bargain[- ]hunting (emerges|returns|kicks in)", "逢低買盤進場"], ["bargain[- ]hunting", "逢低買盤"], ["profit[- ]taking", "獲利了結"], ["window[- ]dressing", "作帳行情"], ["foreign buying", "外資買盤"], ["foreign (funds|investors) (net )?(sold|sell|dumped)", "外資賣超"], ["foreign (funds|investors) (net )?(bought|buy)", "外資買超"], ["net (sellers|selling)", "賣超"], ["net (buyers|buying)", "買超"], ["at (the )?open(ing)?( bell)?", "開盤時"], ["at (the )?(mid-?day|midday) break", "午盤時"], ["at (the )?close(?! to)", "收盤時"], ["opens? sharply higher", "大幅開高"], ["opens? sharply lower", "大幅開低"], ["opens? slightly higher", "小幅開高"], ["opens? slightly lower", "小幅開低"], ["(ends?|closes?|finish(es)?) sharply higher", "大幅收高"], ["(ends?|closes?|finish(es)?) sharply lower", "大幅收低"], ["(ends?|closes?|finish(es)?) slightly higher", "小幅收高"], ["(ends?|closes?|finish(es)?) slightly lower", "小幅收低"], ["opens? higher", "開高"], ["opens? lower", "開低"], ["(ends?|closes?|finish(es)?) higher", "收高"], ["(ends?|closes?|finish(es)?) lower", "收低"], ["(retreats?|retreated|pulls? back) sharply", "大幅回落"], ["(falls?|fell|drops?|dropped|slides?|slid|slumps?|slumped) sharply", "大幅下跌"], ["(rises?|rose|climbs?|climbed|gains?|gained|jumps?|jumped) sharply", "大幅上漲"], ["(rebounds?|rebounded) sharply", "大幅反彈"], ["sharply", "大幅"], ["caution lingers", "謹慎情緒未退"], ["cautious sentiment", "謹慎情緒"], ["risk-off", "避險情緒"], ["risk-on", "風險偏好回升"], ["blue[- ]chips?", "藍籌股"], ["key index", "綜合指數"], ["benchmark index", "基準指數"], ["(rising|higher) (bond )?yields", "殖利率上升"], ["rate cut", "降息"], ["rate hike", "升息"], ["private placement", "私募配售"], ["rights issue", "附加股發行"], ["bonus issue", "紅股發行"], ["final (single[- ]tier )?dividend", "末期股息"], ["(first |second )?interim (single[- ]tier )?dividend", "中期股息"], ["special (single[- ]tier )?dividend", "特別股息"], ["single[- ]tier dividend", "單層股息"], ["dividend", "股息"], ["target price", "目標價"], ["upgrade[sd]?", "調升評級"], ["downgrade[sd]?", "調降評級"]].map(
  ([p, zh]) => [new RegExp('\\b' + p + '\\b', 'gi'), zh]);

// 翻完之後中文換中文（跟 translate.POST 同一份）：「外國拋售壓力」→「外資賣壓」
const POST = [["(外國|海外|外資)(投資者)?(的)?拋售(壓力)?", "外資賣壓"], ["拋壓壓力|拋售壓力", "賣壓"], ["逢低吸收", "逢低買盤"], ["(國外|海外|外國)銷售", "外資賣壓"], ["馬來西亞證券交易所|大馬交易所", "馬交所"]].map(([p, zh]) => [new RegExp(p, 'g'), zh]);

const TR_KEY = 'tr_cache';
function trCache(){
  try { return JSON.parse(localStorage.getItem(TR_KEY)) || {}; } catch(e) { return {}; }
}
function trSave(c){
  try {
    const keys = Object.keys(c);
    if(keys.length > 600) keys.slice(0, keys.length - 600).forEach(k => delete c[k]);   // 標題也存，120 則太快被擠掉
    localStorage.setItem(TR_KEY, JSON.stringify(c));
  } catch(e) {}
}
const trKey = t => t.length + '|' + t.slice(0, 60) + '|' + t.slice(-30);

function chunk(text, size = 450){
  const out = [];
  let buf = '';
  for(const sen of text.split(/(?<=[.!?])\s+/)){
    if(buf.length + sen.length > size && buf){ out.push(buf.trim()); buf = ''; }
    buf += sen + ' ';
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

async function gtranslate(part){
  const marks = [];
  let held = part;
  for(const [re, zh] of PHRASES){
    held = held.replace(re, (...m) => {
      const tok = 'ZZ' + marks.length + 'ZZ';
      // 對照表裡的 \\1 代表第一個括號，逐一代換
      marks.push(zh.replace(/\\(\d)/g, (_, n) => m[+n] || '').trim());
      return tok;
    });
  }
  for(const term of [...KEEP].sort((a, b) => b.length - a.length)){
    const re = new RegExp('\\b' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    if(!re.test(held)) continue;
    const tok = 'ZZ' + marks.length + 'ZZ';
    held = held.replace(re, tok);
    marks.push(term);
  }
  // 兩個 Google 入口：clients5 比較不會被限流（跟 translate.py 同樣順序），失敗才換 gtx
  let zh = '';
  try {
    const data = await tfetchJSON('https://clients5.google.com/translate_a/t?client=dict-chrome-ex' +
                                  '&sl=en&tl=zh-TW&q=' + encodeURIComponent(held), {}, 10e3);
    zh = String(Array.isArray(data[0]) ? data[0][0] : data[0] || '');
  } catch(e) {
    const data = await tfetchJSON('https://translate.googleapis.com/translate_a/single' +
                                  '?client=gtx&sl=en&tl=zh-TW&dt=t&q=' + encodeURIComponent(held), {}, 10e3);
    zh = (data[0] || []).map(x => x[0]).filter(Boolean).join('');
  }
  // 佔位符必須原封不動回來，否則寧可放棄這一段
  if(!marks.every((_, i) => zh.includes('ZZ' + i + 'ZZ'))) throw new Error('專有名詞還原失敗');
  marks.forEach((term, i) => { zh = zh.split('ZZ' + i + 'ZZ').join(term); });
  for(const [re, to] of POST) zh = zh.replace(re, to);
  return zh.replace(/([，。、；：！？（）])\s+/g, '$1').trim();
}

/* 標題翻譯的後備：雲端批次翻譯偶爾被 Google 限流，標題就原樣留英文。
   打開畫面時把還是英文的標題在瀏覽器裡現翻（跟全文一樣存在手機上，下次不再翻）。
   一次只翻一則，遇到限流就停，不要連續打一堆請求。 */
const hasCJK = t => /[\u4e00-\u9fff]/.test(t || '');
// 中文報導：即時抓的有標 lang；news.json／klsescreener 轉來的那份不一定有，標題是中文就算
// （不然彈窗會把簡體標題放在「ENGLISH」底下，還多一顆沒用的「原文」）
const isZh = n => n.lang === 'zh' || (!n.lang && hasCJK(n.title));
// App 裡讀得到全文：即時抓的中文報內文在 LIVE_BODY，雲端翻好的在 body_zh
const zhFull = n => LIVE_BODY.has(n.url) || !!n.body_zh;
// 標題已經有像樣的中文：英文要翻成中文；簡體要轉過（轉失敗時雲端會原樣放簡體）
const goodZh = n => !!n.title_zh && (isZh(n) ? n.title_zh !== n.title : hasCJK(n.title_zh));
async function fillZh(root){
  if(isEn()) return;                             // 英文模式：英文標題本來就直接顯示，不用翻成中文
  for(const el of root.querySelectorAll('[data-en]')){
    const en = el.dataset.en;
    if(!en || hasCJK(el.dataset.zh)) continue;
    let zh;
    try { zh = await translateBody(en); } catch(e) { return; }
    if(!hasCJK(zh)) continue;
    el.dataset.zh = zh;
    const t = el.querySelector('.t, .it');
    if(t) t.textContent = zh;
    const im = el.querySelector('.im');
    if(im && !im.querySelector('.orig'))
      im.insertAdjacentHTML('beforeend', '<button class="orig" type="button">原文</button>');
  }
}

// 翻好的先記在記憶體：手機儲存空間滿了或被擋（無痕模式）時 localStorage 存不進去，
// 只靠它的話每次重畫都要重翻一次
const TR_MEM = new Map();
async function translateBody(text){
  const key = trKey(text);
  if(TR_MEM.has(key)) return TR_MEM.get(key);
  const hit = trCache()[key];
  if(hit){ TR_MEM.set(key, hit); return hit; }
  const parts = chunk(text);
  const out = [];
  for(const p of parts) out.push(await gtranslate(p));
  const zh = out.join('');
  TR_MEM.set(key, zh);
  const cache = trCache();                     // 重新讀一次，別蓋掉翻譯這段時間別處存進去的
  cache[key] = zh;
  trSave(cache);
  return zh;
}

/* ---------- 原文彈出視窗 ----------
   機器翻譯遇到金融術語一定會有偏差，要能隨時叫出原文對照。
   用彈窗而不是 title 提示，因為手機沒有 hover。 */
const isMobile = () => matchMedia('(max-width:700px)').matches;

/* ---------- 手機的個股面板 ---------- */
const sheet = document.getElementById('sheet');
let sheetSym = null;                           // 面板目前開著的那一檔（沒開是 null）

function openSheet(s){
  const star = document.getElementById('sh-star');
  const paint = () => {
    star.innerHTML = STAR(isFav(s.symbol));
    star.classList.toggle('on', isFav(s.symbol));
  };
  paint();
  star.onclick = ev => {
    ev.stopPropagation();
    toggleFav(s.symbol);
    paint();
    render();                                  // 底下的列表同步更新
  };

  sheetBar(s);

  const host = document.getElementById('sh-body');

  host.appendChild(row.querySelector('.dbox'));
  sheet.classList.add('on');
  document.body.style.overflow = 'hidden';
  row._redraw();
  wireCalculator(host);
  showStockLive(s);                            // 背景去抓這一檔的即時新聞，抓到再補進「媒體報導」
}

// 面板頂端的名稱與股價；news.json 帶來盤中報價時也用這個就地更新
function sheetBar(s){
  document.getElementById('sh-name').textContent = nameEn(s.name);

function closeSheet(){

document.getElementById('sh-x').onclick = closeSheet;
sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });

const ovl = document.getElementById('ovl');

function showOriginal(item){
  const d = item.dataset;
  if(d.lang === 'zh') return showZhArticle(item);          // 大馬中文報：沒有英文原文，直接讀全文
  const dlg = ovl.querySelector('.dlg');

  if(isEn()){
    // 英文模式：標題和內文直接用英文原文，沒有「機器翻譯」那一段；
    // 只有中譯、沒有原文的（少見）就放中譯，畫面上的觀察器會再翻成英文。
    // 公告標題跟清單一樣先查字典（Substantial shareholder's interest — KWAP），查不到才用 Bursa 的大寫原標題

      ${body ? `<div class="dsec"><div class="k">內文</div>

      <div class="dfoot"><span>${esc(d.src || '')}</span>

    dlg.scrollTop = 0;
    ovl.classList.add('on');
    return;
  }

  const needs = !bodyZh && bodyEn;                          // 要在瀏覽器現翻
  dlg.innerHTML = `
    <h5>${bodyEn || bodyZh ? '全文' : '原文對照'}
      <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">標題</div>
      <div class="zh" style="font-weight:600">${esc(d.zh)}</div></div>
    ${(bodyZh || needs) ? `<div class="dsec"><div class="k">內文（機器翻譯）</div>
      <div class="zh" id="ovl-body">${bodyZh ? esc(bodyZh).replace(/\n/g, '<br>')
        : '<span class="tload">翻譯中⋯</span>'}</div></div>` : ''}
    <div class="dsec"><div class="k">ENGLISH</div>
      <div class="en" style="font-size:13px">${esc(d.en)}</div>
      ${bodyEn ? `<div class="en" style="font-size:12.5px;color:var(--read);margin-top:7px">
        ${esc(bodyEn).replace(/\n/g, '<br>')}</div>` : ''}</div>
    <div class="dfoot"><span>${esc(d.src || '')}</span>
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">開啟來源網頁 →</a>` : ''}</div>`;
  ovl.classList.add('on');

  if(needs){
    const slot = dlg.querySelector('#ovl-body');

        slot.innerHTML = '<span class="tfail">翻譯失敗（' + esc(e.message) +
          '）。下方有英文原文。</span>';
      });
  }
}

/* 大馬中文報（星洲／南洋／中國報）的全文：搜尋 API 就附了完整內文，
   在 App 裡直接讀，不用跳去對方網站（使用者特別要的）。原文是簡體，打開時才轉繁體。 */

    <h5>${raw || ready ? '全文' : '報導'} <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">標題</div>
      <div class="zh" style="font-weight:600">${esc(d.zh)}</div></div>
    ${raw || ready ? `<div class="dsec"><div class="k">內文</div>
      <div class="zh" id="ovl-body"><span class="tload">轉成繁體中文⋯</span></div></div>` : ''}
    <div class="dfoot"><span>${esc(d.src || '')}</span>
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">開啟來源網頁 →</a>` : ''}</div>`;
  dlg.scrollTop = 0;
  ovl.classList.add('on');
  if(!raw && !ready) return;
  const slot = dlg.querySelector('#ovl-body');
  const paint = (t, note) => {
    if(!slot.isConnected) return;                           // 已經關掉或換成別篇了
    slot.innerHTML = (note ? `<p class="tfail">${note}</p>` : '') +
      t.split('\n').map(p => `<p>${esc(p)}</p>`).join('');
  };
  if(ready) return paint(ready);
  tradBody(d.key, raw).then(t => paint(t))
    .catch(() => paint(raw, '轉繁體失敗，以下是簡體原文。'));
}

/* ---------- 即時新聞 ----------
   9/29 銀行股連跌，頁面上卻看不出來：資料靠 GitHub 排程更新，
   實測「每 3 小時」的排程要 1.6～6.5 小時才真的跑一次，等資料進來早就收盤了。
   所以新聞另外走兩條路：
   1. news.json：伺服器端只抓新聞的工作（news 分支，約 5～15 分鐘一次），
      帶 Google News、Bursa 公告、漲跌排行、追蹤股的盤中報價
   2. 瀏覽器自己抓：星洲、南洋、中國報的搜尋 API，The Edge、Business Today
   打開頁面、切回前景、看著畫面時抓：大盤快訊每 3 分鐘，追蹤股票的類股／最愛查詢每 9 分鐘
   （每篇搜尋結果都附全文，一輪就是幾百 KB，手機流量吃不消）。
   任何一個來源失敗就當作沒有：不擋畫面、不跳錯誤。 */
const LIVE_MS = 180e3;
// 追蹤股票的查詢一次涵蓋一整週的報導，晚幾分鐘看到差別不大
const WATCH_MS = 540e3;
// 個股的快取比 3 分鐘短一點：refreshLive 先抓完大盤才輪到個股，兩輪之間會比 3 分鐘少幾秒，
// 快取若剛好 3 分鐘，每隔一輪就被「還沒過期」跳過，變成 6 分鐘才更新一次
const STOCK_MS = LIVE_MS - 30e3;
// api.github.com 推送後約 20 秒就拿得到新檔，但沒登入每小時只能 60 次；
// 被限流時退回 raw.githubusercontent.com（有 5 分鐘快取，但不限次數）
const NEWS_RAW = 'https://raw.githubusercontent.com/evolee1100/stockchecker/news/news.json';

// 瀏覽器抓到的大盤快訊、追蹤股票新聞。tried：第一輪抓過了沒（抓到之前「追蹤股票最新」先佔位）
let LIVE = {market: [], watch: [], at: 0, tried: false, watchOk: false, sig: ''};
const LQ = new Map();                          // 每個查詢上一次成功的結果：「網站|關鍵字」→ {t, items}
const LIVE_BODY = new Map();                   // 中文報全文（簡體）：網址 → 內文
const stockLive = new Map();                   // 個股即時新聞：代號 → {t, items}
const stockPending = new Map();
let newsTs = 0, liveTs = 0;                    // news.json 的產生時間、瀏覽器上次抓成功的時間（秒）
let newsWait = 0, apiWait = 0;                 // 404／被限流後先暫停一陣子

// 逾時就放棄：手機訊號差時一個來源卡住，不能拖住其他來源。
// 計時一直算到內文讀完：以前表頭一到就停表，內文傳到一半卡住時 res.json() 永遠等不完，
// 整輪即時更新跟著卡死（liveBusy 一直是 true，之後每一輪都被跳過）
async function tfetchJSON(url, opt = {}, ms = 8000){
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const res = await fetch(url, {...opt, signal: ac.signal});
    if(!res.ok) throw Object.assign(new Error('回應 ' + res.status), {status: res.status});
    return await res.json();
  } catch(e) {
    if(ac.signal.aborted) throw new Error('逾時');
    throw e;
  } finally { clearTimeout(t); }
}

// HTML 實體（&amp;、&#8217;）與殘留標籤轉成純文字
function plain(html){
  const s = String(html || '').replace(/<br\s*\/?>|<\/p>/gi, '\n');
  if(!/[<&]/.test(s)) return s;
  return new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
}

const normT = t => (t || '').toLowerCase().replace(/[^0-9a-z一-鿿]/g, '');
const tsOf = n => n.ts || (n.date ? Date.parse(n.date + 'T00:00:00+08:00') / 1000 || 0 : 0);
// 出版社名稱各來源寫法不同：「BusinessToday Malaysia」「businesstoday.com.my」「Business Today」是同一家
const pubOf = s => String(s || '').toLowerCase().replace(/\.com|\.my|www\.|malaysia/g, '').replace(/[^0-9a-z一-鿿]/g, '');
// WordPress 網址的最後一段就是原本的標題（stock-today-maybank-holds-steady-…）。
// Google News 那份只有轉址網址，對方事後改了標題時，拿這段還對得上
function slugOf(u){
  try {
    const seg = new URL(u).pathname.split('/').filter(Boolean).pop() || '';
    return /^[a-z0-9]+(-[a-z0-9]+){3,}$/.test(seg) ? normT(seg) : '';
  } catch(e) { return ''; }
}
// 判斷「同一篇」用的鍵：網址、標題（原文、中譯、網址裡的標題）；
// 另外「同一家、同一秒發的」也算，但標題要夠像（p: 開頭，見 dedupe），免得同一秒排程發出的兩篇被併掉。
// 公告只看網址：EPF 每週的持股變動標題一模一樣，但每一則都是不同的申報
function dupKeys(n, urlOnly){
  const ks = [n.url, n.source_url];
  if(!urlOnly){
    for(const t of [normT(n.title), normT(n.title_zh), slugOf(n.url), slugOf(n.source_url)]) if(t) ks.push('t:' + t);
    if(n.ts && n.source) ks.push('p:' + pubOf(n.source) + '|' + Math.round(n.ts));
  }
  return ks.filter(Boolean);
}
const words = n => new Set(String(n.title || '').toLowerCase().match(/[a-z0-9]{3,}|[一-鿿]{2}/g) || []);
function near(a, b){
  const A = words(a), B = words(b);
  let c = 0;
  A.forEach(w => { if(B.has(w)) c++; });
  return c > 0 && c >= 0.5 * Math.min(A.size, B.size);
}
// 同一篇的兩份併成一份，不是丟掉後來那份：data.js 那份常有內文、中譯、持股變動（move），
// news.json 那份沒有；即時抓的中文報那份網址對得到 LIVE_BODY，App 裡才讀得到全文。
// 所以有全文的即時中文報當底，其餘欄位哪一份有就用哪一份
const FILL = ['title_zh', 'body', 'body_zh', 'move', 'source_url', 'source_zh', 'ts', 'date', 'when', 'lead', 'tax', 'stocks'];
const blank = v => v == null || v === '' || (Array.isArray(v) && !v.length);
function mergeItem(a, b){
  const full = n => isZh(n) && LIVE_BODY.has(n.url);
  if(full(b) && !full(a)) [a, b] = [b, a];
  const m = {...a};
  for(const k of FILL) if(blank(m[k]) && !blank(b[k])) m[k] = b[k];
  // 留下的是 Google News 轉址那份：另一份的網址就是原站，「開啟來源網頁」直接去那裡
  if(!m.source_url && /news\.google\.com/.test(m.url) && b.url && !/news\.google\.com/.test(b.url)) m.source_url = b.url;
  if(!goodZh(m) && goodZh(b)) m.title_zh = b.title_zh;
  if(!m.lang && b.lang) m.lang = b.lang;
  if(b.live) m.live = true;
  return m;
}
// 同一篇常會從兩個來源進來（Google News 和 The Edge 各一份、data.js 和 news.json 各一份）
function dedupe(list, urlOnly){
  const at = new Map(), out = [];
  for(const n of list){
    const ks = dupKeys(n, urlOnly);
    let i = -1;
    for(const k of ks){
      if(!at.has(k)) continue;
      const j = at.get(k);
      if(k.startsWith('p:') && !near(out[j], n)) continue;
      i = j;
      break;
    }
    if(i < 0){ i = out.length; out.push(n); }
    else out[i] = mergeItem(out[i], n);
    ks.forEach(k => { if(!at.has(k)) at.set(k, i); });
  }
  return out;
}
const newest = (list, urlOnly) => dedupe(list, urlOnly).sort((a, b) => tsOf(b) - tsOf(a));

/* 大馬三家中文報的搜尋 API（允許跨網域，瀏覽器可以直接打）。
   注意：它們的搜尋是「每個關鍵字都要出現」——寫 A OR B 時 OR 被當停用字丟掉，
   實測「MAYBANK OR ZETRIX」只回同時提到兩家的文章。所以一次只查一個詞。
   單一關鍵字時照時間新到舊排，一頁 10 篇，每篇附完整內文（簡體）。 */
const SITES = {

/* ---------- 語言設定：中文／English ----------
   整個網頁（介面、資料、翻譯）都是繁體中文寫的，英文不另外維護一套頁面：
   選「EN」時載入 lang-en.js（字典：整句對照 exact ＋ 帶數字的樣板 rules），
   用 MutationObserver 把畫面上出現的每一段文字當場換成英文——之後不管哪裡重畫、
   彈窗、提示，都會自動換，不必在每個 render 裡各加一次。
   字典查不到、又含中文的，攢成一批送 Google 機器翻譯（寫回前核對數字一個都沒變）。
   切回「中文」直接重新載入：畫面上的字已經是英文，沒有英→中的字典可以轉回去。 */
const LANG_KEY = 'lang';
// 舊版存的是 zh-Hant／zh-Hans（繁簡切換，已拿掉）：除了 en 一律當中文，
// 而且順手改寫成 zh——同一個網域的舊分頁或舊版頁面讀到舊值才不會各自解讀
let lang = (() => {
  try {
    const v = localStorage.getItem(LANG_KEY);
    if(v && v !== 'en' && v !== 'zh') localStorage.setItem(LANG_KEY, 'zh');
    return v === 'en' ? 'en' : 'zh';
  } catch(e) { return 'zh'; }
})();
const isEn = () => lang === 'en';
const EN_TITLE = 'Bursa Daily Tracker';
let UI = null;                                   // lang-en.js 編譯後的 {exact, rules}；rules 的正規式只編譯一次
let enObs = null, enLoading = null;

function paintLang(){
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.documentElement.lang = isEn() ? 'en' : 'zh-Hant';
}

// 一段文字查字典：先整句對照，再試樣板規則（規則作者自己用 ^…$ 定界，第一條對到又換乾淨的算數）；
// 整段對不到就在句號處拆成一句一句各查——重點報導的「公告」列是兩句樣板接起來的（KWAP 申報 2 次…。 EPF 增持…。），
// 每一句字典都有，整列當一句卻永遠對不到，只好送機器翻譯，而機器翻譯把「2 次」寫成 twice，數字核對過不了，那一列就永遠留著中文。
// 前後空白原樣保留（樣板字串常帶換行縮排），中間連續空白併成一格再查，規則才不用管排版。
// 回傳 null 表示字典沒有、要送機器翻譯；沒有中文的一律原樣回傳，所以換好的節點不會再被動到
function toEn(text){
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(text);
  if(!hasCJK(m[2])) return text;
  if(!UI) return null;
  const q = m[2].replace(/\s+/g, ' ');
  let out = enLookup(q);
  if(out === null){
    // 兩句以上才拆；每一句都要查得到，少一句就整段送機器翻譯（半英半中更難讀）
    const parts = q.split(/(?<=。)\s*(?=\S)/);
    if(parts.length > 1){
      const done = parts.map(enLookup);
      if(done.every(p => p !== null)) out = done.join(' ');
    }
  }
  return out === null ? null : m[1] + tidy(out) + m[3];
}
// 一句查字典（整句對照 → 樣板規則）；查不到回 null
function enLookup(q){
  if(!hasCJK(q)) return q;
  const hit = UI.exact[q];
  if(hit != null) return hit;
  for(const [re, to, n] of UI.rules){
    if(!re.test(q)) continue;
    // 自己展開 $1…$14 與 $$（字典的長句樣板用到十個以上的括號）。
    // 換完還夾著中文的規則不算數：「大股東減持 8,617,400 股」曾被去股名尾巴的規則削成
    // 「大股東減持 8,617,400」寫上畫面，從此沒人再翻它；寧可整句送機器翻譯
    const out = q.replace(re, (...g) => to.replace(/\$(\$|\d\d?)/g, (_, d) => {
      if(d === '$') return '$';
      let i = +d, tail = '';
      if(i > n && d.length === 2){ i = +d[0]; tail = d[1]; }
      return capEn(g[i] || '') + tail;
    }));
    if(hasCJK(out)) continue;
    // 只把尾巴砍掉、一個字都沒換的，不算翻譯：去股票名中文尾巴的規則（Maybank 馬來亞銀行 → Maybank）
    // 也會把「8.22 倍」削成「8.22」、「P/B 0.97（低於帳面淨值）」削成「P/B 0.97」，那是把意思砍掉。
    // 只有追蹤清單裡的股票名例外（股票名在 nameEn 已先換好，這裡是保險）
    if(q.startsWith(out) && out.length < q.length && !isStockName(q)) continue;
    return out;
  }
  return null;
}
// 括號抓到的若是中文（報社名、股票名、主題「派息、併購、人事」），再查整句對照；
// 頓號隔開的清單逐項查，全部查得到才換（有一項查不到就原樣留著中文，外面會判這條規則不算數）
function capEn(v){
  if(!hasCJK(v)) return v;
  const hit = UI.exact[v];
  if(hit != null) return hit;
  if(!v.includes('、')) return v;
  const items = v.split('、').map(x => x.trim()).map(x => hasCJK(x) ? UI.exact[x] : x);
  return items.every(x => x != null) ? items.join(', ') : v;
}
// 字典換出來的英文偶爾夾著全形標點（規則照抄括號裡的「10/9：」、「（」）：換成半形，英文讀者才不覺得怪。
// hasCJK 只看漢字，全形冒號它不管，所以得在這裡處理
const tidy = s => /[：，；、。（）％]/.test(s)
  ? s.replace(/：/g, ': ').replace(/[，、]/g, ', ').replace(/；/g, '; ').replace(/。/g, '. ')
     .replace(/（/g, ' (').replace(/）/g, ')').replace(/％/g, '%').replace(/ {2,}/g, ' ').replace(/\s+$/, '')
  : s;
let namesOf = null, NAMES = new Set();
function isStockName(t){
  if(namesOf !== D){ namesOf = D; NAMES = new Set(((D && D.stocks) || []).map(s => s.name)); }
  return NAMES.has(t);
}
// 股票名在資料層先換好：「Maybank 馬來亞銀行」只留英文那半；整個是中文的（台積電 ADR、美元兌馬幣）查字典。
// 砍完還有中文的（馬股 AI 概念股）不砍，留給字典或機器翻譯整句處理
const NAME_TAIL = /^(\S.*?[A-Za-z0-9)])\s+[㐀-鿿（）]+$/;
function nameEn(name){
  if(!isEn() || !hasCJK(name || '')) return name;
  const hit = UI && UI.exact[name];
  if(hit != null) return hit;
  const cut = name.replace(NAME_TAIL, '$1');
  return hasCJK(cut) ? name : cut;
}

/* 機器翻譯的後備：字典沒有的句子攢 150 ms 送一批（一次重畫只打一兩個請求），
   翻好的記在記憶體 + localStorage（en_cache，最多 1500 條，先進先出；全文段落太長只留記憶體）。
   寫回畫面前要確認節點還是原來那句（期間可能已重畫），而且數字一個都不能變。 */
const EN_KEY = 'en_cache', EN_CAP = 1500;
const EN_MEM = new Map();
function enLoad(){
  try { for(const [k, v] of Object.entries(JSON.parse(localStorage.getItem(EN_KEY)) || {})) EN_MEM.set(k, v); }
  catch(e) {}
}
function enPersist(){
  while(EN_MEM.size > EN_CAP) EN_MEM.delete(EN_MEM.keys().next().value);
  try {
    const o = {};
    for(const [k, v] of EN_MEM) if(k.length <= 400) o[k] = v;
    localStorage.setItem(EN_KEY, JSON.stringify(o));
  } catch(e) {}
}
// 數字核對：把兩邊的數字都換算成「量」再比——中文報的「3.96億」機器翻譯會寫成「396 million」，
// 量沒變就不算改數字；寫成「3.96 billion」量差十倍才是真的翻錯。千分位、%、句尾句點都不影響。
// 中文裡的每一個量都要原樣出現在英文裡、個數也要一樣；英文多出來的只放行「光溜溜的一兩位整數」，
// 而且中文裡要有國字數量詞——「一個月」譯成「1-month」、「半年」譯成「6 months」是把國字寫成數字，不是改數字
const SCALE = {'萬': 1e4, '万': 1e4, '億': 1e8, '亿': 1e8, '兆': 1e12, '千': 1e3, k: 1e3, thousand: 1e3,
               m: 1e6, mn: 1e6, mil: 1e6, million: 1e6, b: 1e9, bn: 1e9, bil: 1e9, billion: 1e9, trillion: 1e12};
// 全形的「９％」「，」先換成半形：中文報標題常用全形百分號，不換的話「跌破9％」對上「below 9%」永遠對不齊，
// 那一則就一直留著中文。英文的 twice 當 2（「申報 2 次」機器翻譯愛寫 twice）；once 不管，once again 太常見
const halfWidth = t => t.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))
                        .replace(/％/g, '%').replace(/，/g, ',').replace(/．/g, '.').replace(/−/g, '-')
                        .replace(/\btwice\b/gi, '2');
// 負號一起抓（前面不是字母、數字、小數點或 % 才算：2026-09-30 的連字號不是負號）：
// 「-4.5%」譯成「4.5%」是把跌說成漲。正號不管，「+2.41%」寫成「up 2.41%」意思沒變
const NUM_RE = /((?:(?<![\w.%])-)?\d[\d,]*(?:\.\d+)?)(?:\s?(%|per ?cent|percent|萬|万|億|亿|兆|千|thousand|million|mil|mn|m|billion|bil|bn|b|trillion|k)(?![A-Za-z]))?/gi;
const NUMS = t => [...halfWidth(t).matchAll(NUM_RE)].map(m => {
  const v = parseFloat(m[1].replace(/,/g, ''));
  const u = (m[2] || '').toLowerCase().replace(/\s/g, '');
  return /^(%|percent)$/.test(u) ? v + '%' : String(+(v * (SCALE[u] || 1)).toPrecision(12));
});
// 國字數字後面要接量詞（一個月、半年、十日、三次）才算數量詞；「十分嚴重」的「十」不是，
// 不然機器翻譯憑空捏一個小數字進來也混得過去
const ZH_COUNT = /[一二三四五六七八九十兩半](?=[個月年日天週季檔次倍成則筆家位項度])/;
function numsOk(zh, en){
  const left = NUMS(en);
  for(const n of NUMS(zh)){
    const i = left.indexOf(n);
    if(i < 0) return false;                      // 中文裡的數字在英文裡不見了或被改了（例如 2026-09-30 改寫成英文日期）
    left.splice(i, 1);
  }
  return !left.length || (ZH_COUNT.test(zh) && left.every(n => /^\d{1,2}$/.test(n)));
}
// 大馬中文報寫「3.96億」「2500元」指的都是令吉，機器翻譯常擅自寫成 RMB／yuan（人民幣）：
// 原文沒提人民幣的一律改回 RM／ringgit。量沒變，數字核對照樣過得了，所以得另外擋
function fixCurrency(zh, en){
  if(/人民幣|人民币|RMB|CNY|¥/.test(zh)) return en;
  return en.replace(/\bChinese yuan\b/gi, 'ringgit').replace(/\b(?:RMB|CNY)\s?/g, 'RM')
           .replace(/\b(?:yuan|renminbi)\b/gi, 'ringgit');
}
function enOk(zh, en){
  if(!numsOk(zh, en)) return false;              // 數字對不上：寧可留中文
  if(!hasCJK(en)) return true;
  // 還夾著中文：大多是英文就收下（通常是沒翻的專有名詞），不然留中文
  const cjk = (en.match(/[一-鿿]/g) || []).length;
  const lat = (en.match(/[A-Za-z]/g) || []).length;
  return lat >= 4 * cjk;
}
// 太長的段落（中文報全文）在句號處切開：網址有長度上限
function splitLong(text, max = 500){
  const out = [];
  let buf = '';
  for(const sen of text.split(/(?<=[。！？；])/)){
    if(buf && buf.length + sen.length > max){ out.push(buf); buf = ''; }
    buf += sen;
  }
  if(buf) out.push(buf);
  return out.flatMap(p => { const ps = []; for(let i = 0; i < p.length; i += max) ps.push(p.slice(i, i + max)); return ps; });
}

const mtQ = [];                                  // 等著送機器翻譯的 {node, attr, raw, tries, due}
const wrote = new WeakMap();                     // 節點 → 我們最後寫進去的字：翻完仍帶中文的別再送一次
const EN_BAD = new Set();                        // 翻回來數字對不上的句子：這次開頁不再送（再翻還是一樣），也不存快取，下次開頁再試
let mtTimer = 0, mtRetry = 0, mtBusy = false, mtAgain = false;
function mtQueue(node, attr, raw, tries = 0){
  // 重試的隔 3 秒、6 秒再送，別跟剛失敗的那批擠在一起。到期時間記在項目上，計時器只管「最早到期的那一筆」：
  // 以前共用一個計時器、每次排入就重設，第二輪的重試被新排進來的第一輪一再推遲，最後擠成同一批
  mtQ.push({node, attr, raw, tries, due: tries ? Date.now() + 3000 * tries : 0});
  if(tries){ armRetry(); return; }
  clearTimeout(mtTimer);
  mtTimer = setTimeout(() => mtFlush().catch(() => {}), 150);
}
function armRetry(){
  const now = Date.now();
  const next = Math.min(...mtQ.filter(e => e.due > now).map(e => e.due));
  clearTimeout(mtRetry);
  if(isFinite(next)) mtRetry = setTimeout(() => mtFlush().catch(() => {}), next - now);
}
// 送機器翻譯前先把字典認得的專有名詞換成英文（黃天順 → Wong Thean Soon、馬銀行 → Maybank），
// 不然機器翻譯會音譯成 Huang Tianshun，跟字典翻出來的公告對不上。lang-en.js 的 names 可有可無，沒有就原樣送
function preMT(t){
  if(!UI || !UI.names.length) return t;
  for(const [zh, en] of UI.names) t = t.split(zh).join(en);
  return t;
}
const curText = e => e.attr ? e.node.getAttribute(e.attr) : e.node.nodeValue;
const trimCore = raw => /^\s*([\s\S]*?)\s*$/.exec(raw)[1].replace(/\s+/g, ' ');
async function mtFlush(){
  // 上一批還在等 Google 回來：記下來，它回來後再跑一次（佇列裡的東西留著），同一句才不會送兩次
  if(mtBusy){ mtAgain = true; return; }
  mtBusy = true;
  try { await mtFlushNow(); }
  finally {
    mtBusy = false;
    if(mtAgain){ mtAgain = false; mtFlush().catch(() => {}); }
  }
}
async function mtFlushNow(){
  const now = Date.now();
  const later = mtQ.filter(e => e.due > now);    // 還沒到重試時間的留在佇列裡，時間到了計時器會再來
  const groups = new Map();                      // 查詢字串 → 要寫回的節點們
  for(const e of mtQ.splice(0)){
    if(e.due > now) continue;
    if(!e.node.isConnected || curText(e) !== e.raw) continue;   // 送出前就被重畫掉了
    const q = trimCore(e.raw);
    if(!groups.has(q)) groups.set(q, []);
    groups.get(q).push(e);
  }
  mtQ.push(...later);
  const need = [...groups.keys()].filter(q => !EN_MEM.has(q) && !EN_BAD.has(q));
  if(need.length){
    const pieces = need.map(q => q.length > 500 ? splitLong(q) : [q]);
    let out = [];
    try { out = await gBatch(pieces.flat().map(preMT), 'auto', 'en'); } catch(e) {}   // 失敗就留中文，下次重畫再試
    let k = 0;
    pieces.forEach((ps, i) => {
      const parts = ps.map(() => out[k++]);
      if(!parts.every(Boolean)) return;
      const en = fixCurrency(need[i], parts.join(' '));
      // 數字對不上的不存：存了會佔掉快取的位置，之後每次重畫讀到的都是同一句錯的，永遠沒有第二次機會
      if(enOk(need[i], en)) EN_MEM.set(need[i], en); else EN_BAD.add(need[i]);
    });
    enPersist();
  }
  let dropped = false;
  const write = () => {
    for(const [q, list] of groups){
      let en = EN_MEM.get(q);
      if(en && !enOk(q, en)){ EN_MEM.delete(q); EN_BAD.add(q); en = null; dropped = true; }   // 舊版存下來的壞譯文：丟掉
      if(!en){
        if(EN_BAD.has(q)) continue;              // 翻出來的數字對不上：留中文，這次不必再試（再翻還是一樣）
        // 這批沒回來（逾時、被限流）：最多再試兩次，不然那幾句會一直留著中文
        for(const e of list) if(e.tries < 2) mtQueue(e.node, e.attr, e.raw, e.tries + 1);
        continue;
      }
      en = fixCurrency(q, en);                   // 舊版存下來的 RMB 也一併改掉
      for(const e of list){
        if(!e.node.isConnected || curText(e) !== e.raw) continue;
        const m = /^(\s*)[\s\S]*?(\s*)$/.exec(e.raw);
        const v = m[1] + en + m[2];
        if(e.attr) e.node.setAttribute(e.attr, v);
        else { const x = nbDate(v); wrote.set(e.node, x); e.node.nodeValue = x; }   // 日期不折行，見 nbDate
      }
    }
  };
  // 英文標題比中文長一倍，寫回去時整張卡會長高：把讀者正在看的那一塊釘住，內容才不會在手指底下跳走
  keepScroll(write, sheet.classList.contains('on') ? document.querySelector('.sheet-in') : null);
  if(dropped) enPersist();                       // 壞譯文也要從 localStorage 拿掉，下次開頁才會重翻
  if(later.length) armRetry();
  if(enObs) enObs.takeRecords();                 // 丟掉上面自己造成的變動
}

// 一棵子樹裡的文字節點、以及 title／placeholder／aria-label 全部換成英文；字典沒有的排進機器翻譯。
// translate="no" 的元素整棵跳過（語言切換鈕的「中文」就是要用中文寫）
const EN_ATTRS = ['title', 'placeholder', 'aria-label'];
const noTr = el => el.getAttribute('translate') === 'no';
// 英文裡的日期（2026-09-30）連字號換成不折行的連字號（U+2011）：英文句子可以在連字號後面折行，
// 面板裡的「Last trade 2026-09-」「30 10:27」、重點報導的「on 2026-09-」「30」都是這樣斷成兩截（重點的副標也是同一招）。
// 只在寫上畫面的那一刻換：字典規則、數字核對看到的都還是原本的連字號
const nbDate = s => s.replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, '$1\u2011$2\u2011$3');
function enText(n){
  const v = n.nodeValue;
  if(!hasCJK(v) || wrote.get(n) === v) return;
  const w = toEn(v);
  if(w === null) mtQueue(n, null, v);
  else if(w !== v){ const x = nbDate(w); wrote.set(n, x); n.nodeValue = x; }
}
function enTree(root){
  const skip = {SCRIPT: 1, STYLE: 1, TEXTAREA: 1};
  if(root.nodeType === 3){ if(!root.parentElement || !root.parentElement.closest('[translate="no"]')) enText(root); return; }
  if(root.nodeType !== 1 || skip[root.tagName] || root.closest('[translate="no"]')) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 ? (skip[n.tagName] || noTr(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP)
                                      : NodeFilter.FILTER_ACCEPT });
  const nodes = [];
  for(let n = walker.nextNode(); n; n = walker.nextNode()) nodes.push(n);
  nodes.forEach(enText);
  for(const el of [root, ...root.querySelectorAll('[title],[placeholder],[aria-label]')])
    for(const a of EN_ATTRS){
      if(el.closest('[translate="no"]')) break;
      const v = el.getAttribute(a);
      if(!v || !hasCJK(v)) continue;
      const w = toEn(v);
      if(w === null) mtQueue(el, a, v);
      else if(w !== v) el.setAttribute(a, w);
    }
}

// 第一次選 EN 才下載字典，看中文的人完全不用載
function loadEn(){
  if(window.UI_EN) return Promise.resolve();
  if(!enLoading) enLoading = new Promise((ok, bad) => {
    const sc = document.createElement('script');
    sc.src = 'lang-en.js';
    sc.onload = ok;
    sc.onerror = () => { enLoading = null; bad(new Error('lang-en.js 載入失敗')); };
    document.head.appendChild(sc);
  });
  return enLoading;
}
async function startEnglish(){
  let err = null;
  try { await loadEn(); } catch(e) { err = e; }    // 字典載不到也照樣轉：全靠機器翻譯，總比整頁中文好
  const u = window.UI_EN || {};
  // 每條規則記下括號數：取代字串裡的 $12 在只有 9 個括號時要當 $1 接「2」（跟 String.replace 一樣）
  UI = {exact: u.exact || {},
        rules: (u.rules || []).map(([re, to]) => {
          try { return [new RegExp(re), to, new RegExp(re + '|').exec('').length - 1]; }
          catch(e) { return null; }
        }).filter(Boolean),                      // 一條規則寫壞不能拖垮整本字典
        // 送機器翻譯前要先換掉的專有名詞（人名、公司簡稱）：長的先換，「馬銀行」才不會被「銀行」搶先
        names: Object.entries(u.names || {}).sort((a, b) => b[0].length - a[0].length)};
  enLoad();
  document.title = EN_TITLE;
  enTree(document.body);
  if(!enObs){
    enObs = new MutationObserver(recs => {
      for(const r of recs){
        if(r.type === 'characterData') enTree(r.target);
        else r.addedNodes.forEach(enTree);
      }
      enObs.takeRecords();                       // 丟掉上面這幾行自己造成的變動，不然會沒完沒了
    });
    enObs.observe(document.body, {childList: true, subtree: true, characterData: true});
  }
  enObs.takeRecords();
  if(err) throw err;
}

document.querySelectorAll('#lang button').forEach(b => b.onclick = async () => {

  if(D) keepScroll(render);                      // 資料層的英文（英文原標題、IPO 板塊）要重畫才會換過來

  if(sheetSym && D){
