<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>馬股每日追蹤</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="馬股追蹤">
<style>
/* 淺色 · 極簡：一個表格搞定，只用髮絲線分隔，不用卡片和陰影 */
:root{
  --bg:#fff;
  --line:#e8eaee;
  --hair:#f1f3f5;
  --ink:#16191d;
  --ink-2:#6b737e;
  --ink-3:#a3aab4;
  --up:#0a7a45;
  --down:#c2261f;
  --flat:#a3aab4;
  --tint:#f7f8fa;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:34px 22px 70px}

header{display:flex;align-items:center;gap:9px;margin-bottom:24px}
.logo{border-radius:6px;flex:none}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.stamp{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
thead th{
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;padding-bottom:8px;
}
thead th:hover{color:var(--ink)}
th .a{opacity:.35;font-size:8.5px;margin-left:2px}
td{font-variant-numeric:tabular-nums}

/* 分類標題列 */
tr.group td{
  padding:22px 0 7px;border-bottom:1px solid var(--line);
  font-size:10.5px;font-weight:600;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.1em;text-align:left;
}
tr.group:first-child td{padding-top:8px}

tr.row{cursor:pointer}
tr.row:hover td{background:var(--tint)}
tr.row.on td{background:var(--tint)}
.name{font-weight:550}
.sym{color:var(--ink-3);font-size:10.5px;font-weight:400;margin-left:7px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.spark{display:block;width:74px;height:22px;margin-left:auto}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:7px;vertical-align:middle}
.dot.bad{background:var(--down)} .dot.warn{background:#d99100}

/* 展開列 */
tr.detail td{padding:0;background:var(--tint);border-bottom:1px solid var(--line);
             white-space:normal;text-align:left}
.dbox{padding:16px 0 20px}
.dnote{font-size:11.5px;color:var(--ink-2);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.chip{font-size:10.5px;padding:2.5px 9px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.chip.bad{color:var(--down);border-color:#f2cfcd}
.chip.good{color:var(--up);border-color:#c9e6d8}
.chip.warn{color:#8a5c00;border-color:#eeddb6}
.bigchart{display:block;width:100%;height:130px}
/* 有刻度的價格圖 */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart .gl{stroke:var(--hair);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.chart .last{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
/* 跟著游標的價格標籤 */
.tip{position:absolute;pointer-events:none;z-index:3;
     transform:translate(-50%,calc(-100% - 9px));
     background:var(--ink);color:#fff;font-size:11px;line-height:1.35;
     padding:4px 8px;border-radius:6px;white-space:nowrap;
     font-variant-numeric:tabular-nums;opacity:0;transition:opacity .09s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;
           border:4px solid transparent;border-top-color:var(--ink)}

/* 月價試算 */
.calc{margin-top:18px;padding:14px 15px;background:#fff;
      border:1px solid var(--line);border-radius:9px}
.calc h4{margin:0 0 3px;font-size:12px;font-weight:600;color:var(--ink)}
.calc .cnote{font-size:11px;color:var(--ink-3);margin:0 0 11px;line-height:1.65}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:14px}
.crow .op{color:var(--ink-3)}
.ci{width:96px;padding:6px 9px;font:inherit;font-size:13.5px;
    font-variant-numeric:tabular-nums;text-align:right;
    border:1px solid var(--line);border-radius:6px;background:var(--tint);color:var(--ink)}
.ci:focus{outline:none;border-color:var(--ink);background:#fff}
.cout{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clab{font-size:10.5px;color:var(--ink-3);width:100%;display:flex;gap:7px}
.clab span{width:96px;text-align:right}
.clab span:last-child{width:auto}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;
         font-size:11.5px;font-variant-numeric:tabular-nums;margin:5px 0 14px}
.readout .pt{color:var(--ink);font-weight:600}
.readout .rg{color:var(--ink-3)}
/* 圖表區間切換 */
.ranges{display:flex;gap:4px;margin:2px 0 10px}
.rng{font-size:11px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);
     background:#fff;color:var(--ink-2);cursor:pointer;line-height:1.5}
.rng:hover{color:var(--ink);border-color:#d4d9e0}
.rng.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.rmeta{font-size:11px;color:var(--ink-3);margin:0 0 14px;font-variant-numeric:tabular-nums}

/* 新聞 */
.news{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){ .news{grid-template-columns:1fr;gap:18px} }
.news h4{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;
         letter-spacing:.09em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lang{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;
      color:var(--ink-3);border:1px solid var(--line);background:#fff;
      border-radius:99px;padding:1px 8px;cursor:pointer}
.lang:hover{color:var(--ink);border-color:#d4d9e0}
.item{padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.it{display:block;font-size:12.5px;line-height:1.45;color:inherit;text-decoration:none}
.it:hover{color:#0b57d0;text-decoration:underline}
.im{font-size:10.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:7px}
.orig{font:inherit;font-size:10px;color:var(--ink-3);background:#fff;cursor:pointer;
      border:1px solid var(--line);border-radius:99px;padding:1px 7px;line-height:1.5}
.orig:hover{color:var(--ink);border-color:#d4d9e0}

/* 原文彈出視窗 */
.ovl{position:fixed;inset:0;z-index:60;display:none;padding:20px;
     align-items:center;justify-content:center;background:rgba(14,18,23,.42)}
.ovl.on{display:flex}
.dlg{background:#fff;border-radius:13px;width:100%;max-width:580px;max-height:82vh;
     overflow:auto;padding:20px 22px 18px;box-shadow:0 16px 48px rgba(16,24,40,.24)}
.dlg h5{margin:0 0 14px;font-size:10.5px;font-weight:600;color:var(--ink-3);
        text-transform:uppercase;letter-spacing:.09em;
        display:flex;align-items:center;justify-content:space-between}
.dlg .x{font-size:20px;line-height:1;color:var(--ink-3);background:none;border:none;
        cursor:pointer;padding:0 2px}
.dlg .x:hover{color:var(--ink)}
.dsec{margin-bottom:15px}
.dsec .k{font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px}
.dsec .en{font-size:15px;line-height:1.5;color:var(--ink)}
.dsec .zh{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.dfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
       border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--ink-3)}
.dfoot a{color:#0b57d0;text-decoration:none;font-weight:500}
.dfoot a:hover{text-decoration:underline}
@media(max-width:700px){
  .ovl{padding:0;align-items:flex-end}
  .dlg{max-width:none;border-radius:14px 14px 0 0;max-height:88vh;padding:18px 18px 22px}
}

/* ---------- 手機版的個股面板 ----------
   手機上把詳細資料塞在列表中間，會把下面的股票推到很遠，看完要捲很久才找得回原位。
   改成從底部滑上來的全螢幕面板，關掉就回到原本的位置。 */
.sheet{position:fixed;inset:0;z-index:55;display:none;background:rgba(14,18,23,.4)}
.sheet.on{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;top:34px;background:#fff;
          border-radius:15px 15px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
          box-shadow:0 -6px 30px rgba(16,24,40,.2)}
.sheet-bar{position:sticky;top:0;z-index:2;background:#fff;
           border-bottom:1px solid var(--line);padding:13px 16px 11px;
           display:flex;align-items:flex-start;gap:12px}
.sheet-bar .t{flex:1;min-width:0}
.sheet-bar .nm{font-size:15px;font-weight:600;line-height:1.3}
.sheet-bar .sy{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.sheet-bar .pr{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.sheet-bar .ch{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sheet-bar .x{font-size:24px;line-height:.8;color:var(--ink-3);background:none;
              border:none;cursor:pointer;padding:2px 0 2px 6px}
.sheet-body{padding:0 16px 40px}
.sheet-body .dbox{padding:14px 0 0}
.none{font-size:11.5px;color:var(--ink-3);padding:7px 0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 18px}
.dgrid .k{font-size:10.5px;color:var(--ink-3)}
.dgrid .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
       color:var(--ink-3);font-size:11px;line-height:1.9}
code{color:var(--ink-2)}
/* meta 欄只給手機用 */
.c-meta{display:none}

/* ---------- 手機版：不捲表格，改成兩行式列表 ----------
   name  ┊ 走勢 ┊ 股價
   P/B·ROE·息 ┊    ┊ 今日%                                        */
@media(max-width:700px){
  .wrap{padding:22px 15px 56px}
  .scroll{overflow:visible}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tr.group{display:block}
  tr.group td{display:block;padding:24px 0 7px;font-size:11px}

  tr.row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 66px auto;
    grid-template-areas:"nm tr pr" "mt tr ch";
    align-items:center;
    column-gap:12px;row-gap:3px;
    padding:14px 0;                      /* 點擊區至少 56px 高，手指按得準 */
    border-bottom:1px solid var(--hair);
    -webkit-tap-highlight-color:rgba(6,112,63,.07);
  }
  tr.row:active td{opacity:.55}
  tr.row td{display:block;border:none;padding:0;background:none !important}
  /* 注意：這些一定要用 tr.row 開頭，否則權重輸給上面的 `tr.row td`，display:none 不會生效 */
  tr.row td.c-name {grid-area:nm;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  tr.row td.c-meta {grid-area:mt;display:block;font-size:11px;color:var(--ink-3);
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.row td.c-trend{grid-area:tr;align-self:center}
  tr.row td.c-trend .spark{width:66px;height:28px}
  tr.row td.c-price{grid-area:pr;text-align:right;font-size:16px;font-weight:650}
  tr.row td.c-d1   {grid-area:ch;text-align:right;font-size:12.5px;font-weight:600}
  tr.row td.c-m1,
  tr.row td.c-pb,
  tr.row td.c-roe,
  tr.row td.c-yld  {display:none}

  tr.detail{display:block}
  tr.detail td{display:block}
  .dbox{padding:12px 0 18px}
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 14px}
  .bigchart{height:150px}
  .chips{gap:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon.svg" alt="" width="26" height="26">
    <h1 id="title">馬股每日追蹤</h1>
    <span class="stamp" id="updated"></span>
  </header>

  <div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>

  <footer>
    每天更新 <code>python3 fetch.py</code> · 自動化 <code>./install_daily.sh</code> · 改追蹤清單 <code>watchlist.json</code><br>
    收盤價，非即時報價。僅為資訊整理，不構成投資建議。
  </footer>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="sheet-bar">
      <div class="t"><div class="nm" id="sh-name"></div><div class="sy" id="sh-sym"></div></div>
      <div><div class="pr" id="sh-price"></div><div class="ch" id="sh-chg"></div></div>
      <button class="x" type="button" id="sh-x" aria-label="關閉">&times;</button>
    </div>
    <div class="sheet-body" id="sh-body"></div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="dlg" role="dialog" aria-modal="true" aria-label="原文">
    <h5>原文 <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">${failed ? 'ENGLISH（這則翻譯失敗，下次更新會再試）' : 'ENGLISH'}</div><div class="en" id="ovl-en"></div></div>
    <div class="dsec"><div class="k">中譯（機器翻譯）</div><div class="zh" id="ovl-zh"></div></div>
    <div class="dfoot"><span id="ovl-src"></span>
      <a id="ovl-url" href="#" target="_blank" rel="noopener">開啟原文網頁 →</a></div>
  </div>
</div>

<script src="data/data.js"></script>
<script>
const D = window.STOCK_DATA;
const $ = s => document.querySelector(s);

const num = v => { if(v==null) return null;
  const n = parseFloat(String(v).replace(/[%,]/g,'')); return isNaN(n)?null:n; };
const cls = v => v==null ? 'flat' : v>0 ? 'up' : v<0 ? 'down' : 'flat';
const pc  = v => v==null ? '—' : (v>0?'+':'') + v.toFixed(2) + '%';
const px  = (v,i) => v==null ? '—'
  : Math.abs(v) >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:0})
  : i ? v.toLocaleString(undefined,{maximumFractionDigits:2})
  : v.toFixed(Math.abs(v) < 1 ? 3 : 2);

function spark(series, w, h, big){
  const p = series.map(x=>x.close);
  if(p.length<2) return '';
  const lo=Math.min(...p), hi=Math.max(...p), span=(hi-lo)||1;
  const d = p.map((v,i)=>`${i?'L':'M'}${(i/(p.length-1)*w).toFixed(1)} ${(h-(v-lo)/span*(h-3)-1.5).toFixed(1)}`).join(' ');
  const col = p[p.length-1] >= p[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="${big?'bigchart':'spark'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="${big?1.6:1.3}"
          stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}



/* ---------- 月價試算 ----------
   使用者的算法：30 日均價 × 30 ÷ 自訂係數。
   三個欄位都可以改，係數會記在瀏覽器裡，下次打開還在。 */
const CALC_KEY = 'palm_divisor';

function calculator(s){
  const saved = (() => { try { return localStorage.getItem(CALC_KEY); } catch(e) { return null; } })();
  return `<div class="calc" data-calc>
    <h4>月價試算</h4>
    <p class="cnote">預設帶入 30 日均價 <b>${px(s.avg30)}</b>（近 ${s.avg30_days} 個交易日收盤加總 ÷ ${s.avg30_days}）。
       三個欄位都可以改，會即時重算。</p>
    <div class="crow">
      <input class="ci" data-k="a" value="${s.avg30}" inputmode="decimal">
      <span class="op">×</span>
      <input class="ci" data-k="b" value="30" inputmode="decimal">
      <span class="op">÷</span>
      <input class="ci" data-k="c" value="${saved || '18.6'}" inputmode="decimal">
      <span class="op">=</span>
      <span class="cout"></span>
    </div>
    <div class="clab"><span>均價</span><span></span><span>天數</span><span></span><span>係數</span></div>
  </div>`;
}

function wireCalculator(root){
  const box = root.querySelector('[data-calc]');
  if(!box) return;
  const get = k => parseFloat(box.querySelector(`[data-k="${k}"]`).value);
  const out = box.querySelector('.cout');
  const run = () => {
    const a = get('a'), b = get('b'), c = get('c');
    if(!isFinite(a) || !isFinite(b) || !isFinite(c) || c === 0){
      out.textContent = '—';
      out.className = 'cout flat';
      return;
    }
    out.textContent = 'RM ' + (a * b / c).toLocaleString(undefined,
      {minimumFractionDigits: 2, maximumFractionDigits: 2});
    out.className = 'cout';
  };
  box.querySelectorAll('.ci').forEach(el => {
    el.addEventListener('input', () => {
      if(el.dataset.k === 'c'){
        try { localStorage.setItem(CALC_KEY, el.value); } catch(e) {}
      }
      run();
    });
    el.addEventListener('click', e => e.stopPropagation());   // 別收合這一列
  });
  box.addEventListener('click', e => e.stopPropagation());
  run();
}

/* ---------- 有刻度的價格圖 ----------
   小縮圖不需要刻度，但展開後的圖要能回答「多少錢、在什麼價位」，
   所以這裡畫格線 + 右側價格刻度 + 最新價標記，滑過去還能看單日價格。 */
function priceChart(host, series, isIdx){
  const W = Math.max(280, host.clientWidth || 640), H = 168;
  const P = {t:10, r:54, b:18, l:2};
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const pts = series.map(d=>d.close);
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if(hi === lo){ hi += hi*0.01 || 1; lo -= lo*0.01 || 1; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;

  const X = i => P.l + (series.length<2 ? pw/2 : i/(series.length-1)*pw);
  const Y = v => P.t + ph - (v-lo)/(hi-lo)*ph;

  // 找好看的刻度間距（1 / 2 / 2.5 / 5 的倍數）
  const rough = (hi-lo)/4, mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1,2,2.5,5,10].find(m => m*mag >= rough) * mag;
  const ticks = [];
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step) ticks.push(v);

  const last = series[series.length-1];
  const rising = pts[pts.length-1] >= pts[0];
  const col = rising ? 'var(--up)' : 'var(--down)';
  const line = series.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d.close).toFixed(1)}`).join(' ');
  const gid = 'pg'+Math.random().toString(36).slice(2,7);

  // x 軸日期：頭、尾、加中間兩點
  const xi = [0, Math.round((series.length-1)/3), Math.round((series.length-1)*2/3), series.length-1];
  const xlab = [...new Set(xi)].map(i=>{
    const [y,m,d] = series[i].date.split('-');
    const anchor = i===0 ? 'start' : i===series.length-1 ? 'end' : 'middle';
    return `<text class="axis" x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${anchor}">${m}/${d}</text>`;
  }).join('');

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".16"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>{
      // 格線照畫，但刻度數字若跟「最新價」標籤太近就省略，免得疊在一起
      const near = Math.abs(Y(v) - Y(last.close)) < 11;
      return `<line class="gl" x1="${P.l}" x2="${P.l+pw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>` +
        (near ? '' : `<text class="axis" x="${P.l+pw+7}" y="${(Y(v)+3.5).toFixed(1)}">${px(v,isIdx)}</text>`);
    }).join('')}
    <path d="${line} L${X(series.length-1).toFixed(1)} ${P.t+ph} L${P.l} ${P.t+ph} Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${P.t+ph}" style="display:none"/>
    <circle class="hov" r="3.5" fill="${col}" style="display:none"/>
    <circle cx="${X(series.length-1).toFixed(1)}" cy="${Y(last.close).toFixed(1)}" r="3" fill="${col}"/>
    <text class="last" x="${P.l+pw+7}" y="${(Y(last.close)+3.5).toFixed(1)}" fill="${col}">${px(last.close,isIdx)}</text>
    ${xlab}
  </svg>`;

  return {X, Y, P, pw, svg: host.querySelector('svg')};
}

/* 欄位：只留真正每天會看的 */
const COLS = [
  {k:'name', t:'',  cell:s=>{
      const bad = (s.flags||[]).find(f=>f.level==='bad');
      const warn = (s.flags||[]).find(f=>f.level==='warn');
      const dot = bad ? '<span class="dot bad"></span>' : warn ? '<span class="dot warn"></span>' : '';
      return `<span class="name">${s.name}</span><span class="sym">${s.symbol}</span>${dot}`; },
     sort:s=>s.name, dir:1},
  {k:'trend',t:'走勢·半年', cell:s=>spark(s.series.slice(-126),74,22,false), sort:s=>s.change_pct_1m},
  {k:'price',t:'股價',   cell:s=>px(s.price,s.is_index), sort:s=>s.price},
  {k:'d1',   t:'今日',   cell:s=>`<span class="${cls(s.change_pct_1d)}">${pc(s.change_pct_1d)}</span>`, sort:s=>s.change_pct_1d},
  {k:'m1',   t:'1個月',  cell:s=>`<span class="${cls(s.change_pct_1m)}">${pc(s.change_pct_1m)}</span>`, sort:s=>s.change_pct_1m},
  {k:'pb',   t:'P/B',    cell:s=>s.fundamentals.pb_ratio || '—',  sort:s=>num(s.fundamentals.pb_ratio), dir:1},
  {k:'roe',  t:'ROE',    cell:s=>s.fundamentals.roe || '—',       sort:s=>num(s.fundamentals.roe)},
  {k:'yld',  t:'殖利率', cell:s=>s.fundamentals.div_yield || '—', sort:s=>num(s.fundamentals.div_yield)},
  // 只在手機版顯示：把 P/B、ROE、殖利率併成一行，省掉橫向捲動
  {k:'meta', t:'', nosort:true, cell:s=>{
      const f = s.fundamentals || {};
      const bits = [];
      if(f.pb_ratio)  bits.push('P/B ' + f.pb_ratio);
      if(f.roe)       bits.push('ROE ' + f.roe);
      if(f.div_yield) bits.push('息 ' + f.div_yield);
      if(!bits.length) bits.push('1個月 ' + pc(s.change_pct_1m));
      return bits.join(' · '); }},
];

const ORDER = ['大盤','銀行','REIT','油棕','其他'];
// 區間用交易日數估：一個月約 21 個交易日
const RANGES = [{t:'1個月',d:21},{t:'3個月',d:63},{t:'半年',d:126},{t:'1年',d:0}];
let sortKey = null, sortDir = 1, openSym = null, chartRange = 126;

function detailRow(s){
  const f = s.fundamentals || {};
  const cells = [
    ['前收', px(s.prev_close,s.is_index)], ['當日高', px(s.day_high,s.is_index)], ['當日低', px(s.day_low,s.is_index)],
    ['5 日', pc(s.change_pct_5d)], ['3 個月', pc(s.change_pct_3m)], ['1 年', pc(s.change_pct_1y)],
    ['52週高', px(s.high_52w,s.is_index)], ['52週低', px(s.low_52w,s.is_index)], ['距高點', pc(s.off_52w_high)],
    ['成交量', s.volume ? s.volume.toLocaleString() : '—'],
    ['量能倍數', s.volume_ratio ? s.volume_ratio+'x' : '—'],
    ['市值', f.market_cap], ['P/E', f.pe_ratio], ['每股淨值', f.bvps], ['EPS', f.eps], ['ROA', f.roa],
    ['每股派息', f.dps], ['派息率', f.payout_ratio], ['除息日', f.ex_div_date],
    ['下次財報', f.earnings_date], ['分析師', f.analyst_rating_zh || f.analyst_rating], ['目標價', f.analyst_target],
  ].filter(([,v]) => v!=null && v!=='' && v!=='—');
  const COLORED = ['5 日','3 個月','1 年','距高點'];

  const esc = t => (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const feed = (list, empty) => list && list.length
    ? list.map(n => {
        const zh = n.title_zh || n.title, en = n.title || '';
        const translated = zh !== en;
        const hasBody = !!(n.body_zh || n.body);
        return `<div class="item"
             data-zh="${esc(zh)}" data-en="${esc(en)}"
             data-src="${esc([n.source_zh || n.source, n.when].filter(Boolean).join(' · '))}"
             data-url="${esc(n.url)}"
             data-body-en="${esc(n.body || '')}"
             data-body-zh="${esc(n.body_zh || '')}">
          <a class="it" href="${esc(n.url)}" target="_blank" rel="noopener">${zh}</a>
          <div class="im">${[n.source_zh || n.source, n.when].filter(Boolean).join(' · ')}
            ${(translated || hasBody) ? `<button class="orig" type="button">${hasBody ? '讀全文' : '原文'}</button>` : ''}</div>
        </div>`;
      }).join('')
    : `<div class="none">${empty}</div>`;

  const tr = document.createElement('tr');
  tr.className = 'detail';
  tr.innerHTML = `<td colspan="${COLS.length}"><div class="dbox">
    <div class="dnote">${s.note||''}${s.market_time?' · 最後成交 '+s.market_time:''}</div>
    <div class="chips">${(s.flags||[]).map(f=>`<span class="chip ${f.level}">${f.text}</span>`).join('')}</div>
    <div class="ranges">${RANGES.map(r=>
      `<span class="rng ${r.d===chartRange?'on':''}" data-d="${r.d}">${r.t}</span>`).join('')}</div>
    <div class="chartslot"></div>
    <div class="dgrid">${cells.map(([k,v])=>
      `<div><div class="k">${k}</div><div class="v ${COLORED.includes(k)?cls(num(v)):''}">${v}</div></div>`
    ).join('')}</div>
    ${s.calculator ? calculator(s) : ''}
    <div class="news">
      <div><h4>媒體報導 <span class="lang" data-lang="en">原文</span></h4>
${feed(s.articles, '近三個月沒有相關報導')}</div>
      <div><h4>Bursa 公告 <span class="lang" data-lang="en">原文</span></h4>
${feed(s.filings, '沒有抓到公告')}</div>
    </div>
  </div></td>`;

  const slot = tr.querySelector('.chartslot');
  const draw = () => {
    const cut = RANGES.find(r=>r.d===chartRange).d;
    const seg = cut ? s.series.slice(-cut) : s.series;
    const chg = (seg[seg.length-1].close / seg[0].close - 1) * 100;

    slot.innerHTML = `<div class="chart"></div>
      <div class="readout">
        <span class="pt"></span>
        <span class="rg">區間 ${seg[0].date} → ${seg[seg.length-1].date} ·
          ${seg.length} 個交易日 · <span class="${cls(chg)}">${pc(chg)}</span></span>
      </div>`;

    const host = slot.querySelector('.chart');
    const {X, Y, P, pw, svg} = priceChart(host, seg, s.is_index);
    const tip = document.createElement('div');
    tip.className = 'tip';
    host.appendChild(tip);
    const out   = slot.querySelector('.readout .pt');
    const cross = svg.querySelector('.cross');
    const hov   = svg.querySelector('.hov');

    // 沒有指到任何一天時，顯示最新收盤
    const base = () => {
      const d = seg[seg.length - 1];
      out.innerHTML = `最新 ${d.date} · <b>${px(d.close, s.is_index)}</b>`;
      cross.style.display = 'none';
      hov.style.display = 'none';
      tip.classList.remove('on');
    };
    base();

    // 滑鼠移過去 / 手指滑過去，顯示那一天的日期與價格
    const track = clientX => {
      const r = svg.getBoundingClientRect();
      const vx = (clientX - r.left) / r.width * svg.viewBox.baseVal.width;
      const i = Math.max(0, Math.min(seg.length - 1,
                Math.round((vx - P.l) / pw * (seg.length - 1))));
      const d = seg[i];
      const vs = (d.close / seg[0].close - 1) * 100;
      out.innerHTML = `${d.date} · <b>${px(d.close, s.is_index)}</b>
        <span class="${cls(vs)}">${pc(vs)}</span>`;
      const cx = X(i);
      cross.setAttribute('x1', cx);
      cross.setAttribute('x2', cx);
      cross.style.display = '';
      hov.setAttribute('cx', cx);
      hov.setAttribute('cy', Y(d.close));
      hov.style.display = '';

      // 標籤跟著游標，貼在資料點正上方；靠近邊緣時往內收，不要被切掉
      tip.innerHTML = `<b>${px(d.close, s.is_index)}</b>${s.unit ? ' ' + s.unit : ''}<br>${d.date}`;
      tip.classList.add('on');
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.max(half + 2, Math.min(host.clientWidth - half - 2, cx)) + 'px';
      tip.style.top  = Y(d.close) + 'px';
    };

    svg.addEventListener('pointermove',  e => { e.stopPropagation(); track(e.clientX); });
    svg.addEventListener('pointerleave', base);
    svg.addEventListener('touchmove',    e => track(e.touches[0].clientX), {passive: true});
    svg.addEventListener('touchend',     base);
    svg.addEventListener('click',        e => e.stopPropagation());
  };

  // 「原文 / 中文」切換：翻譯是機器翻的，遇到專有名詞或金融術語想核對時用得上
  tr.querySelectorAll('.lang').forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const toEn = btn.dataset.lang === 'en';
    btn.dataset.lang = toEn ? 'zh' : 'en';
    btn.textContent = toEn ? '中文' : '原文';
    btn.closest('div').querySelectorAll('.item').forEach(it => {
      const v = toEn ? it.dataset.en : it.dataset.zh;
      if(v) it.querySelector('.it').textContent = v;
    });
  });

  tr._redraw = draw;                         // 由 render() 在插進 DOM 後呼叫（那時才量得到寬度）
  wireCalculator(tr);
  tr.querySelectorAll('.rng').forEach(b => b.onclick = ev => {
    ev.stopPropagation();                    // 別讓點擊冒泡去收合這一列
    chartRange = +b.dataset.d;
    tr.querySelectorAll('.rng').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  return tr;
}

function render(){
  $('#title').textContent = D.title;
  $('#updated').textContent = D.updated_at;

  $('#head').innerHTML = '<tr>' + COLS.map(c =>
    `<th data-k="${c.k}" class="c-${c.k}">${c.t}<span class="a">${
      sortKey===c.k ? (sortDir>0?'▲':'▼') : (c.t?'⇅':'')}</span></th>`).join('') + '</tr>';
  $('#head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = COLS.find(x=>x.k===th.dataset.k);
    if(c.nosort) return;
    if(sortKey===c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.dir || -1; }
    render();
  });

  const body = $('#body'); body.innerHTML = '';
  ORDER.forEach(sec => {
    let list = D.stocks.filter(s=>s.sector===sec);
    if(!list.length) return;

    if(sortKey){
      const g = COLS.find(c=>c.k===sortKey).sort;
      list = [...list].sort((a,b)=>{
        const av=g(a), bv=g(b);
        if(av==null) return 1; if(bv==null) return -1;
        return typeof av === 'string' ? sortDir*av.localeCompare(bv,'zh-Hant') : sortDir*(av-bv);
      });
    }

    const gr = document.createElement('tr');
    gr.className = 'group';
    gr.innerHTML = `<td colspan="${COLS.length}">${sec}</td>`;
    body.appendChild(gr);

    list.forEach(s => {
      const tr = document.createElement('tr');
      tr.className = 'row' + (openSym===s.symbol ? ' on' : '');
      tr.innerHTML = COLS.map(c=>`<td class="c-${c.k}">${c.cell(s)}</td>`).join('');
      tr.onclick = () => {
        if(isMobile()){ openSheet(s); return; }
        openSym = openSym === s.symbol ? null : s.symbol;
        render();
      };
      body.appendChild(tr);
      if(openSym === s.symbol && !isMobile()){
        const d = detailRow(s);
        body.appendChild(d);
        d._redraw();                         // 插入後才畫圖，這樣量得到實際寬度
      }
    });
  });
}
/* ---------- 原文彈出視窗 ----------
   機器翻譯遇到金融術語一定會有偏差，要能隨時叫出原文對照。
   用彈窗而不是 title 提示，因為手機沒有 hover。 */
const isMobile = () => matchMedia('(max-width:700px)').matches;

/* ---------- 手機的個股面板 ---------- */
const sheet = document.getElementById('sheet');

function openSheet(s){
  document.getElementById('sh-name').textContent = s.name;
  document.getElementById('sh-sym').textContent  = s.symbol + (s.unit ? ' · ' + s.unit : '');
  document.getElementById('sh-price').textContent = px(s.price, s.is_index);
  const chg = document.getElementById('sh-chg');
  chg.textContent = pc(s.change_pct_1d);
  chg.className = 'ch ' + cls(s.change_pct_1d);

  const host = document.getElementById('sh-body');
  host.innerHTML = '';
  const row = detailRow(s);                    // 沿用同一份內容，不另外維護一套
  host.appendChild(row.querySelector('.dbox'));
  sheet.classList.add('on');
  document.body.style.overflow = 'hidden';
  row._redraw();
  wireCalculator(host);
}

function closeSheet(){
  sheet.classList.remove('on');
  document.body.style.overflow = '';
}
document.getElementById('sh-x').onclick = closeSheet;
sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });

const ovl = document.getElementById('ovl');

function showOriginal(item){
  const d = item.dataset;
  const dlg = ovl.querySelector('.dlg');
  let bodyZh = d.bodyZh || '';
  const bodyEn = d.bodyEn || '';
  // 翻譯失敗時 body_zh 會等於原文，那就別重複顯示，也別謊稱是「機器翻譯」
  const failed = bodyZh && bodyEn && bodyZh === bodyEn;
  if(failed) bodyZh = '';

  // 有全文就以中譯全文為主，原文標題放後面對照；
  // 媒體報導抓不到全文（Google News 把真實網址藏起來了），就只顯示標題對照。
  dlg.innerHTML = `
    <h5>${bodyZh ? '公告全文' : '原文對照'} <button class="x" type="button" aria-label="關閉">&times;</button></h5>
    <div class="dsec"><div class="k">${bodyZh ? '標題' : '中譯（機器翻譯）'}</div>
      <div class="${bodyZh ? 'zh' : 'en'}" style="font-weight:600">${esc(d.zh)}</div></div>
    ${bodyZh ? `<div class="dsec"><div class="k">內文（機器翻譯）</div>
      <div class="zh" id="ovl-body">${esc(bodyZh).replace(/\n/g,'<br>')}</div></div>` : ''}
    <div class="dsec"><div class="k">${failed ? 'ENGLISH（這則翻譯失敗，下次更新會再試）' : 'ENGLISH'}</div>
      <div class="en" style="font-size:13px">${esc(d.en)}</div>
      ${bodyEn ? `<div class="en" style="font-size:12.5px;color:var(--ink-2);margin-top:7px">${esc(bodyEn).replace(/\n/g,'<br>')}</div>` : ''}</div>
    <div class="dfoot"><span>${esc(d.src || '')}</span>
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">開啟來源網頁 →</a>` : ''}</div>`;
  ovl.classList.add('on');
}

function esc(t){
  return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const closeOverlay = () => ovl.classList.remove('on');

ovl.addEventListener('click', e => { if(e.target === ovl || e.target.classList.contains('x')) closeOverlay(); });
addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(ovl.classList.contains('on')) closeOverlay();   // 先關上層的原文彈窗
  else closeSheet();
});

// 事件委派：新聞是動態產生的，綁在 document 上就不用每次重綁
document.addEventListener('click', e => {
  const btn = e.target.closest('.orig');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  showOriginal(btn.closest('.item'));
});

render();

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const d = document.querySelector('tr.detail');
    if(d && d._redraw) d._redraw();
  }, 150);
});
</script>
</body>
</html>
